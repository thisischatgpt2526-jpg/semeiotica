, funghi, virus).\n\n   •   Non richiede anticorpi.\n\n   •   Coinvolge:\n       C3, Fattore B, Fattore D, Properdina.\n\n   •   C3 convertasi:\n       C3bBb.\n\nC. Via Lectinica (della Mannosio-Lectina)\n   •   Attivata dal legame della MBL (Mannose-Binding Lectin) ai residui di mannosio\n       presenti sui microrganismi.\n\n   •   Coinvolge le proteasi MASP-1 e MASP-2.\n\n   •   Produce la stessa C3 convertasi della via classica:\n       C4b2a.","kind":"study","source":{"document":"Semeiotica domande completo","page":18,"section":"Domande e appunti · raccolta principale","number":1,"sourceId":"appunti-1"},"legacyOfficialIds":["official-18-1-0"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-2","sourceId":"appunti-2","apparato":"Sistema nervoso","organo":"Esame neurologico e sintomi","cartella":"Domande e appunti · raccolta principale","def":"dolore della fibromialgia:","term":"dolore della fibromialgia:\nDiffuso: interessa più regioni del corpo contemporaneamente, spesso sopra e sotto la vita\ne su entrambi i lati.\nCronico: dura almeno 3 mesi.\nMuscoloscheletrico: viene descritto come dolore ai muscoli, ai tendini e alle articolazioni,\nanche se non c'è infiammazione articolare oggettiva.\nVariabile: può essere percepito come bruciore, indolenzimento, rigidità, fitte o sensazione\ndi corpo \"ammaccato\".\nAssociato a iperalgesia e allodinia:\n\n   •   Iperalgesia = uno stimolo doloroso viene percepito come molto più intenso del\n       normale.\n\n   •   Allodinia = uno stimolo normalmente non doloroso (es. una lieve pressione o il\n       contatto con i vestiti) provoca dolore.\n\nPeggiora frequentemente con stress, sonno non ristoratore, freddo, umidità,\naffaticamento fisico o mentale.","kind":"study","source":{"document":"Semeiotica domande completo","page":19,"section":"Domande e appunti · raccolta principale","number":2,"sourceId":"appunti-2"},"legacyOfficialIds":["official-19-2-0"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-3","sourceId":"appunti-3","apparato":"Chirurgia","organo":"Addome e urgenze chirurgiche","cartella":"Domande e appunti · raccolta principale","def":"dolore di ernia discale:","term":"dolore di ernia discale:\nDolore irradiato lungo il territorio del nervo interessato.\n\n   •   Ernia lombare → dolore che si irradia a gluteo, coscia, gamba e piede (sciatalgia o\n       cruralgia).\n   •   Ernia cervicale → dolore che si irradia a spalla, braccio e mano\n       (cervicobrachialgia).\n\nTipo di dolore:\n\n   •   trafittivo\n\n   •   urente (bruciante)\n\n   •   folgorante (\"scossa elettrica\")\n   •   lancinante\n\nPeggiora con:\n\n   •   tosse\n\n   •   starnuto\n   •   manovra di Valsalva\n\n   •   flessione del tronco\n\nPuò associarsi a:\n\n   •   parestesie (formicolii)\n\n   •   ipoestesia (ridotta sensibilità)\n\n   •   deficit di forza muscolare\n\n   •   riduzione o abolizione dei riflessi osteotendinei","kind":"study","source":{"document":"Semeiotica domande completo","page":19,"section":"Domande e appunti · raccolta principale","number":3,"sourceId":"appunti-3"},"legacyOfficialIds":["official-19-3-1"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-4","sourceId":"appunti-4","apparato":"Sistema nervoso","organo":"Esame neurologico e sintomi","cartella":"Domande e appunti · raccolta principale","def":"l'anosmia: L'anosmia è la perdita completa dell'olfatto, cioè l'incapacità di percepire","term":"l'anosmia: L'anosmia è la perdita completa dell'olfatto, cioè l'incapacità di percepire\ngli odori.\n\nPuò essere:\n\n   •   Totale: assenza completa della percezione degli odori.\n   •   Parziale (più correttamente detta iposmia): riduzione della capacità olfattiva.\nCause principali\n\n   •   Raffreddore, rinite, sinusite.\n\n   •   Polipi nasali.\n\n   •   Infezioni virali (ad esempio COVID-19).\n\n   •   Traumi cranici con lesione del nervo olfattivo.\n\n   •   Malattie neurodegenerative come Malattia di Parkinson e Malattia di Alzheimer.\n   •   Tumori della base cranica o del lobo frontale.","kind":"study","source":{"document":"Semeiotica domande completo","page":20,"section":"Domande e appunti · raccolta principale","number":4,"sourceId":"appunti-4"},"legacyOfficialIds":["official-20-4-0"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-5","sourceId":"appunti-5","apparato":"Apparato endocrino e metabolismo","organo":"Endocrinologia e bilancio idroelettrolitico","cartella":"Domande e appunti · raccolta principale","def":"ipofisite linfocitaria: è la perdita completa dell'olfatto, cioè l'incapacità di percepire","term":"ipofisite linfocitaria: è la perdita completa dell'olfatto, cioè l'incapacità di percepire\ngli odori.\n\nPuò essere:\n\n   •   Totale: assenza completa della percezione degli odori.\n\n   •   Parziale (più correttamente detta iposmia): riduzione della capacità olfattiva.\n\nCause principali\n\n   •   Raffreddore, rinite, sinusite.\n\n   •   Polipi nasali.\n   •   Infezioni virali (ad esempio COVID-19).\n\n   •   Traumi cranici con lesione del nervo olfattivo.\n   •   Malattie neurodegenerative come Malattia di Parkinson e Malattia di Alzheimer.\n\n   •   Tumori della base cranica o del lobo frontale.\n\nDisturbi correlati\n\n   •   Iposmia → riduzione dell'olfatto.\n\n   •   Iperosmia → aumento della sensibilità agli odori.\n\n   •   Parosmia → percezione distorta degli odori.\n\n   •   Cacosmia → percezione di odori sgradevoli inesistenti.\n\n   •   Fantosmia → percezione di odori in assenza di uno stimolo reale.","kind":"study","source":{"document":"Semeiotica domande completo","page":20,"section":"Domande e appunti · raccolta principale","number":5,"sourceId":"appunti-5"},"legacyOfficialIds":["official-20-5-1"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-6","sourceId":"appunti-6","apparato":"Semeiotica generale","organo":"Diagnostica molecolare","cartella":"Domande e appunti · raccolta principale","def":"qual è il limite del microarray rispetto a NGS:","term":"qual è il limite del microarray rispetto a NGS:\n\nè che il microarray può identificare solo varianti già note e per cui sono state\nprogettate specifiche sonde, mentre il NGS può rilevare anche varianti nuove o inattese.","kind":"study","source":{"document":"Semeiotica domande completo","page":21,"section":"Domande e appunti · raccolta principale","number":6,"sourceId":"appunti-6"},"legacyOfficialIds":["official-21-6-0"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-7","sourceId":"appunti-7","apparato":"Apparato endocrino e metabolismo","organo":"Endocrinologia e bilancio idroelettrolitico","cartella":"Domande e appunti · raccolta principale","def":"sindrome sheehan: è un ipopituitarismo post-partum causato da necrosi","term":"sindrome sheehan: è un ipopituitarismo post-partum causato da necrosi\nischemica dell'ipofisi anteriore in seguito a una grave emorragia ostetrica con\nipotensione o shock.","kind":"study","source":{"document":"Semeiotica domande completo","page":21,"section":"Domande e appunti · raccolta principale","number":7,"sourceId":"appunti-7"},"legacyOfficialIds":["official-21-7-1"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-8","sourceId":"appunti-8","apparato":"Apparato endocrino e metabolismo","organo":"Diabete e metabolismo","cartella":"Domande e appunti · raccolta principale","def":"OGTT: è il test da carico orale di glucosio, utilizzato per valutare la capacità","term":"OGTT: è il test da carico orale di glucosio, utilizzato per valutare la capacità\ndell'organismo di metabolizzare il glucosio e per diagnosticare il diabete mellito o il\nprediabete.\n\nCome si esegue\n\n   1. Digiuno di almeno 8 ore.\n   2. Misurazione della glicemia basale.\n   3. Assunzione orale di 75 g di glucosio (negli adulti).\n\n   4. Misurazione della glicemia dopo 2 ore (e talvolta a intervalli intermedi).\n\nInterpretazione (criteri OMS/ADA)\n\nGlicemia a 2 ore dopo OGTT:\n\n   •   \u003c 140 mg/dL → normale\n\n   •   140–199 mg/dL → ridotta tolleranza al glucosio (IGT, prediabete)\n\n   •   ≥ 200 mg/dL → diabete mellito\nDiagnosi di diabete mellito\n\nÈ possibile porre diagnosi se è presente uno dei seguenti:\n\n   •   Glicemia a digiuno ≥ 126 mg/dL.\n   •   Glicemia a 2 ore dopo OGTT ≥ 200 mg/dL.\n\n   •   HbA1c ≥ 6,5%.\n\n   •   Glicemia casuale ≥ 200 mg/dL con sintomi tipici.","kind":"study","source":{"document":"Semeiotica domande completo","page":21,"section":"Domande e appunti · raccolta principale","number":8,"sourceId":"appunti-8"},"legacyOfficialIds":["official-21-8-2","official-21-1-3","official-21-2-4","official-21-3-5","official-21-4-6"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-9","sourceId":"appunti-9","apparato":"Semeiotica generale","organo":"Esame obiettivo e laboratorio","cartella":"Domande e appunti · raccolta principale","def":"se ho albumina pari a 1.5 mg/dl, l'edema per quale motivo si forma: il meccanismo","term":"se ho albumina pari a 1.5 mg/dl, l'edema per quale motivo si forma: il meccanismo\nprincipale è proprio la riduzione della pressione oncotica plasmatica dovuta a una\ngrave ipoalbuminemia.\nCon albumina a 1,5 mg/dL (valore estremamente basso, compatibile con situazione\ncritica), succede questo:\nNel microcircolo esiste un equilibrio tra:\n\n   •   pressione idrostatica → spinge acqua fuori dai capillari\n\n   •   pressione oncotica (colloidosmotica), soprattutto da albumina → richiama acqua\n       dentro i capillari","kind":"study","source":{"document":"Semeiotica domande completo","page":22,"section":"Domande e appunti · raccolta principale","number":9,"sourceId":"appunti-9"},"legacyOfficialIds":["official-22-9-0"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-10","sourceId":"appunti-10","apparato":"Chirurgia","organo":"Addome e urgenze chirurgiche","cartella":"Domande e appunti · raccolta principale","def":"LYMPHA per cosa si effettua:","term":"LYMPHA per cosa si effettua:\nÈ una tecnica chirurgica usata durante la rimozione dei linfonodi (linfadenectomia),\nsoprattutto in oncologia (es. tumore della mammella), per cercare di prevenire il linfedema.","kind":"study","source":{"document":"Semeiotica domande completo","page":22,"section":"Domande e appunti · raccolta principale","number":10,"sourceId":"appunti-10"},"legacyOfficialIds":["official-22-10-1"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-11","sourceId":"appunti-11","apparato":"Chirurgia","organo":"Addome e urgenze chirurgiche","cartella":"Domande e appunti · raccolta principale","def":"Bloomberg: è un segno clinico usato per valutare la presenza di irritazione","term":"Bloomberg: è un segno clinico usato per valutare la presenza di irrit "Vomito caffeano definizione: è un vomito di colore bruno-scuro/nerastro, con","term":"Vomito caffeano definizione: è un vomito di colore bruno-scuro/nerastro, con\naspetto simile ai fondi di caffè.\nSi verifica quando il sangue è rimasto per un certo tempo nello stomaco ed è stato\nparzialmente digerito dall'acido gastrico, che trasforma l'emoglobina in ematina.\n\nIndica quindi generalmente un'emorragia del tratto gastrointestinale superiore (esofago,\nstomaco, duodeno) che non è così rapida da provocare l'emissione di sangue rosso vivo\n(ematemesi).","kind":"study","source":{"document":"Semeiotica domande completo","page":42,"section":"Domande e appunti · raccolta principale","number":189,"sourceId":"appunti-189"},"legacyOfficialIds":["official-42-189-0"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-190","sourceId":"appunti-190","apparato":"Apparato gastrointestinale","organo":"Esofago e stomaco","cartella":"Domande e appunti · raccolta principale","def":"Rigurgito definizione: è la risalita passiva del contenuto gastrico o esofageo","term":"Rigurgito definizione: è la risalita passiva del contenuto gastrico o esofageo\nnella bocca, senza nausea, conati o contrazioni del vomito.\n\nCaratteristiche principali:\n\n   •   È un fenomeno passivo.\n   •   Il materiale risale spontaneamente in bocca.\n\n   •   Non è preceduto da nausea.\n\n   •   Non richiede lo sforzo muscolare tipico del vomito.\n\nVa distinto da:\n\n   •   Vomito → espulsione attiva del contenuto gastrico, preceduta da nausea e conati.\n\n   •   Ruminazione → rigurgito ripetuto e volontario/involontario del cibo seguito da\n       rimasticazione.\n\nCause frequenti:\n\n   •   Malattia da reflusso gastroesofageo\n\n   •   Acalasia e altri disturbi della motilità esofagea.\n   •   Ernia iatale.","kind":"study","source":{"document":"Semeiotica domande completo ).\nA cosa serve\n\n   •   Valutazione dello stato tiroideo in modo efficiente\n\n   •   Riduce esami inutili\n\n   •   Usato spesso come screening iniziale\n\nInterpretazione base\n\n   •   TSH alto + FT4 basso → ipotiroidismo\n\n   •   TSH basso + FT4 alto → ipertiroidismo\n\n   •   TSH normale → funzione tiroidea verosimilmente normale","kind":"study","source":{"document":"Semeiotica domande completo","page":46,"section":"Domande e appunti · raccolta principale","number":206,"sourceId":"appunti-206"},"legacyOfficialIds":["official-46-206-6"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo originale può contenere appunti o risposte, da verificare con il materiale del corso."},{"id":"pdf-appunti-207","sourceId":"appunti-207","apparato":"Semeiotica generale","organo":"Febbre, infezioni e infiammazione","cartella":"Domande e appunti · raccolta principale","def":"Febbre FUO: (Fever of Unknown Origin) è la febbre di origine sconosciuta.","term":"Febbre FUO: (Fever of Unknown Origin) è la febbre di origine sconosciuta.\n\nDefinizione classica (criteri di Petersdorf e Beeson)\n\n   •   Temperatura > 38,3 °C\n\n   •   Durata > 3 settimane\n\n   •   Diagnosi non chiarita dopo almeno 1 settimana di accertamenti ospedalieri o\n       ambulatoriali\n\nCause principali (3 grandi gruppi)\n\n1) Infettive: Tubercolosi (una delle più frequenti), ascessi profondi, endocardite subacuta\n\n2) Neoplastiche: linfomi (soprattutto), leucemie, tumori solidi\n\n3) Malattie infiammatorie / autoimmuni: vasculiti, malattie del tessuto connettivo, febbri\nauto-infiammatorie\n\nAltre categorie: farmaci, cause tromboemboliche, cause non diagnosticate (quota\nresidua)","kind":"study","source":{"document":"Semeiotica domande completo","page":47,"section":"Domande e appunti · raccolta principale","number":207,"sourceId":"appunti-207"},"legacyOfficialIds":["official-47-207-0"],"reverse":true,"explanation":"Nessuna chiave separata per questa raccolta. Il testo orig {id:'f'+i+'b',apparato:'Semeiotica generale',organo:'Volto',cartella:'Facies',def:'Descrivi i segni caratteristici della '+term+'.',term:def,reverse:true,displayTerm:term}
]);

if(!data||!Array.isArray(data.items))data={items:[],errors:{},attempts:{}};
data.errors=data.errors||{};data.attempts=data.attempts||{};data.folders=Array.isArray(data.folders)?data.folders:[];
for(const x of [...initial,...faciesItems,...importedItems])if(!data.items.some(y=>y.id===x.id))data.items.push(x);
if(!data.officialMigrated){try{const old=JSON.parse(localStorage.getItem('medquiz_official_v1'));if(old)for(const x of importedItems)for(const id of x.legacyOfficialIds||[]){if(old.wrong?.[id])data.errors[x.id]=true;if(old.done?.[id])data.attempts[x.id]=Math.max(1,data.attempts[x.id]||0);}}catch{}data.officialMigrated=true;}
const app=document.getElementById('app');let path=[],session=null,mode='typing',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
let storageOK=true;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch{storageOK=false;}};
const uniq=a=>[...new Set(a)];const filtered=(p=path)=>data.items.filter(x=>(!p[0]||x.apparato===p[0])&&(!p[1]||x.organo===p[1])&&(!p[2]||x.cartella===p[2])&&(!query||norm(x.def+' '+x.term+' '+x.apparato+' '+x.organo+' '+x.cartella).includes(norm(query))));
const countErrors=a=>a.filter(x=>data.errors[x.id]).length;
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const btn=(t,fn,cls='')=>`<button class="btn ${cls}" onclick="${esc(fn)}">${esc(t)}</button>`;
const rootFolders=['Apparato urinario','Semeiotica generale','Chirurgia','Casi clinici'];
const isMCQ=x=>x.kind==='mcq'&&Array.isArray(x.options);
const hasKey=x=>Number.isInteger(x.answer)&&x.answer>=0&&x.answer<x.options.length;
const sourceText=x=>x.source?`<p class="muted source">${x.generated?'Quiz creato per il ripasso · ':''}${esc(x.source.document||'Fonte')}${x.source.page?' · pagina PDF '+esc(x.source.page):''}</p>`:'';
function crumbs(){return `<nav class="crumb"><button onclick="go(0)">Tutte le cartelle</button>${path.map((p,i)=>`<span>›</span><button onclick="go(${i+1})">${esc(p)}</button>`).join('')}</nav>`}
function go(n){session=null;path=path.slice(0,n);query='';render()}
function openFolder(name){session=null;query='';path.push(name);render()}
function searchItems(){query=document.getElementById('search').value.trim();render()}
function render(){if(session){quiz();return}const arr=filtered(),depth=path.length;let html=crumbs();html+=`<section class="card"><div class="row between"><div><h2>${depth===0?'Le tue cartelle':esc(path[depth-1])}</h2><span class="muted">${arr.length} domande e schede · ${countErrors(arr)} da ripassare</span></div>${btn('Quiz misto di tutto','startAll()','primary')}</div><p class="muted">Un unico archivio: ogni nuova raccolta si aggiunge qui, mantenendo le domande e i progressi già presenti.</p><form class="row" onsubmit="event.preventDefault();searchItems()"><input class="input" style="flex:1;min-width:180px" id="search" type="search" value="${esc(query)}" placeholder="Cerca tra tutte le domande della selezione" aria-label="Cerca domande">${btn('Cerca','searchItems()')}</form>${!storageOK?'<p class="feedback bad">Il browser non consente il salvataggio. Esporta un backup prima di chiudere.</p>':''}</section>`;
if(depth<3){const folderPaths=[...data.folders,...data.items.map(x=>[x.apparato,x.organo,x.cartella])];let keys=uniq(folderPaths.filter(p=>path.every((v,i)=>p[i]===v)).map(p=>p[depth]).filter(Boolean));if(depth===0)keys=uniq([...rootFolders,...keys]);if(query)keys=keys.filter(k=>filtered([...path,k]).length>0);html+=`<section class="card"><div class="tiles">${keys.map(k=>{const items=filtered([...path,k]);return `<button class="tile" onclick="${esc('openFolder('+JSON.stringify(k)+')')}"><span>📁 ${depth===0?'CARTELLA':depth===1?'ORGANO / DISTRETTO':'RACCOLTA'}</span><strong>${esc(k)}</strong><span>${items.length} domande e schede${items.length?' · '+countErrors(items)+' errori':' · Pronta per le prossime aggiunte'}</span></button>`}).join('')}</div>${!keys.length?'<p class="muted">Questa cartella è pronta. Aggiungi una raccolta di domande o crea una sottocartella dalla gestione archivio.</p>':''}</section>`;}
if(arr.length){html+=`<section class="card"><h2>Allenati ${depth===0?'su tutto l’archivio':'su questa selezione'}</h2><div class="row">${btn('▶ Inizia quiz','start(false)','primary')}${btn('↻ Solo errori ('+countErrors(arr)+')','start(true)')}${btn('📖 Domande e glossario','toggleGloss()')}</div><p class="muted">Termini da riconoscere, domande a scelta multipla e risposte aperte. Le domande senza una chiave certa non ricevono un voto.</p><div id="gloss" class="hide">${arr.map(x=>`<div class="term"><b>${esc(x.displayTerm||x.def)}</b><details><summary>Mostra risposta e contenuto</summary><div style="white-space:pre-wrap">${esc(isMCQ(x)?x.options.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('\n')+'\n\n'+(hasKey(x)?'Soluzione: '+String.fromCharCode(65+x.answer)+'. '+x.options[x.answer]:'Soluzione non indicata o discordante nel documento'):x.term)}</div>${x.explanation?`<p>${esc(x.explanation)}</p>`:''}${x.warning?`<p class="feedback">${esc(x.warning)}</p>`:''}</details>${sourceText(x)}<small class="muted">${esc(x.apparato)} › ${esc(x.organo)} › ${esc(x.cartella)}</small></div>`).join('')}</div></section>`;}
html+=`<section class="card"><div class="row between"><h2>Gestione archivio</h2><span class="pill">${data.items.length} domande e schede totali</span></div><div class="row">${btn('＋ Aggiungi una domanda','showAdd()')}${btn('＋ Nuova cartella','showFolder()')}${btn('Importa file di domande','document.getElementById("file").click()')}${btn('Esporta backup','exportData()')}${btn('Azzera errori','resetErrors()','danger small')}</div><p class="muted">I file JSON si aggiungono all’archivio senza cancellare le domande esistenti. Le raccolte ricavate dai PDF sono già nelle rispettive cartelle.</p><input id="file" type="file" accept=".json,application/json" class="hide" onchange="importData(event)"><div id="add" class="hide"></div></section>`;app.innerHTML=html;}
function toggleGloss(){document.getElementById('gloss').classList.toggle('hide')}
function start(only){const arr=filtered().filter(x=>!only||data.errors[x.id]);if(!arr.length){alert('Non ci sono domande da ripassare in questa selezione.');return}session={items:shuffle(arr),index:0,correct:0,graded:0,ungraded:0,answered:false,selection:only?'errori':'normale'};quiz()}
function startAll(){path=[];query='';start(false)}
function setMode(m){if(session?.answered)return;mode=m;quiz()}
function quiz(){const s=session;if(!s)return render();if(s.index>=s.items.length){const missed=s.items.filter(x=>data.errors[x.id]);app.innerHTML=`${crumbs()}<section class="card"><h2>Quiz completato!</h2><div class="statline"><div><span class="stat">${s.correct}/${s.graded}</span><small>Risposte corrette o ricordate</small></div><div><span class="stat">${s.ungraded}</span><small>Senza chiave · escluse dal voto</small></div><div><span class="stat">${missed.length}</span><small>Errori da ripassare</small></div></div><div class="row" style="margin-top:18px">${btn('Rifai solo errori','restartErrors()','primary')}${btn('Torna alle cartelle','endQuiz()')}</div></section>`;return;}
const x=s.items[s.index];let body='';if(isMCQ(x)){body=`<div class="options">${x.options.map((o,i)=>`<button class="opt" data-index="${i}" onclick="answerMCQ(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>`;}else if(x.reverse){body=`<p class="muted">Prova a rispondere, poi confronta con il contenuto e valuta il tuo ripasso.</p><textarea id="guess" class="input" rows="4" placeholder="Scrivi la tua risposta…"></textarea><div class="row" style="margin-top:10px">${btn('Confronta con la risposta','revealReverse()','primary')}</div>`;}else{const candidates=data.items.filter(y=>!isMCQ(y)&&!y.reverse&&y.id!==x.id&&y.term!==x.term);const opts=shuffle([x,...shuffle(candidates).slice(0,3)]);s.options=opts;body=`<div class="row" style="margin-bottom:15px">${btn('Scrivi il termine',"setMode('typing')",mode==='typing'?'primary small':'small')}${btn('Scelta multipla',"setMode('choices')",mode==='choices'?'primary small':'small')}</div>${mode==='typing'?`<input class="input" id="guess" autocomplete="off" autocapitalize="off" placeholder="Scrivi il termine medico…" oninput="typingCheck()" onkeydown="if(event.key==='Enter')submitTyping()"><div class="row" style="margin-top:10px">${btn('Verifica risposta','submitTyping()','primary')}${btn('Mostra soluzione','reveal()')}</div>`:`<div class="options">${opts.map(o=>`<button class="opt" onclick="${esc('answer('+JSON.stringify(o.id)+')')}">${esc(o.term)}</button>`).join('')}</div>`}`;}
app.innerHTML=`${crumbs()}<section class="card"><div class="row between"><span class="pill">Domanda ${s.index+1} di ${s.items.length}</span><span class="muted">Corrette: ${s.correct}</span></div><div class="progress" style="margin:15px 0"><div style="width:${s.index/s.items.length*100}%"></div></div><small class="muted">${esc(x.apparato)} › ${esc(x.organo)} › ${esc(x.cartella)}</small>${sourceText(x)}<p class="question">${esc(x.def)}</p><div id="answer">${body}</div><div id="result" role="status"></div><div class="row between" style="margin-top:18px">${btn('← Esci dal quiz','endQuiz()','small')}<div id="next"></div></div></section>`;document.getElementById('guess')?.focus();}
function revealReverse(){if(session.answered)return;const x=session.items[session.index];document.getElementById('result').innerHTML=`<div class="feedback"><strong>Risposta e contenuto di riferimento:</strong><div style="white-space:pre-wrap">${esc(x.term)}</div></div><div class="row">${btn('✓ Ho ricordato la risposta','gradeReverse(true)','primary')}${btn('↻ Da ripassare','gradeReverse(false)')}</div>`;document.querySelectorAll('#answer button').forEach(b=>b.disabled=true);document.getElementById('guess').disabled=true;}
function gradeReverse(ok){finish(ok)}
function typingCheck(){if(session.answered)return;const v=document.getElementById('guess').value.trim();if(v&&norm(v)===norm(session.items[session.index].term))finish(true)}
function submitTyping(){if(session.answered)return;const v=document.getElementById('guess').value.trim();if(v)finish(norm(v)===norm(session.items[session.index].term))}
function answer(id){if(!session.answered)finish(id===session.items[session.index].id)}
function answerMCQ(index){if(session.answered)return;const x=session.items[session.index];if(!Number.isInteger(index)||index<0||index>=x.options.length)return;session.choice=index;finish(hasKey(x)?index===x.answer:null)}
function reveal(){if(!session.answered)finish(false)}
function finish(ok){const s=session,x=s.items[s.index];if(s.answered)return;s.answered=true;if(ok===null)s.ungraded++;else{s.graded++;if(ok){s.correct++;delete data.errors[x.id];}else data.errors[x.id]=true;}data.attempts[x.id]=(data.attempts[x.id]||0)+1;save();const solution=isMCQ(x)?hasKey(x)?String.fromCharCode(65+x.answer)+'. '+x.options[x.answer]:'Soluzione non indicata o discordante nel documento.':x.term;document.getElementById('result').innerHTML=`<div class="feedback ${ok===null?'':ok?'ok':'bad'}">${ok===null?'Risposta registrata senza voto.':ok?'✓ Corretto / ricordato!':'↻ Da ripassare.'}<div style="white-space:pre-wrap">${esc(solution)}</div>${x.explanation?`<p>${esc(x.explanation)}</p>`:''}${x.warning?`<p>${esc(x.warning)}</p>`:''}${ok===null?btn('✓ Segna come studiata','markUnkeyedReviewed()'):''}</div>`;document.getElementById('next').innerHTML=btn(s.index===s.items.length-1?'Vedi risultato →':'Prossima domanda →','nextQuestion()','primary');document.querySelectorAll('#answer button').forEach(b=>{b.disabled=true;if(isMCQ(x)){if(hasKey(x)&&Number(b.dataset.index)===x.answer)b.classList.add('right');if(Number(b.dataset.index)===s.choice&&ok===false)b.classList.add('wrong');}else if(b.textContent===x.term)b.classList.add('right');});if(document.getElementById('guess'))document.getElementById('guess').disabled=true;}
function markUnkeyedReviewed(){const x=session?.items[session.index];if(!x||!session.answered||!isMCQ(x)||hasKey(x))return;delete data.errors[x.id];save();document.getElementById('result').innerHTML+='<p class="muted">Segnata come studiata. Nessun voto assegnato.</p>';}
function nextQuestion(){if(!session?.answered)return;session.index++;session.answered=false;quiz()}
function endQuiz(){session=null;render()}
function restartErrors(){session=null;start(true)}
function showAdd(){const el=document.getElementById('add');el.classList.remove('hide');el.innerHTML=`<h3 style="margin-top:18px">Nuova domanda o termine</h3><label>Apparato / area</label><input class="input" id="a" value="${esc(path[0]||'')}" placeholder="Es. Apparato urinario, Chirurgia"><label>Organo / distretto</label><input class="input" id="o" value="${esc(path[1]||'')}" placeholder="Es. Vescica e minzione"><label>Cartella</label><input class="input" id="c" value="${esc(path[2]||'')}" placeholder="Es. Alterazioni urinarie"><label>Domanda o definizione</label><textarea id="d"></textarea><label>Risposta o termine corretto</label><textarea id="t"></textarea><div class="row">${btn('Salva domanda','addTerm()','primary')}</div>`;}
function addTerm(){const g=id=>document.getElementById(id).value.trim();if(['a','o','c','d','t'].some(k=>!g(k))){alert('Compila tutti i campi.');return;}data.items.push({id:'q'+Date.now()+Math.random().toString(36).slice(2),apparato:g('a'),organo:g('o'),cartella:g('c'),def:g('d'),term:g('t')});save();render();}
function showFolder(){const name=prompt('Nome della nuova cartella'+(path.length?' dentro “'+path.join(' › ')+'”':''));if(!name?.trim())return;const parent=path.slice(0,2);const next=[...parent,name.trim()];if(!data.folders.some(p=>JSON.stringify(p)===JSON.stringify(next)))data.folders.push(next);save();session=null;path=parent;render();}
function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='medquiz-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),x=Array.isArray(parsed)?{items:parsed}:parsed;if(!Array.isArray(x.items)||!x.items.every(z=>z&&typeof z.id==='string'&&['apparato','organo','cartella','def','term'].every(k=>typeof z[k]==='string'&&z[k].trim())&&(!z.kind||z.kind!=='mcq'||Array.isArray(z.options)&&z.options.length>=2&&z.options.every(o=>typeof o==='string')&&(z.answer===null||Number.isInteger(z.answer)&&z.answer>=0&&z.answer<z.options.length))))throw Error();const existing=new Set(data.items.map(z=>z.id)),fresh=x.items.filter(z=>{if(existing.has(z.id))return false;existing.add(z.id);return true;});if(!confirm('Aggiungere '+fresh.length+' domande nuove? Le domande e i progressi già presenti saranno conservati.'))return;for(const q of fresh){if(!data.items.some(z=>z.id===q.id))data.items.push(q);}if(x.errors&&typeof x.errors==='object')data.errors={...x.errors,...data.errors};if(x.attempts&&typeof x.attempts==='object')for(const [id,n]of Object.entries(x.attempts))if(Number.isFinite(n))data.attempts[id]=Math.max(data.attempts[id]||0,n);if(Array.isArray(x.folders))for(const p of x.folders)if(Array.isArray(p)&&p.length<=3&&p.every(s=>typeof s==='string'&&s.trim())&&!data.folders.some(q=>JSON.stringify(q)===JSON.stringify(p)))data.folders.push(p);save();session=null;path=[];query='';render();alert('Archivio aggiornato: '+fresh.length+' domande aggiunte.');}catch{alert('File di domande non valido. Usa un file JSON esportato da MedQuiz.');}};r.readAsText(f);}
function resetErrors(){if(confirm('Azzerare tutti gli errori salvati?')){data.errors={};save();render();}}
save();render();
</script></body></html>
