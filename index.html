<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedQuiz | Semeiotica e Medicina Interna — Versione gratuita</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#16243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:20px 16px 70px}header{background:linear-gradient(115deg,#142846,#294c7a);color:#fff;padding:27px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{margin:0;font-size:1.8rem}h2{font-size:1.24rem;margin:0 0 14px}h3{margin:0 0 8px}p{line-height:1.55}.sub{color:#dce7fa;margin:7px 0 0}.muted{color:#63728a}.card{background:white;border:1px solid #e3eaf4;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 3px 13px #15294708}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid #d4deeb;background:#fff;border-radius:11px;padding:11px 15px;font:inherit;font-weight:650;cursor:pointer;color:#213a5b}.btn:hover{background:#eaf1fb}.primary{background:#235dba;border-color:#235dba;color:white}.primary:hover{background:#184c9d}.danger{color:#a52c39}.small{font-size:.85rem;padding:8px 11px}.pill{background:#e9f0fa;color:#325a88;border-radius:100px;padding:6px 11px;font-size:.81rem;font-weight:700}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{text-align:left;background:#fff;border:1px solid #dce5f1;border-radius:14px;padding:18px;cursor:pointer;color:inherit;font:inherit;min-height:115px}.tile:hover{border-color:#235dba;box-shadow:0 5px 15px #235dba12}.tile strong{display:block;margin:6px 0}.tile span{font-size:.85rem;color:#607089}.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:15px 0;color:#62758e;font-size:.92rem}.crumb button{border:0;background:none;color:#245cae;cursor:pointer;padding:3px;font:inherit}.question{font-size:1.2rem;line-height:1.6;margin:20px 0}.input{width:100%;border:1px solid #cbd8e8;border-radius:11px;padding:13px;font:inherit;background:#fff}.input:focus{outline:2px solid #b1cfff}.feedback{padding:13px 15px;border-radius:12px;margin:14px 0;font-weight:600}.ok{background:#e4f7ed;color:#17643b}.bad{background:#fff0ef;color:#a33b34}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.opt{text-align:left;padding:14px;border-radius:11px;border:1px solid #cdd9e8;background:#fff;font:inherit;cursor:pointer}.opt:hover{background:#edf4ff}.opt:disabled{cursor:default;opacity:.75}.opt.right{border:2px solid #20824e;background:#e6f7ec}.opt.wrong{border:2px solid #c43e45;background:#ffebed}.progress{height:9px;background:#e5edf8;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#2865be;transition:width .2s}.stat{font-weight:750;font-size:1.4rem}.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.statline>div{background:#f0f5fc;padding:14px;border-radius:12px;text-align:center}.statline small{display:block;color:#687b91}.term{border-top:1px solid #e9eef5;padding:10px 0}.term b{display:block}.hide{display:none!important}label{font-weight:650;display:block;margin:10px 0 5px}select,textarea{width:100%;font:inherit;border:1px solid #ccd8e6;border-radius:10px;padding:11px;background:#fff}textarea{min-height:90px}footer{color:#68798e;text-align:center;font-size:.8rem;margin-top:22px}@media(max-width:520px){header{display:block}.card{padding:15px}.statline{gap:5px}.statline>div{padding:9px}.wrap{padding:12px 10px 50px}}
</style></head><body><main class="wrap"><header><div><h1>MedQuiz</h1><p class="sub">Semeiotica e Medicina Interna · Ripasso per apparato, organo e cartella</p></div><span class="pill">Archivio personale</span></header><div id="app"></div><footer>I dati rimangono su questo browser. Esporta un backup per conservarli.</footer></main><script>
const KEY='medquiz_hierarchy_v1';
const initial=[
['Apparato urinario','Rene e diuresi','Alterazioni della diuresi','Riduzione della quantità di urine prodotte nelle 24 ore, generalmente sotto 400–500 mL.','Oliguria'],
['Apparato urinario','Rene e diuresi','Alterazioni della diuresi','Produzione di urine inferiore a 100 mL nelle 24 ore.','Anuria'],
['Apparato urinario','Rene e diuresi','Alterazioni della diuresi','Aumento della quantità totale di urine prodotte, generalmente oltre 3 L nelle 24 ore.','Poliuria'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Aumento della frequenza delle minzioni, spesso con piccole quantità di urina per volta.','Pollachiuria'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Necessità di svegliarsi una o più volte durante il sonno notturno per urinare.','Nicturia'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Difficoltà o dolore durante la minzione.','Disuria'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Minzione dolorosa, spesso lenta e a gocce, con dolore particolarmente intenso al termine.','Stranguria'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Sensazione persistente di dover urinare, anche subito dopo la minzione.','Tenesmo vescicale'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Perdita involontaria di urina.','Incontinenza urinaria'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Incapacità di svuotare completamente o parzialmente la vescica, nonostante contenga urina.','Ritenzione urinaria'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Perdita involontaria di urina durante il sonno, soprattutto nei bambini.','Enuresi'],
['Apparato urinario','Vescica e minzione','Disturbi della minzione','Bisogno improvviso, intenso e difficilmente rinviabile di urinare.','Urgenza minzionale'],
['Apparato urinario','Esame delle urine','Alterazioni delle urine','Presenza di leucociti in quantità anomala nelle urine, talvolta con pus.','Piuria'],
['Apparato urinario','Esame delle urine','Alterazioni delle urine','Presenza di sangue nelle urine, visibile o rilevabile solo mediante esami.','Ematuria']
].map((a,i)=>({id:'u'+i,apparato:a[0],organo:a[1],cartella:a[2],def:a[3],term:a[4]}));

const facies=[
['Facies cushingoide','Volto arrotondato «a luna piena», pletora facciale, possibile acne, irsutismo e cute sottile; tipica dell’ipercortisolismo.'],
['Facies mixedematosa','Volto tumefatto e pallido, edema periorbitario, cute secca, capelli radi ed espressione rallentata; tipica dell’ipotiroidismo marcato.'],
['Facies basedowiana','Sguardo fisso con retrazione palpebrale, possibile esoftalmo e ridotto ammiccamento; tipica dell’orbitopatia di Graves.'],
['Facies acromegalica','Arcate sopracciliari prominenti, naso e labbra ingranditi, prognatismo e tratti facciali grossolani; associata ad acromegalia.'],
['Facies parkinsoniana','Volto ipomimico, ammiccamento ridotto, sguardo fisso e possibile bocca semiaperta; tipica del parkinsonismo.'],
['Facies ippocratica','Occhi infossati, naso affilato, tempie scavate, cute pallida o grigiastra; osservabile in grave compromissione generale.'],
['Facies mitralica','Colorito violaceo-rossastro degli zigomi con possibile cianosi periferica e pallore delle altre regioni del volto; classica della stenosi mitralica avanzata.'],
['Facies leonina','Ispessimento e infiltrazione diffusa della cute del volto, solchi profondi e prominenza delle arcate sopracciliari; descritta in alcune malattie infiltrative, tra cui la lebbra lepromatosa.']
];
const faciesItems=facies.flatMap(([term,def],i)=>[
{id:'f'+i+'a',apparato:'Semeiotica generale',organo:'Volto',cartella:'Facies',def,term},
{id:'f'+i+'b',apparato:'Semeiotica generale',organo:'Volto',cartella:'Facies',def:'Descrivi i segni caratteristici della '+term+'.',term:def,reverse:true,displayTerm:term}
]);

let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.items))data={items:initial,errors:{},attempts:{}};
faciesItems.forEach(x=>{if(!data.items.some(y=>y.id===x.id))data.items.push(x)});localStorage.setItem(KEY,JSON.stringify(data));
const app=document.getElementById('app');let path=[],session=null,mode='typing';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s).toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const uniq=a=>[...new Set(a)];const filtered=(p=path)=>data.items.filter(x=>(!p[0]||x.apparato===p[0])&&(!p[1]||x.organo===p[1])&&(!p[2]||x.cartella===p[2]));const countErrors=a=>a.filter(x=>data.errors[x.id]).length;const shuffle=a=>[...a].sort(()=>Math.random()-.5);const btn=(t,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`;
function crumbs(){return `<nav class="crumb"><button onclick="go(0)">Tutti gli apparati</button>${path.map((p,i)=>`<span>›</span><button onclick="go(${i+1})">${esc(p)}</button>`).join('')}</nav>`}
function go(n){session=null;path=path.slice(0,n);render()};function openFolder(name){path.push(name);render()}
function render(){if(session){quiz();return}let html=crumbs();const arr=filtered();const depth=path.length;const label=['apparato','organo / distretto','cartella'][depth];html+=`<section class="card"><div class="row between"><div><h2>${depth===0?'Scegli un apparato':depth===1?'Scegli un organo o distretto':depth===2?'Scegli una cartella':esc(path[2])}</h2><span class="muted">${arr.length} termini · ${countErrors(arr)} da ripassare</span></div>${btn('Quiz misto di tutto','startAll()','primary')}</div></section>`;
if(depth<3){let keys=uniq(arr.map(x=>[x.apparato,x.organo,x.cartella][depth]));html+=`<section class="card"><div class="tiles">${keys.map(k=>{let p=[...path,k],items=filtered(p);return `<button class="tile" onclick="openFolder(${JSON.stringify(k).replace(/"/g,'&quot;')})"><span>📁 ${depth===0?'APPARATO':depth===1?'ORGANO / DISTRETTO':'CARTELLA'}</span><strong>${esc(k)}</strong><span>${items.length} termini · ${countErrors(items)} errori</span></button>`}).join('')}</div>${!keys.length?'<p>Nessuna cartella: aggiungi termini dalla sezione Gestione.</p>':''}</section>`}
if(arr.length){html+=`<section class="card"><h2>Allenati ${depth===0?'su tutti gli apparati':'su questa selezione'}</h2><div class="row">${btn('▶ Inizia quiz','start(false)','primary')}${btn('↻ Solo errori ('+countErrors(arr)+')','start(true)')}${btn('📖 Glossario','toggleGloss()')}</div><p class="muted">Rispondi scrivendo il termine o scegliendo tra quattro alternative. La risposta viene verificata subito.</p><div id="gloss" class="hide">${arr.map(x=>`<div class="term"><b>${esc(x.term)}</b><span>${esc(x.def)}</span><br><small class="muted">${esc(x.apparato)} › ${esc(x.organo)} › ${esc(x.cartella)}</small></div>`).join('')}</div></section>`}
html+=`<section class="card"><div class="row between"><h2>Gestione archivio</h2><span class="pill">${data.items.length} termini totali</span></div><div class="row">${btn('＋ Aggiungi un termine','showAdd()')}${btn('Esporta backup','exportData()')}${btn('Importa backup','document.getElementById("file").click()')}${btn('Azzera errori','resetErrors()','danger small')}</div><input id="file" type="file" accept=".json,application/json" class="hide" onchange="importData(event)"><div id="add" class="hide"></div></section>`;app.innerHTML=html}
function toggleGloss(){document.getElementById('gloss').classList.toggle('hide')}
function start(only){let arr=filtered().filter(x=>!only||data.errors[x.id]);if(!arr.length){alert('Non ci sono domande da ripassare in questa selezione.');return}session={items:shuffle(arr),index:0,correct:0,answered:false,selection:only?'errori':'normale'};quiz()}
function startAll(){path=[];start(false)}
function setMode(m){mode=m;quiz()}
function quiz(){const s=session;if(!s)return render();if(s.index>=s.items.length){let missed=s.items.filter(x=>data.errors[x.id]);app.innerHTML=`${crumbs()}<section class="card"><h2>Quiz completato!</h2><div class="statline"><div><span class="stat">${s.correct}/${s.items.length}</span><small>Risposte corrette</small></div><div><span class="stat">${Math.round(s.correct/s.items.length*100)}%</span><small>Risultato</small></div><div><span class="stat">${missed.length}</span><small>Errori ancora da ripassare</small></div></div><div class="row" style="margin-top:18px">${btn('Rifai solo errori','restartErrors()','primary')}${btn('Torna alle cartelle','endQuiz()')}</div></section>`;return}let x=s.items[s.index],p=s.index/s.items.length*100;let opts=shuffle([x,...shuffle(data.items.filter(y=>y.id!==x.id&&y.term!==x.term)).slice(0,3)]);if(opts.length<4)opts=shuffle([x,...data.items.filter(y=>y.id!==x.id).slice(0,3)]);s.options=opts;
app.innerHTML=`${crumbs()}<section class="card"><div class="row between"><span class="pill">Domanda ${s.index+1} di ${s.items.length}</span><span class="muted">Corrette: ${s.correct}</span></div><div class="progress" style="margin:15px 0"><div style="width:${p}%"></div></div><small class="muted">${esc(x.apparato)} › ${esc(x.organo)} › ${esc(x.cartella)}</small><p class="question">${esc(x.def)}</p>${x.reverse?'<p class="muted">Scrivi le caratteristiche principali, poi confrontale con la soluzione e valuta la tua risposta.</p>':''}<div class="row" style="margin-bottom:15px">${x.reverse?'':btn('Scrivi il termine',"setMode('typing')",mode==='typing'?'primary small':'small')+btn('Scelta multipla',"setMode('choices')",mode==='choices'?'primary small':'small')}</div><div id="answer">${x.reverse?`<textarea id="guess" class="input" rows="4" placeholder="Scrivi le caratteristiche cliniche…"></textarea><div class="row" style="margin-top:10px">${btn('Confronta con la soluzione','revealReverse()','primary')}</div>`:mode==='typing'?`<input class="input" id="guess" autocomplete="off" autocapitalize="off" placeholder="Scrivi il termine medico…" oninput="typingCheck()" onkeydown="if(event.key==='Enter')submitTyping()"><div class="row" style="margin-top:10px">${btn('Verifica risposta','submitTyping()','primary')}${btn('Mostra soluzione','reveal()')}</div>`:`<div class="options">${opts.map((o,i)=>`<button class="opt" onclick="answer(${JSON.stringify(o.id).replace(/"/g,'&quot;')})">${esc(o.term)}</button>`).join('')}</div>`}</div><div id="result"></div><div class="row between" style="margin-top:18px">${btn('← Esci dal quiz','endQuiz()','small')}<div id="next"></div></div></section>`;if(mode==='typing')document.getElementById('guess').focus()}
function revealReverse(){if(session.answered)return;let x=session.items[session.index];document.getElementById('result').innerHTML=`<div class="feedback"><strong>Risposta attesa:</strong> ${esc(x.term)}</div><div class="row" style="margin-top:10px">${btn('✓ Ho ricordato i segni','gradeReverse(true)','primary')}${btn('↻ Da ripassare','gradeReverse(false)')}</div>`;document.querySelector('#answer button').disabled=true;document.getElementById('guess').disabled=true}
function gradeReverse(ok){document.getElementById('result').innerHTML='';finish(ok)}
function typingCheck(){if(session.answered)return;let x=session.items[session.index],v=document.getElementById('guess').value.trim();if(v&&norm(v)===norm(x.term))finish(true)}
function submitTyping(){if(session.answered)return;let v=document.getElementById('guess').value.trim();if(!v)return;finish(norm(v)===norm(session.items[session.index].term))}
function answer(id){if(!session.answered)finish(id===session.items[session.index].id)}function reveal(){if(!session.answered)finish(false)}
function finish(ok){let s=session,x=s.items[s.index];s.answered=true;if(ok){s.correct++;delete data.errors[x.id]}else data.errors[x.id]=true;data.attempts[x.id]=(data.attempts[x.id]||0)+1;save();document.getElementById('result').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✓ Corretto!':'✗ Da ripassare.'} <strong>${esc(x.term)}</strong></div>`;document.getElementById('next').innerHTML=btn(s.index===s.items.length-1?'Vedi risultato →':'Prossima domanda →','nextQuestion()','primary');if(x.reverse){document.getElementById('guess').disabled=true;document.querySelectorAll('#answer button').forEach(b=>b.disabled=true)}else if(mode==='typing'){document.getElementById('guess').disabled=true;document.querySelectorAll('#answer button').forEach(b=>b.disabled=true)}else document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===x.term)b.classList.add('right')});}
function nextQuestion(){session.index++;session.answered=false;quiz()}function endQuiz(){session=null;render()}function restartErrors(){session=null;start(true)}
function showAdd(){let el=document.getElementById('add');el.classList.remove('hide');el.innerHTML=`<h3 style="margin-top:18px">Nuovo termine</h3><label>Apparato</label><input class="input" id="a" value="${esc(path[0]||'')}" placeholder="Es. Apparato cardiovascolare"><label>Organo / distretto</label><input class="input" id="o" value="${esc(path[1]||'')}" placeholder="Es. Cuore"><label>Cartella</label><input class="input" id="c" value="${esc(path[2]||'')}" placeholder="Es. Auscultazione"><label>Definizione (domanda)</label><textarea id="d" placeholder="Definizione da riconoscere"></textarea><label>Termine corretto</label><input class="input" id="t" placeholder="Es. Soffio sistolico"><div class="row" style="margin-top:12px">${btn('Salva termine','addTerm()','primary')}</div>`}
function addTerm(){let g=id=>document.getElementById(id).value.trim();if(['a','o','c','d','t'].some(k=>!g(k))){alert('Compila tutti i campi.');return}data.items.push({id:'q'+Date.now()+Math.random().toString(36).slice(2),apparato:g('a'),organo:g('o'),cartella:g('c'),def:g('d'),term:g('t')});save();render();alert('Termine aggiunto!')}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='medquiz-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.items)||!x.items.every(z=>z.id&&z.apparato&&z.organo&&z.cartella&&z.def&&z.term))throw Error();if(confirm('Sostituire archivio e progressi con quelli del backup?')){data={items:x.items,errors:x.errors||{},attempts:x.attempts||{}};save();path=[];render()}}catch{alert('File di backup non valido.')}};r.readAsText(f)}
function resetErrors(){if(confirm('Azzerare tutti gli errori salvati?')){data.errors={};save();render()}}
render();
</script></body></html>
