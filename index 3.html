5","section":"Raccolta 1","number":27,"page":4,"text":"per polso dicroto si intende\na. Una pulsazione aggiuntiva sul picco arrotondato dell’onda\nb. Una pulsazione aggiuntiva diastolica\nc. Una pulsazione aggiuntiva sistolica\nd. Una pulsazione aggiuntiva sulla branca ascendente dell’onda"},{"id":"official-5-28-0","section":"Raccolta 1","number":28,"page":5,"text":"La disfaga paradossa é tipica di quale condizione patologica?\na. Neoplasia cardiale\nb. Acalasia\nc. Ernia Iatale\nd. Incontinenza cardiale"},{"id":"official-5-29-1","section":"Raccolta 1","number":29,"page":5,"text":"Come NON può essere un polso patalogico?\na. rutilante\n b. dicroto\nc. bisfertens\nd. anacroto"},{"id":"official-5-30-2","section":"Raccolta 1","number":30,"page":5,"text":"Per ortopnea e platipnea si intende\na. ortopnea tendenza a tenere il busto eretto e platipnea tendenza a stare sdraiati per\nallevtare la dispnea\nb. dispnea nel decubito sul lato sinistro e destro, rispettivamente\nc. ortopnea tendenza a stare sdraiati e platipnea tendenza a tenere il busto etetto per\nalleviare la dispnea\nd. sono sinonimi"},{"id":"official-5-31-3","section":"Raccolta 1","number":31,"page":5,"text":"Nella terapia intramuscolare l'uso dei guanti sociali é:\na. Obbligatorio\nb. Facoltativo\n c. Inutile\nd. Utile"},{"id":"official-5-32-4","section":"Raccolta 1","number":32,"page":5,"text":"La sensibilità generale protopatica\na. È condotta al SNC da fibre mielinizzate appartenenti a nervi viscerali, e trasmessa al\ncentri superiori da vie multisinaptiche\nb. È condotta al SNC da fibre amieliniche o scarsamente mielinizzate appartenenti a nervi\nviscerali, e trasmessa ai centri superiori da vie multisinaptiche\nc. è condotta al SNC da fibre amieliniche o scarsamente mielinizzate appartenenti a nervi\nviscerall, e trasmessa ai centri superiori da vie oligosinaptiche\nD. Nessuna risposta è corretta"},{"id":"official-5-33-5","section":"Raccolta 1","number":33,"page":5,"text":"Fisiopatologicamente il quadro lge un ruolo protettivo delle vie respiratorie\nD. tutte le risposte sono corrette"},{"id":"official-6-40-5","section":"Raccolta 1","number":40,"page":6,"text":"Quale delle seguenti affermazioni è falsa?\nA. I diverticoli del III superiore dell'esofago sono diverticoli da pulsione\n B. I diverticoli del II/ superiore dell'esofago riconoscono una alterato fasciamento dello\nsfintere esofageo\nC. I diverticoli del III medio dell'esofago sono diverticoli da trazione\n D. I diverticoli del III inferiore dell'esofago sono diverticoli \"veri\""},{"id":"official-7-41-0","section":"Raccolta 1","number":41,"page":7,"text":"Quale dei seguenti esami non è utile per la diagnosi di ernia iatale:\nA. Rx esofago-stomaco-duodeno con pasto baritato\nB. Ph-metria esofagea\nC. Esofago-gastroscopia\nD. TAC toracica con mezzo di contrasto"},{"id":"official-7-42-1","section":"Raccolta 1","number":42,"page":7,"text":"L'esame più invasivo tra i seguenti è:\nA. Endoscopia\nB. Ecografia\nC. TC\nD. RM"},{"id":"official-7-43-2","section":"Raccolta 1","number":43,"page":7,"text":"Gli aghi cannula per le urgenze che misure hanno?\nA. 22 Gauge e 24 Gauge\nB. 18 Gauge e 20 Gauge\nC. Tutte le risposte sono corrette\nD. 14 Gauge e 16 Gauge"},{"id":"official-7-44-3","section":"Raccolta 1","number":44,"page":7,"text":"Il test piu' utile nalla diagnosi definitiva di neoplasia maligna e\nA. TAC\nB.CEA\nC. Biopsia\nD. RMN"},{"id":"official-7-45-4","section":"Raccolta 1","number":45,"page":7,"text":"la sintomatologia delle fibrosi interstiziali diffuse NON è carattertzzata da:\nA. Ippocratismo digitale\nB. Cianosi\nC. Torse grassa\nD. Dispnea"},{"id":"official-7-46-5","section":"Raccolta 1","number":46,"page":7,"text":"Un'anisosfigmia dei polsi arteriosi può apprezzata in:\nA. arteriopatia cronica ostruttiva degli arti inferiori\nB. dissezione aortica\nC. tutte le suddette condizioni\nD. coartazione aortica"},{"id":"official-7-47-6","section":"Raccolta 1","number":47,"page":7,"text":"Quali sono i segni clinici di un pz con sepsi:\nA. Tosse, dispnea e capogiri\nB. Febbre, tachicardia, tachipnea, oliguria, confusione ed estremità calde e sudate\nC. Coliche addominali accompagnate a disuria\nD. Dolore toracico con ipercapnia"},{"id":"official-8-48-0","section":"Raccolta 1","number":48,"page":8,"text":"La causa più frequente di diarrea è:\nA. Alcolismo\nB. Intossicazione da farmaci/droghe leggere\nC. La malattia infiammatoria intestinale\nD. L'infezione del tratto gastrointestinale"},{"id":"official-8-49-1","section":"Raccolta 1","number":49,"page":8,"text":"La claudicatio intermittens è sintomo di:\nA. Arteriopatia periferica\nB. Lombalgia\nC. Coxartrosi\nD. Trauma distorsivo della caviglia"},{"id":"official-8-50-2","section":"Raccolta 1","number":50,"page":8,"text":"Sono sintomi da ipotiroidismo:\nA. Palpitazioni\nb. Eccessiva sudorazione\nC. Tutte le riposte sono corrette\nD. Secchezza della cute"},{"id":"official-8-51-3","section":"Raccolta 1","number":51,"page":8,"text":"il miglior esame di imaging per visualizare e strutture mediastiniche sia dal punto di\nvista dell’invasività che da quello dei costi, è:\nA. Mediastinoscopia\nB. Ecografia\nC. TC/RM\nD. Toracoscopia esplorativa"},{"id":"official-8-52-4","section":"Raccolta 1","number":52,"page":8,"text":"La diarrea è un disturbo dell'alvo definito dalla presenza di:\nA. emissione di feci picee\nB. un aumento del volume fecale (> 2000 g/die)\nC. un aumento del volume fecale (> 20 g/die)\nD. un aumento del volume fecale (> 200 g/die)"},{"id":"official-8-53-5","section":"Raccolta 1","number":53,"page":8,"text":"Il segno di Kussmaul è:\nA. può accompagnarsi a polso paradosso (marcata riduzione in ampiezza durante\nl'inspirazione)\nB. l'aumento paradosso della pressione giugulare in inspirazione\nC. Tutte le risposte sono corrette\nD. associato a tamponamento cardiaco"},{"id":"official-8-54-6","section":"Raccolta 1","number":54,"page":8,"text":"In caso di ridotta portata cardiaca tale da causare shock, il paziente appare:\nA. con cute fredda\n B. pallido, con estremità cianotiche\nC. tutte le risposte sono corrette\nD. tachicardico e ipoteso"},{"id":"official-9-55-0","section":"Raccolta 1","number":55,"page":9,"text":"L'obiettivo della terapia adiuvante è:\na. Migliorare i sintomi del tumore\nb. Indurre una riduzione del tumore\nC. Migliorare la qualità di vita\n d. Aumentare le chance di guarigione del paziente"},{"id":"official-9-56-1","section":"Raccolta 1","number":56,"page":9,"text":"Gli aghi cannula per le urgenze che misure hanno?\na. 22 Gauge e 24 Gauge\nb. 14 Gauge e 16 Gauge.\nC. 18 Gauge e 20 Gauge\nd. Tutte le risposte sono corrette"},{"id":"official-9-57-2","section":"Raccolta 1","number":57,"page":9,"text":"l'emottisi consiste in:\na. emissione di sangue proveniente dal rinofaringe\nb. emissione di sangue proveniente dal tratto gastroenterico\nc. espettorazione di sangue proveniente dalle vie respiratorie (dagli alveoli alla glottide)\nd. espettorazione di secrezioni provenienti dalle vie aeree"},{"id":"official-9-58-3","section":"Raccolta 1","number":58,"page":9,"text":"Per ortopnea e platipnea si intende:\na. sono sinonimi\nb. ortopnea tendenza a tenere il busto eretto e platipnea tendenza a stare sdraiati per\nalleviare la dispnea\nC. dispnea nel decubito sul lato sinistro e destro, rispettivamente\nd. ortopnea tendenza a stare sdraiati e platipnea tendenza a tenere il busto eretto per\nalleviare la dispnea"},{"id":"official-9-59-4","section":"Raccolta 1","number":59,"page":9,"text":"cosa si intende per MOFS?\na. Insufficienza multiorgano\nb. Insufficienza cardiaca\nC. Insufficienza renale legata alla sepsi\nd. Insufficienza respiratoria"},{"id":"official-9-60-5","section":"Raccolta 1","number":60,"page":9,"text":"La disfagia si definisce \"paradossa\" quando:\na. E maggiore per i liquidi che per i solidi\nb. Aumenta con il progredire della malattia\nc. É maggiore per i solidi che per i liquidi\nd. E' maggiori per i cibi freddi rispetto a quelli caldi"},{"id":"official-9-61-6","section":"Raccolta 1","number":61,"page":9,"text":"La disfagia \"paradossa\" è tipica di quale condizione patologica?:\na. Incontinenza cardiale\nb. Ernia iatale\nC. Acalasia\nd. Neoplasia cardiale"},{"id":"official-10-62-0","section":"Raccolta 1","number":62,"page":10,"text":"La presenza di bilirubina nelle urine\na. è indicativa di insufficienza renale\nb. è indicativa di colestasi\n c. è normale\nd. è dovuta alla capacità della bilirubina non coniugata di passare il filtro glomerulare"},{"id":"official-10-63-1","section":"Raccolta 1","number":63,"page":10,"text":"Quale tra questi monitoraggi/manovre non è strettamente necessario in caso di\nematemesi massira e shock\na. Esplorazione rettale\nb. Monitoraggio pressione arteriosa\nc. Monitoraggio diuresi\nd. Posizionamento di sondino naso-gastrico"},{"id":"official-10-64-2","section":"Raccolta 1","number":64,"page":10,"text":"La claudicatio intermittens è sintomo di:\na. Coxartrosi\nb. Trauma distorsivo della caviglia\nc. Lombalgia\nd. Arteriopatia periferica"},{"id":"official-10-65-3","section":"Raccolta 1","number":65,"page":10,"text":"Le dita a bacchetta di tamburo si possono osservare:\na. Nelle cardiopatie cianogene\nb. Nei forti fumatori\nc. nelle malattie polmonari croniche infiammatorie\nd. Tutte le risposte sono corrette"},{"id":"official-10-66-4","section":"Raccolta 1","number":66,"page":10,"text":"L'edema riscontrabile nei pazienti affetti da scompenso cardiaco:\n a. È dovuto principalmente a iponchia\nb. È legato alla perdita di grandi quantità di proteine nelle urine\nc. Dipende principalmente da una ridotta sintesi di albumina da parte del midollo osseo\nd. È rilevabile tipicamente nelle zone declivi"},{"id":"official-10-67-5","section":"Raccolta 1","number":67,"page":10,"text":"Quale dei seguenti esami non è utile per la diagnosi di ernia iatale:\na. RX esofago-stomaco-duodeno con pasto baritato\nb. Esofago-gastroscopia\n c. Ph-metria esofagea\nd. TAC toracica con mezzo di contrasto"},{"id":"official-10-68-6","section":"Raccolta 1","number":68,"page":10,"text":"La dispnea:\na. sensazione soggettiva di difficoltà respiratoria\nb. È dovuta esclusivamente a patologie che colpiscono primitiamente l'apparato\nrespiratorio\nc. si associa invariabilmente a diminuzione della saturazione emoglobinica arteriosa\nd. è una patologia respiratoria caratterizzata da tosse e cianosi"},{"id":"official-11-69-0","section":"Raccolta 1","number":69,"page":11,"text":"per causalgia si intende:\na. Un disturbo caratterizzato da impotenza sessuale\nb. Interessa bilateralmente fibre sensitive e motorie\n c. Un dolore da cause irritative del neurone sensitivo periferico\n d. un dolore continuo, intenso, a carattere urente a seguito di stimolazione tattile"},{"id":"official-11-70-1","section":"Raccolta 1","number":70,"page":11,"text":"Fra le cause più frequenti di tasse cronica con rederalatoracka negativa recordama:\nA. neoplasia polmonare\nB. polmonite batterica lobare\nC. malattia da reflusso gastro-esofageo\nD. Sarcoidosi"},{"id":"official-11-71-2","section":"Raccolta 1","number":71,"page":11,"text":"Il respiro di Biot:\nA. è caratterizzato da iperpnea continua\n B. è caratterizzato da ipopnea e iperpnea casuali, senza pause\n C. è caratterizzato da iperpnea alternata da pause di apnea\nD. è caratterizzato da graduale iperpnea/Ipopnea con pause di apnea"},{"id":"official-11-72-3","section":"Raccolta 1","number":72,"page":11,"text":"Il primo tono cardiaco:\nA. corrisponde alla chiusura delle valvole atrioventricolari\nB. corrisponde alla chiusura delle valvole semilunari cardiache\nC. è apprezzabile solo in età neonatale\nD. non si sdoppia mai"},{"id":"official-11-73-4","section":"Raccolta 1","number":73,"page":11,"text":"Non è una manifestazione prevalente dell'ipercapnia:\nA. l'irrequietezza motoria\nB. L'ipersecrezione bronchiale\nC. La cefalea\nD. L'oliguria"},{"id":"official-11-74-5","section":"Raccolta 1","number":74,"page":11,"text":"I reticolociti:\nA. sono normalmente >4%\nB. aumentano nelle emorragie acute e croniche\nC. aumentano nell'anemia sideropenica\nD. aumentano nelle infezioni"},{"id":"official-11-75-6","section":"Raccolta 1","number":75,"page":11,"text":"Quale dei seguenti parantetri è indicativo di pancreatite acuta, se aumentato nel siero\nA. AMS\n B. ACP\nC. ALT\nD. VLDL"},{"id":"official-12-76-0","section":"Raccolta 1","number":76,"page":12,"text":"La proteina che veicola il Fe nel sangue è:\nA. ferritina\n B. emosiderina\nC. transferrina\nD. ceruloplasmina"},{"id":"official-12-77-1","section":"Raccolta 1","number":77,"page":12,"text":"Quale dei serventi parametri sierici è compatibile con una diagnosi di epatopatia\nostruttiva:\nA. Aumento ALP e AMS\nB. Aumento LDH-1 e CK-2\nC. Iperbilirubinemia indiretta\nD. Aumento gamma-GT, ALP e bilirubina diretta"},{"id":"official-12-78-2","section":"Raccolta 1","number":78,"page":12,"text":"L'elettroforesi dell'emoglobina di un adulto evidenzia 30% dl HbH: si tratta di un caso\ndi\nA. B-talassemia\nB. a-talassemia\nC. anemia falciforme\nD. anemia sideropenica"},{"id":"official-12-79-3","section":"Raccolta 1","number":79,"page":12,"text":"aumento di BUN e creatinina nel sangue, oliguria e presenza di cilindri ematici nelle\nurine sono compatibili con quale delle seguenti diagnosi\nA. Epatite acuta\nB. Glomerulonefrite acuta\nC. Acidosi metabolica\nD. Sindrome nefrosica"},{"id":"official-12-80-4","section":"Raccolta 1","number":80,"page":12,"text":"All'esame gastroscopico l'ulcera gastrica:\nA. Presenta margini regolari a scodella\nB. Non chiede l'esecuzione di biopsie multiple\nC. Ricorda l'aspetto della cute nella sindrome morbilliforme\nD. Presenta lesioni di aspetto vegetante"},{"id":"official-12-81-5","section":"Raccolta 1","number":81,"page":12,"text":"La dispnea:\nA. è dovuta esclusivamente a patologie che colpiscono primitivamente l'apparato\nrespiratono\n B. è sensazione soggettiva di difficoltà respiratoria\nC. è una patologia respiratoria caratterizzata da tosse e cianosi\n D. si associa invanabilmente a diminuzione della saturazione emoglobinica arteriosa"},{"id":"official-12-82-6","section":"Raccolta 1","number":82,"page":12,"text":"Gli obiettivi della terapia palliativa sono tutti i seguenti tranne\nA. aumentare le chance di guarigione del paziente\nB. Migliorare la qualita' di vita\nC. Migliorare i sintomi del tumore"},{"id":"official-13-83-0","section":"Raccolta 1","number":83,"page":13,"text":"quali segni clinici sono tipici dell'edema linfatico?\nA. Edema molle\nB. Ulcere perimalleolari\nC. Edema duro, con segno di Stemmer positivo e infezioni ricorrenti\nD. Edema pretibiale"},{"id":"official-13-84-1","section":"Raccolta 1","number":84,"page":13,"text":"Il miglior esame di imaging per visualizzare le strutture mediastiniche, sia dal punto di\nvista dell'invasività che da quello dei costi, è:\nA. Ecografia\nB. TC/RM\nC. Toracoscopia esplorativa\nD. Mediastinoscopia"},{"id":"official-13-85-2","section":"Raccolta 1","number":85,"page":13,"text":"Quale dei seguenti caratteri non può assumere la sensazione dolorosa?\nA. Terebrante\nB. Ottenebrante\nC. Urente\nD. Osteocopo"},{"id":"official-13-86-3","section":"Raccolta 1","number":86,"page":13,"text":"Il segno di Kussmaul è:\nA. Aumento paradosso della pressione giugulare in inspirazione\nB. Associato a tamponamento cardiaco\nC. Tutte le risposte sono corrette\nD. Può accompagnarsi a polso paradosso (marcata riduzione in ampiezza durante\nl’inspiraizone)"},{"id":"official-13-87-4","section":"Raccolta 1","number":87,"page":13,"text":"Un soffio diastolico può corrispondere a:\na. insufficienza aortica\nb. nessuna di queste scelte\nc. insufficienza mitralica\nd. stenosi aortica"},{"id":"official-13-88-5","section":"Raccolta 1","number":88,"page":13,"text":"Le terapie antineoplastiche possono essere tutte le seguenti tranne:\na. ormonoterapia\nb. chemioterapia\nc. terapia anticoagulante\nd. terapie biologiche"},{"id":"official-13-89-6","section":"Raccolta 1","number":89,"page":13,"text":"Fisiopatologicamente il quadro clinico dello scompenso cardiaco è secondario a:\na. elevata pressione intracardiaca di riempimento (congestione)\nb. inadeguatezza della perfusione dei tessuti periferici"},{"id":"official-14-90-0","section":"Raccolta 1","number":90,"page":14,"text":"Il soffio di Austin - Flint:\na. E un soffio diastolico da rigurgito\nb. Si rinviene nel caso di pervietà del dotto di Botallo\nc. Si riscontra nella sindrome da prolasso della mitrale\nd. Si riscontra nell'insufficienza artica grave"},{"id":"official-14-91-1","section":"Raccolta 1","number":91,"page":14,"text":"Per polso dicroto si intende:\na. Una pulsazione aggiuntiva diastolica\nb. Una pulsazione aggiuntiva sul picco arrotondato dell'onda\nc. Una pulsazione aggiuntiva sistolica\nd. Una pulsazione aggiuntiva sulla branca ascendente dell'onda"},{"id":"official-14-92-2","section":"Raccolta 1","number":92,"page":14,"text":"L'edema riscontrabile nei pazienti affetti da scompenso cardiaco:\na. è rilevabile tipicamente nelle zone declivi\nb. è legato alla perdita di grandi quantità di proteine nelle urine\nc. è dovuto principalmente a iponchia\nd. dipende principalmente da una ridotta sintesi di albumina da parte del midollo osseo"},{"id":"official-14-93-3","section":"Raccolta 1","number":93,"page":14,"text":"L'ottusità del peduncolo vascolare può debordare ai lati dello sterno:\na. Per tumori mediastinici\nb. Per gozzo retrosternale\nc. Per ectasia e aneurisma della polmonare o dell'aorta\nd. Tutte le risposte sono corrette"},{"id":"official-14-94-4","section":"Raccolta 1","number":94,"page":14,"text":"L'ipercapnia arteriosa:\na. si verifica quando la [CO2] nel sangue arterioso è ≥ 25 mmHg\nb. è compensata da una diminuzione del riassorbimento renale di HCO3\nc. determina alcalosi\nd. è causata da ipoventilazione"},{"id":"official-14-95-5","section":"Raccolta 1","number":95,"page":14,"text":"Quale della seguenti facies è caratteristica di un soggetto \"normale\"?\na. nessuna delle risposte è corretta\nb. composita\nc. ippocratica\nd. lunans"},{"id":"official-14-96-6","section":"Raccolta 1","number":96,"page":14,"text":"Un turgore permante delle giugulari può verificarsi per:\na. Ostacolato deflusso di sangue dalle camere cardiache destre\nb. Tutte le risposte sono corrette"},{"id":"official-15-97-0","section":"Raccolta 1","number":97,"page":15,"text":"Nella meningite acuta:\na. Non si ha febbre\nb. Tutte le risposte sono corrette\nc. Si assumono atteggiamenti di difesa come la posizione a cane di fucile\nd. Nessuna risposta è corretta"},{"id":"official-15-98-1","section":"Raccolta 1","number":98,"page":15,"text":"Per causalgia si intende:\na. Un dolore continuo, intenso, a carattere urente a seguito di stimolazione tattile\nb. Interessa bilateralmente fibre sensitive e motorie\nc. È caratterizzato da impotenza sessuale\nd. Un dolore da cause irritative del neurone sensitivo periferico"},{"id":"official-15-99-2","section":"Raccolta 1","number":99,"page":15,"text":"Cosa si intende per MOFS?\na. Insufficienza respiratoria\nb. Insufficienza cardiaca\nc. Insufficienza renale legata alla sepsi\nd. Insufficienza multiorgano"},{"id":"official-15-100-3","section":"Raccolta 1","number":100,"page":15,"text":"Caratteristiche di sospetto di un nevo cutaneo:\na. colore nero, margini irregolari\nb. colore chiaro, aspetto rilevato\nc. aspetto lentigginoso, rossastro, a distribuzione irregolare\nd. colore chiaro, margini regolari"},{"id":"official-15-101-4","section":"Raccolta 1","number":101,"page":15,"text":"Durante l'esame obiettivo, la palpazione delle mammelle va eseguita:\na. con la paziente in clinostatismo e gli arti sollevati sopra la testa\nb. con la paziente in clinostatismo e gli arti lungo il corpo\nc. con la paziente in ortostatismo e gli arti sollevati sopra la testa\nd. con la paziente in ortostatismo e gli arti lungo il corpo"},{"id":"official-15-102-5","section":"Raccolta 1","number":102,"page":15,"text":"Il test più utile alla diagnosi definitiva di neoplasia maligna è\na. CEA\nb. TAC\nc. RX\nd. biopsia"},{"id":"official-15-103-6","section":"Raccolta 1","number":103,"page":15,"text":"Il compenso dell'acidosi respiratoria consiste in:\na. aumento escrezione renale di H* e riassorbimento HCO3-\nb. diminuzione ventilazione\nc. stimolazione dell'anidrasi carbonica eritrocitaria\nd. nessuna delle precedenti"},{"id":"official-16-104-0","section":"Raccolta 1","number":104,"page":16,"text":"Quale dei seguenti test della coagulazione esplora la via estrinseca?\na. PTT\nb. PT\nc. dosaggio dei FDP\nd. tempo di sanguinamento"},{"id":"official-16-105-1","section":"Raccolta 1","number":105,"page":16,"text":"Quale delle seguenti alterazioni elettrolitiche possiamo aspettarci in corso di acidosi\nmetabolica:\na. aumento HCO3-\nb. aumento Cl-\nc. aumento anion gap\nd. Diminuzione K*"},{"id":"official-16-106-2","section":"Raccolta 1","number":106,"page":16,"text":"La densità dei leucociti nel sangue è di:\na. 6-12x10^3/microlitrol\nb. 6-12x10^3/mL\nc. 6-12x10^9/microlitro\nd. 6-12x10^5/mL"},{"id":"official-16-107-3","section":"Raccolta 1","number":107,"page":16,"text":"Nelle a1-globuline migrano:\na. albumina\nb. HDL\nc. IgG\nd. tutte le proteine con PM 0.1 mg/dL"},{"id":"official-16-108-4","section":"Raccolta 1","number":108,"page":16,"text":"La principale componente dell'azoto non proteico nel siero è rappresentata da:\na. ammoniaca\nb. amminoacidi\nc. urea\nd. creatinina"},{"id":"official-16-109-5","section":"Raccolta 1","number":109,"page":16,"text":"Quale dei seguenti risultati NON è congruente con una condizione di emocromatosi:\na. sideremia 250microg /dI\nb. aumento % saturazione transferrina\nc. aumento Transferrina\nd. aumento ferritina"},{"id":"official-16-110-6","section":"Raccolta 1","number":110,"page":16,"text":"l’elettroforesi dell'emoglobina nella beta-talassemia minor evidenzia\nA. aumento di HbA1\nb. diminuzione di HbA2\nc. aumento di HbA2 e F\nd. diminuzione di tutti i tipi di Hb"},{"id":"official-17-111-0","section":"Raccolta 1","number":111,"page":17,"text":"Nell'epatopatia ostruttiva si può osservare un aumento di quale dei seguenti\nparametri sierici:\na. ALP e gammaGT\nb. colesterolo\nc. bilirubina diretta\nd. tutti i precedenti"},{"id":"official-17-112-1","section":"Raccolta 1","number":112,"page":17,"text":"Quale dei seguenti risultati è compatibile con una diagnosi di diabete mellito:\na. glicemia a digiuno 110 ms/dI\nb. glicemia 2 h dopo OGTT 250 mg/dL.\nc. Hb glicata 5%\nd. chetonemia 1.5 mg/dI"},{"id":"official-17-113-2","section":"Raccolta 1","number":113,"page":17,"text":"Tutti i seguenti risultati sono compatibili con l'abuso di alcol, tranne:\na. gammaGT 120 U/L\nb. AST150 U/L e AST/ALT>1\nc. MCV 110 micrometri^3\nd. PT/INR<1\n\nRISPOSTE: 1D 2C 3D 4D 5C 6B 7B 8C 9A 10C 11B 12A 13B 14C 15B 16B 17C 18A\n19B 20C 21B 22A 23D 24D 25D 26D 27B 28B 29A 30A 31A 32B 33B 34C 35C 36B 37D\n38B 39D 40A 41D 42A 43D 44C 45C 46C 47B 48D 49A 50D 51C 52D 53C 54C 55D 56B\n57C 58B 59A 60A 61C 62B 63A 64D 65D 66D 67D 68A 69D 70C 71C 72A 73D 74B 75A\n76C 77D 78B 79B 80A 81B 82A 83C 84B 85B 86A 87A 88C 89C 90D 91A 92A 93D 94D\n95A 96B 97C 98A 99D 100A 101A 102D 103A 104B 105C 106A 107B 108C 109C 110C\n111D 112B 113D\nLe Domande 14, 40, 53, 86, 95, 100, 113, sono molto ambigue e le risposte non sono\nunivoche, io comunque ho messo quelle con maggiore probabilità che siano corrette.\n\n\n\n                  Risposta\nDomanda         più        Nota\n                   probabile\n                            La domanda è scritta male: il PTT valuta la via\n14 PTT/INR      C             intrinseca, mentre l'INR deriva dal PT (via estrinseca).\n                                Tra le opzioni, la C è la meno sbagliata.\n                                     In realtà i diverticoli epifrenici (III inferiore) sono\n40 Diverticoli\n             D           generalmente da pulsione e spesso \"falsi\"; la\nesofagei\n                                 formulazione crea ambiguità.\n                                   Definizione classica: aumento paradosso della\n53 Segno di\n             B           pressione venosa giugulare durante l'inspirazione.\nKussmaul\n                                 L'opzione C (\"tutte\") è discutibile perché il polso"},{"id":"official-18-1-0","section":"Raccolta 2","number":1,"page":18,"text":"Le vie del complemento:\nA. Via Classica\n\n    •   Attivata da complessi antigene-anticorpo (soprattutto IgM e IgG).\n\n    •   Inizia con il legame di C1q agli anticorpi.\n\n    •  Sequenza iniziale:\n     C1 → C4 → C2 → C3 convertasi (C4b2a).\n\nB. Via Alternativa\n\n    •   Attivata direttamente da superfici microbiche (batteri, funghi, virus).\n\n    •  Non richiede anticorpi.\n\n    •  Coinvolge:\n      C3, Fattore B, Fattore D, Properdina.\n\n    •  C3 convertasi:\n     C3bBb.\n\nC. Via Lectinica (della Mannosio-Lectina)\n\n    •   Attivata dal legame della MBL (Mannose-Binding Lectin) ai residui di mannosio\n       presenti sui microrganismi."},{"id":"official-19-2-0","section":"Raccolta 2","number":2,"page":19,"text":"dolore della fibromialgia:\nDiffuso: interessa più regioni del corpo contemporaneamente, spesso sopra e sotto la vita\ne su entrambi i lati.\nCronico: dura almeno 3 mesi.\nMuscoloscheletrico: viene descritto come dolore ai muscoli, ai tendini e alle articolazioni,\nanche se non c'è infiammazione articolare oggettiva.\nVariabile: può essere percepito come bruciore, indolenzimento, rigidità, fitte o sensazione\ndi corpo \"ammaccato\".\nAssociato a iperalgesia e allodinia:\n\n    •  Iperalgesia = uno stimolo doloroso viene percepito come molto più intenso del\n      normale.\n\n    •  Allodinia = uno stimolo normalmente non doloroso (es. una lieve pressione o il\n       contatto con i vestiti) provoca dolore.\n\nPeggiora frequentemente con stress, sonno non ristoratore, freddo, umidità,\naffaticamento fisico o mentale."},{"id":"official-19-3-1","section":"Raccolta 2","number":3,"page":19,"text":"dolore di ernia discale:\nDolore irradiato lungo il territorio del nervo interessato.\n\n    •  Ernia lombare → dolore che si irradia a gluteo, coscia, gamba e piede (sciatalgia o\n       cruralgia).\n\n    •  Ernia cervicale → dolore che si irradia a spalla, braccio e mano\n      (cervicobrachialgia).\n\nTipo di dolore:\n\n    •   trafittivo\n\n    •  urente (bruciante)\n\n    •   folgorante (\"scossa elettrica\")\n\n    •  lancinante\n\n Peggiora con:\n\n    •  tosse\n\n    •  starnuto\n\n    •  manovra di Valsalva\n\n    •   flessione del tronco"},{"id":"official-20-4-0","section":"Raccolta 2","number":4,"page":20,"text":"l'anosmia: L'anosmia è la perdita completa dell'olfatto, cioè l'incapacità di percepire\ngli odori.\n\nPuò essere:\n\n    •  Totale: assenza completa della percezione degli odori.\n\n    •  Parziale (più correttamente detta iposmia): riduzione della capacità olfattiva.\n\nCause principali\n\n    •  Raffreddore, rinite, sinusite.\n\n    •   Polipi nasali.\n\n    •   Infezioni virali (ad esempio COVID-19).\n\n    •  Traumi cranici con lesione del nervo olfattivo.\n\n    •   Malattie neurodegenerative come Malattia di Parkinson e Malattia di Alzheimer.\n\n    •  Tumori della base cranica o del lobo frontale."},{"id":"official-20-5-1","section":"Raccolta 2","number":5,"page":20,"text":"ipofisite linfocitaria: è la perdita completa dell'olfatto, cioè l'incapacità di percepire\ngli odori.\n\nPuò essere:\n\n    •  Totale: assenza completa della percezione degli odori.\n\n    •  Parziale (più correttamente detta iposmia): riduzione della capacità olfattiva.\n\nCause principali\n\n    •  Raffreddore, rinite, sinusite.\n\n    •   Polipi nasali.\n\n    •   Infezioni virali (ad esempio COVID-19).\n\n    •  Traumi cranici con lesione del nervo olfattivo.\n\n    •   Malattie neurodegenerative come Malattia di Parkinson e Malattia di Alzheimer."},{"id":"official-21-6-0","section":"Raccolta 2","number":6,"page":21,"text":"qual è il limite del microarray rispetto a NGS:\n\nè che il microarray può identificare solo varianti già note e per cui sono state\nprogettate specifiche sonde, mentre il NGS può rilevare anche varianti nuove o inattese."},{"id":"official-21-7-1","section":"Raccolta 2","number":7,"page":21,"text":"sindrome sheehan: è un ipopituitarismo post-partum causato da necrosi\nischemica dell'ipofisi anteriore in seguito a una grave emorragia ostetrica con\nipotensione o shock."},{"id":"official-21-8-2","section":"Raccolta 2","number":8,"page":21,"text":"OGTT: è il test da carico orale di glucosio, utilizzato per valutare la capacità\ndell'organismo di metabolizzare il glucosio e per diagnosticare il diabete mellito o il\nprediabete.\n\nCome si esegue"},{"id":"official-21-1-3","section":"Raccolta 2","number":1,"page":21,"text":"Digiuno di almeno 8 ore."},{"id":"official-21-2-4","section":"Raccolta 2","number":2,"page":21,"text":"Misurazione della glicemia basale."},{"id":"official-21-3-5","section":"Raccolta 2","number":3,"page":21,"text":"Assunzione orale di 75 g di glucosio (negli adulti)."},{"id":"official-21-4-6","section":"Raccolta 2","number":4,"page":21,"text":"Misurazione della glicemia dopo 2 ore (e talvolta a intervalli intermedi).\n\nInterpretazione (criteri OMS/ADA)\n\nGlicemia a 2 ore dopo OGTT:\n\n    •  < 140 mg/dL → normale\n\n    •  140–199 mg/dL → ridotta tolleranza al glucosio (IGT, prediabete)\n\n    •  ≥ 200 mg/dL → diabete mellito\n\nDiagnosi di diabete mellito\n\nÈ possibile porre diagnosi se è presente uno dei seguenti:\n\n    •  Glicemia a digiuno ≥ 126 mg/dL.\n\n    •  Glicemia a 2 ore dopo OGTT ≥ 200 mg/dL."},{"id":"official-22-9-0","section":"Raccolta 2","number":9,"page":22,"text":"se ho albumina pari a 1.5 mg/dl, l'edema per quale motivo si forma: il meccanismo\nprincipale è proprio la riduzione della pressione oncotica plasmatica dovuta a una\ngrave ipoalbuminemia.\n\nCon albumina a 1,5 mg/dL (valore estremamente basso, compatibile con situazione\ncritica), succede questo:\n\nNel microcircolo esiste un equilibrio tra:\n\n    •  pressione idrostatica → spinge acqua fuori dai capillari\n\n    •  pressione oncotica (colloidosmotica), soprattutto da albumina → richiama acqua\n      dentro i capillari"},{"id":"official-22-10-1","section":"Raccolta 2","number":10,"page":22,"text":"LYMPHA per cosa si effettua:\nÈ una tecnica chirurgica usata durante la rimozione dei linfonodi (linfadenectomia),\nsoprattutto in oncologia (es. tumore della mammella), per cercare di prevenire il linfedema."},{"id":"official-22-11-2","section":"Raccolta 2","number":11,"page":22,"text":"Bloomberg: è un segno clinico usato per valutare la presenza di irritazione\nperitoneale. Preme lentamente sull’addome (compressione profonda), e poi rilascia\nrapidamente la pressione"},{"id":"official-22-12-3","section":"Raccolta 2","number":12,"page":22,"text":"Murphy: è una manovra clinica usata per sospettare una colecistite acuta¸palpa il\nquadrante superiore destro dell’addome (ipocondrio dx) e si chiede al paziente di\nfare una inpirazione profonda, positivo se blocca improvvisamente l’inspirazione."},{"id":"official-22-13-4","section":"Raccolta 2","number":13,"page":22,"text":"Addison: forma di insufficienza surrenalica primitiva, cioè le ghiandole surrenali\nnon producono abbastanza ormoni (cortisolo, aldosterone, androgeni), che calando\nprovocano stanchezza, ipoglicemia, perdita di peso, debolezza, perdita di Na e acqua,\naumento di K, disidratazione."},{"id":"official-22-14-5","section":"Raccolta 2","number":14,"page":22,"text":"Sindrome nefrosica: è un insieme di segni clinici dovuti a un danno del glomerulo\nrenale che porta a una perdita massiva di proteine nelle urine.\n\nSi parla di sindrome nefrosica quando c’è:\n\n    •  proteinuria > 3,5 g/24h\n\n    •  ipoalbuminemia -> diminuzione pressione oncotica -> edema\n\n    •  edemi\n\n    •  iperlipidemia (spesso con lipiduria)"},{"id":"official-23-15-0","section":"Raccolta 2","number":15,"page":23,"text":"Peso della tiroide: 5-25 grammi nell’adulto"},{"id":"official-23-16-1","section":"Raccolta 2","number":16,"page":23,"text":"Con la campana cosa ausculti (soffi, sfregamento pericardico, qualcosa\ncondiastolico, toni e qualcosa): toni cardiaci bassi (terzo e quarto tono), soffio da\nstenosi mitralica, soffi diastolici a bassa frequenza (stenosi tricuspide, e flussi aumentati)"},{"id":"official-23-17-2","section":"Raccolta 2","number":17,"page":23,"text":"Manovra del ponzamento (valsalva) : è una manovra in cui si aumenta\nvolontariamente la pressione intratoracica.\nIl paziente:\n\n    •   inspira profondamente\n\n    •  chiude glottide\n\n    •  “spinge come per evacuare o sollevare un peso” senza far uscire aria"},{"id":"official-23-18-3","section":"Raccolta 2","number":18,"page":23,"text":"Dolore somatico: (aumenta con la palpazione e qualcosa con il movimento):\nè ben localizzato e legato alla stimolazione dei recettori del dolore nella parete\ncorporea (cute, muscoli, peritoneo parietale, articolazioni). Peggiora con tutto ciò che\nstimola o muove la zona lesionata/infiammata. Migliora con il riposo, posizioni\nantalgiche,FANS."},{"id":"official-23-19-4","section":"Raccolta 2","number":19,"page":23,"text":"Summer: È una sintesi strutturata e rapida delle informazioni cliniche rilevanti di un\npaziente o di una condizione.\n\nServe a:\n\n    •  comunicazione tra medici (es. dimissione ospedaliera)\n\n    •  ragionamento clinico veloce\n\n    •  handover (passaggio di consegne)"},{"id":"official-23-20-5","section":"Raccolta 2","number":20,"page":23,"text":"Autoanticorpi come li vedi: immunofluorescenza"},{"id":"official-23-21-6","section":"Raccolta 2","number":21,"page":23,"text":"Vomito caffeano cosa è: È dovuto alla presenza di sangue digerito nello stomaco:\n\n    •     il sangue viene a contatto con l’acido gastrico\n\n    •  l’emoglobina si trasforma in ematina acida\n\n    •  questo dà il colore scuro e l’aspetto “granuloso”"},{"id":"official-23-22-7","section":"Raccolta 2","number":22,"page":23,"text":"Quale è meno probabile che dia emoragia digestiva: ulcera peptica, sindrome di\nBarrett , ulcera da stress, varici esofagee"},{"id":"official-24-23-0","section":"Raccolta 2","number":23,"page":24,"text":"Linfoscialoadenite mandibolare cronica:\nduro elastica si ingrandisce con la masticazione, molle, crea fistole, la ghiandola si lacera\n(o qualcosa di simile), spesso da calcoli salivari che ostruiscono il dotto di Wharton.\n\n24: Dolore centrale: al SNC, cause come ictus, sclerosi multipla, lesioni midollari\ntraumatiche, tumori al SNC, Parkinson ecc"},{"id":"official-24-25-1","section":"Raccolta 2","number":25,"page":24,"text":"Strie nigre: Sono compatibili con ipercortisolismo (sindrome di Cushing /\nipercorticosurrenalismo). in quanto aumenta ATCH che deriva dal POMC che aumenta\nanche i MSH (melanociti) danno così iperpigmentazione."},{"id":"official-24-26-2","section":"Raccolta 2","number":26,"page":24,"text":"Dove si vede meglio la cianosi? letto ungueale/ guance / ..../ o tutte e 3\nin generale si vede meglio nelle mucose in quanto sono irrorate da vasi superficiali (come\nla lingua e il cavo orale)."},{"id":"official-24-27-3","section":"Raccolta 2","number":27,"page":24,"text":"Dolore neuropatico: danno al nervo periferico stesso, bruciante, elettrico/a scossa,\nlancinante, parestesie, dolore spontaneo anche senza stimolo. (diabetica, nevralgia post-\nerpetica, compressione tunnel carpale o midollare, chemioterapia)"},{"id":"official-24-28-4","section":"Raccolta 2","number":28,"page":24,"text":"Dolore viscerale: origina dagli organi interni (visceri) come intestino, fegato,\npancreas, cuore, vie biliari, ecc.\nmal localizzato\n\n    •  spesso descritto come:\n\n         o  sordo\n\n         o  crampiforme\n\n         o  “profondo”\n\n         o  oppressivo\n\n    •  può essere intermittente (colico) o continuo\n\n    •  spesso associato a sintomi autonomici:\n\n         o  nausea\n\n         o  vomito\n\n         o  sudorazione\n\n         o  pallore"},{"id":"official-25-29-0","section":"Raccolta 2","number":29,"page":25,"text":"Qual è il tumore più prevalente negli uomini? - prostata / colon retto /polmone"},{"id":"official-25-30-1","section":"Raccolta 2","number":30,"page":25,"text":"Onde F a dente di sega nel flutter atriale: nella tachiaritmia sopraventricolare, atri no\nsi contraggono normalmente a causa di un circuito rapido e regolare. L’onda F\nrappresenta la depolarizzazione atriale rapida, nella 2, 3 e aVF (derivazioni inferiori)."},{"id":"official-25-31-2","section":"Raccolta 2","number":31,"page":25,"text":"cosa osservare durante palpazione tiroide: sede dimensioni consistenza margini/\nmargini mobilità fremiti"},{"id":"official-25-32-3","section":"Raccolta 2","number":32,"page":25,"text":"cosa ha sostituito microarray: le next generation sequencing (NGS)"},{"id":"official-25-33-4","section":"Raccolta 2","number":33,"page":25,"text":"dolore irradiato al dorso+febbre? colica renale/colecistite acuta/ appendicite"},{"id":"official-25-34-5","section":"Raccolta 2","number":34,"page":25,"text":"sequele sclerosi sistemica: ebolezza o paralisi, spasticità, disturbi della\ndeambulazione , atassia , disturbi visivi (neurite ottica) , disturbi sensitivi, affaticamento\ncronico, disfunzioni vescicali/intestinale"},{"id":"official-25-35-6","section":"Raccolta 2","number":35,"page":25,"text":"tipo di dolore che acuisce con movimenti ed è ben localizzato? nervoso/\nparietale/organi cavi/ organi parenchimatosi"},{"id":"official-25-36-7","section":"Raccolta 2","number":36,"page":25,"text":"dolore fossa iliaca dx: appendicite acuta, patologie ginecologiche (cisti ovarica,\ngravidanza extrauterina, malattia infiammatoria pelvica), ileite (crohn), linfadenite\nmesenterica, diverticolo di Meckel infiammato, calcolo ureterale."},{"id":"official-25-37-8","section":"Raccolta 2","number":37,"page":25,"text":"cosa sono movimenti stereotipati: ripetuti, fissi, non finalizzati e difficilmente\ninterrompibili ( in 2","number":46,"page":26,"text":"un dolore toracio ben definito, traffitivo, accentuato alla digitopressione:\ndolore viscerale - somatico- riferito- neuropatico"},{"id":"official-26-47-3","section":"Raccolta 2","number":47,"page":26,"text":"quale delle seguenti non rappresenta una complicanza dell’acalasia:\nesofagite terminale - erniale iatale - perforazione esofagea - polmonite ab ingestis"},{"id":"official-26-48-4","section":"Raccolta 2","number":48,"page":26,"text":"nel prelievo venoso cos’è il sistema vacutainer?\nL’inserimento nella siringa della campana - nessuna risposta è corretta - è l’inserimento\nnella siringa del sistema campana+adattatore - è l’inserimento nel sistema della provetta"},{"id":"official-26-49-5","section":"Raccolta 2","number":49,"page":26,"text":"Il respiro di Cheyne-Stokes:\nè caratterizzato da ipopnea e iperpnea casuali, senza pause - è caratterizzato da graduale\niperpnea/ipopnea con pause di apnea - è caratterizzata da iperpnea alternata da pause di\napnea - è caratterizzata da iperpnea continua"},{"id":"official-26-50-6","section":"Raccolta 2","number":50,"page":26,"text":"allargamento QRS:\npuò comparire dispnea o cardiopalmo - sempre asintomatico - è dovuta a malattia\ncardiaca"},{"id":"official-26-51-7","section":"Raccolta 2","number":51,"page":26,"text":"La tosse:\nè dovuta a stimolazione di terminazioni nervose sensitive localizzate nelle vie aeree;\nesofagee, uditivo - può aggravare la patologia erniale addominale o l’incontinenza urinarie\n- svolge un ruolo protettivo delle vie respiratorie - tutte le precedenti"},{"id":"official-26-52-8","section":"Raccolta 2","number":52,"page":26,"text":"Polso parvus et tardus: stenosi aortica, parvus (debole) e tardus (lento nel\nraggiungere il picco)"},{"id":"official-26-53-9","section":"Raccolta 2","number":53,"page":26,"text":"Irradiazione dolore calcolo renale: inguine e coscia"},{"id":"official-26-54-10","section":"Raccolta 2","number":54,"page":26,"text":"Irradiazione dolore pancre ":"Raccolta 2","number":84,"page":28,"text":"ecg blocco di branca dx: QRS maggiore o uguale a 120ms, patterni rSR’ in V1 e V”,\nonda S slargata in DI e V6."},{"id":"official-28-85-12","section":"Raccolta 2","number":85,"page":28,"text":"esame da fare in caso di ernia inguinale:\nesame principale:\n\n    •   visita clinica + palpazione in ortostatismo e Valsalva\n\nesame strumentale (se dubbio):\n\n    •  ecografia inguinale"},{"id":"official-29-86-0","section":"Raccolta 2","number":86,"page":29,"text":"Non è una manifestazione prevalente dell’iPod (ipossia) :\nla cianosi centrale - la diminuzione del visus - l’ipotensione - il papilledema"},{"id":"official-29-87-1","section":"Raccolta 2","number":87,"page":29,"text":"La sensibilità generale protopatica:\n\na. È condotta al SNC da fibre mielinizzate appartenenti a nervi viscerali, e trasmessa ai\ncentri superiori da vie multisinaptiche\nb. E condotta al SNC da fibre amieliniche o scarsamente mielinizzate appartenenti a nervi\nviscerali trasmessa ai centri superiori da vie multisinaptiche\nc. è condotta al SNC da fibre amieliniche o scarsamente mielinizzate appartenenti ai nervi\nviscerali e trasmessa ai centri superiori da vie oligosinaptiche\nd. Nessuna risposta è corretta"},{"id":"official-29-88-2","section":"Raccolta 2","number":88,"page":29,"text":"Gli aghi cannula per le urgenze che misure hanno?\n\na. 22 Gauge e 24 Gauge-\nb. 14 e 16  -> minore è il numero e maggiore è il diametro (grandi quantità farmaci in\nemergenza)\nc. 18 e 20\nd. tutte le risposte sono corrette"},{"id":"official-29-89-3","section":"Raccolta 2","number":89,"page":29,"text":"Lo sfregamento pleurico è un rumore respiratorio:\na. prevalente in espirazione\nb. generato dalla presenza di un versamento pleurico essudatizio\nc. prevalente in inspirazione e talora nella prima fase espiratoria\nd. un rumore umido generato da flogosi della pleura"},{"id":"official-29-90-4","section":"Raccolta 2","number":90,"page":29,"text":"patologia che dà alterazioni della respirazione ma non della sudorazione?\ne le opzioni se non ricordo male erano sindrome di kniest, malattia di Wilson, deficit α1-\nantitripsina e fibrosi cistica\nin quanto è una malattia neurologica ed epatica, solitamente non altera la sudorazione."},{"id":"official-29-91-5","section":"Raccolta 2","number":91,"page":29,"text":"il soffio cardiaco definito come \"rullio diastolico\" è tipico della:\na. stenosi aortica\nb. stenosi polmonare\nc. stenosi mitralica\nd. disfunzione dei muscoli papillari cardiaci"},{"id":"official-30-92-0","section":"Raccolta 2","number":92,"page":30,"text":"Nei circoli collaterali addominali tipo cava-cava nella cirrosi epatica, il flusso\nematico è diretto:\na. dall'alto verso il basso\nb. dal basso verso l'alto\nc. dall'ombelico verso l'esterno\nd. dall'esterno verso la zona ombelicale"},{"id":"official-30-93-1","section":"Raccolta 2","number":93,"page":30,"text":"Nelle urine del paziente con ittero da ostruzione del coledoco si trova:\na. bilirubina indiretta\nb. bilirubina diretta\nc. urobilinogeno\nd. tutti I precedenti"},{"id":"official-30-94-2","section":"Raccolta 2","number":94,"page":30,"text":"Quale dei seguenti parametri è indicativo di pancreatite acuta, se aumentato nel\nsiero:\na. Amilasi -> anche lipasi\nb. Acetiltrasferasi\nc. Arginino-alanina transferasi\nd. VLDL"},{"id":"official-30-95-3","section":"Raccolta 2","number":95,"page":30,"text":"Un aumento monoclonale nella zona delle gammaglobuline:\na. Si verifica sempre durante le infezioni virali\nb. Può essere dovuto all'aumento di fibrinogeno\nc. Indica una espansione plasmacellulare neoplastica\nd. è un segno di infiammazione"},{"id":"official-30-96-4","section":"Raccolta 2","number":96,"page":30,"text":"Gli epatociti peri-venosi sono principalmente responsabili:\na. Del ciclo dell'urea\nb. Delle reazioni di monoossigenazione e coniugazione\nc. della gluconeogenesi da lattato\nd. Nessuna delle precedenti risposte"},{"id":"official-30-97-5","section":"Raccolta 2","number":97,"page":30,"text":"Quale dei seguenti è un enzima esclusivamente epatocellulare:\na. ALT\nb. ALP\nc. LDH\nd. Gamma-GT"},{"id":"official-31-98-0","section":"Raccolta 2","number":98,"page":31,"text":"L’ammoniaca nel siero:\na. Si dosa con la reazione della ureasi batterica\nb. è normalmente compresa tra 20-30 microgrammi/dL (30microMolare)\nc. Aumenta nell’insufficienza epatica\nd. Tutte corrette"},{"id":"official-31-99-1","section":"Raccolta 2","number":99,"page":31,"text":"Un aumento dei livelli di calcio nel sangue con calcemia totale di 14.0 mg/dl è\nindicativo di:\na. insufficienza renale cronica\nb. iperparatiroidismo primitivo da adenoma PTH secernente\nc. iperparatiroidismo secondario da insufficienza renale\nd. ipoparatiroidismo cronico"},{"id":"official-31-100-2","section":"Raccolta 2","number":100,"page":31,"text":"Quale delle seguenti affermazioni è vera?\na. la Ph-metria nelle 24 ore è utile per valutare la corrispondenza tra sintomo e reflusso\nalcalino\nb. la Ph-metria nelle 24 ore è utile per valutare quanti episodi di reflusso con pho4 si\nverificano\nc. la Ph-metria nelle 24 ore non è utile per valutare l'efficacia della terapia\nmedica/chirurgica\nd. la Ph-metria nelle 24 ore è utile per valutare la durata degli episodi di reflusso acido"},{"id":"official-31-101-3","section":"Raccolta 2","number":101,"page":31,"text":"per polso dicroto si intende:\na. una pulsazione aggiuntiva sul picco arrotondato dell’onda\nb. una pulsazione aggiuntiva diastolica\nc. una pulsazione aggiuntiva sistolica\nd. una pulsazione aggiuntiva sulla branca ascendente dell’onda"},{"id":"official-31-102-4","section":"Raccolta 2","number":102,"page":31,"text":"il segno di Kussmaul è:\na. può accompagnare a polso paradosso (marcata riduzione in ampiezza durante\nl’inspirazione)\nb. l’aumento paradosso della pressione giugulare in inspirazione\nc. tutte le risposte sono giuste\nd. associato a tamponamento cardiaco"},{"id":"official-31-103-5","section":"Raccolta 2","number":103,"page":31,"text":"Caratteristiche di sospetto di un nevo cutaneo:\na. colore nero, margini irregolari\nb. colore chiaro, aspetto rilevato\nc. aspetto lentigginoso, rossastro, a distribuzione irregolare\nd. colore chiaro, margini regolari"},{"id":"official-32-104-0","section":"Raccolta 2","number":104,"page":32,"text":"termine azotemia indica:\nA. La concentrazione di NH3 nel sangue\nB. La concentrazione di azoto non proteico nel sangue (urea)\nC. La concentrazione di urea dosata con l'ureasi batterica\nD. La concentrazione di urea dosata con l'urea ossidasi"},{"id":"official-32-105-1","section":"Raccolta 2","number":105,"page":32,"text":"Nella Alfa-tal 1 omozigote:\na. Sono mutati 2 geni per le catene alfa\nB. Sono mutati 3 geni per le catene alfa\nC. Sono mutati 4 geni per le catene alfa\nD. Nessuna delle risposte corretta"},{"id":"official-32-106-2","section":"Raccolta 2","number":106,"page":32,"text":"Un aumento dell'urea nel siero:\na. è indicativa di danno tubulare renale\nb. si verifica nella gotta\nc. è un indicatore di danno glomerulare\nd. significa che l'urea nel siero è> 40 mg/dl"},{"id":"official-32-107-3","section":"Raccolta 2","number":107,"page":32,"text":"Quale tra i seguenti è l'indicatore più precoce di infarto del miocardio:\na. LDH1\nb. Tnl\nc. CK-2\nd. Мb"},{"id":"official-32-108-4","section":"Raccolta 2","number":108,"page":32,"text":"La vitamina B12 è necessaria nella reazione\na. della carnitina acil-transferasi\nb. Della sintesi di metionina dall'ornitina\nc. Della sintesi del dTMP\nd. Della riduzione del DHF a THF"},{"id":"official-32-109-5","section":"Raccolta 2","number":109,"page":32,"text":"Quali tra i seguenti indicatori di malnutrizione ha l'emivita più breve\na. Albumina\nb. Pre-albumina\nc. RBP (retinol binding protein)\nd. Colesterolo"},{"id":"official-33-110-0","section":"Raccolta 2","number":110,"page":33,"text":"L'enzima xantina ossidasi:\na. È deficitario nella gotta\nb. Catalizza l'ossidazione di adenina e guanina a xantina\nc. è inibito da allopurinolo\nd. Catalizza l'ultima reazione del catabolismo delle basi pirimidiniche"},{"id":"official-33-111-1","section":"Raccolta 2","number":111,"page":33,"text":"Apo E è:\na. La Apo tipica dei chilomicroni nascenti\nb. La Apo tipica delle VLDL\nc. Un attivatore della LPL endoteliale\nd. Ceduta dalle HDL a chilomicroni e VLDL  -> reuptake dei remnant"},{"id":"official-33-112-2","section":"Raccolta 2","number":112,"page":33,"text":"Il termine azotemia indica:\na. La concentrazione di N2 nel sangue\nb. La concentrazione di ammoniaca nel sangue\nc. La concentrazione di urea nel sangue, dosata come azoto ammoniacale\nd. La concentrazione di creatinina nel sangue"},{"id":"official-33-113-3","section":"Raccolta 2","number":113,"page":33,"text":"L'ammoniaca nel siero:\na. Si dosa con la reazione della ureasi batterica\nb. È normalmente compresa tra 20-30 µg/dL (30 µM)\nc. Aumenta nell'insufficienza epatica\nd. Tutte le risposte sono corrette"},{"id":"official-33-114-4","section":"Raccolta 2","number":114,"page":33,"text":"tra i criteri diagnostici di diabete mellito NON c'è:\na. Glicosuria\nb. Familiarità\nc. Obesità\nd. Tutte le risposte sono corrette"},{"id":"official-33-115-5","section":"Raccolta 2","number":115,"page":33,"text":"Attraverso le reazioni combinate degli enzimi adenilato cinasi e AMP deaminasi\nnel muscolo in contrazione si produce dall'ADP:\na. ATP\nb. ATP+ NH\nc. AMP\nd. Adenosina"},{"id":"official-34-116-0","section":"Raccolta 2","number":116,"page":34,"text":"Quale dei seguenti fenomeni non caratterizza la sindrome di Pickwick?\na. Obesità marcata\nb. La respirazione di Cheyne-Stokes\nc. iperventilazione alveolare -> ma ipoventilazione\nd. Ipersonnia"},{"id":"official-34-117-1","section":"Raccolta 2","number":117,"page":34,"text":"la parte più difficile dell'informazione ad un malato neoplastico è:\na. la prognosi\nb. la diagnosi\nc. sono tutte ugualmente difficili\nd. la terapia"},{"id":"official-34-118-2","section": e continuo, a esordio violento, con aumento graduale può essere: dolore\nriferito, dolore acuto da peritonite/pancreatite, occlusione intestinale parziale... –"},{"id":"official-40-176-1","section":"Raccolta 2","number":176,"page":40,"text":"Vomito fecaloide possibile in: ostruzione piloro, ileo paralitico precoce, ostruzione\nmeccanica bassa..."},{"id":"official-40-177-2","section":"Raccolta 2","number":177,"page":40,"text":"Nevralgia del trigemino:\na. rigidità del collo\nb. irradiazione alla nuca\nc. dolore parossistico in relazione a determinate attività\nd. dolore continuo"},{"id":"official-40-178-3","section":"Raccolta 2","number":178,"page":40,"text":"Il fine della percussione del fegato pell' E.O:\na. delimitare il margine superiore\nb. Delimitare il margine inferiore\nc. Partire sempre dalla fossa iliaca di destra"},{"id":"official-40-179-4","section":"Raccolta 2","number":179,"page":40,"text":"Ptosi palpebrale:\na. tipica del morbo di Bgsedow\nb. Abbassamento della palpebra superiore fino a coprire metà o tutto l'iride"},{"id":"official-40-180-5","section":"Raccolta 2","number":180,"page":40,"text":"In caso di addome acuto:\na. è silente nell'esame obiettivo\nb. l'aia epatica scompare\nc. la manovra di Blumberg è sempre negativa"},{"id":"official-40-181-6","section":"Raccolta 2","number":181,"page":40,"text":"Anni 70 – MYCIN"},{"id":"official-40-182-7","section":"Raccolta 2","number":182,"page":40,"text":"Macule o papule sono lesioni rilevate oppure petecchie vanno via con la\nvitropressione oppure i noduli sono lesioni chiare a contenuto liquido non torbido\n\nMacula: lesione non rilevata, solo una variazione di colore della pelle. Non si palpa.\n\nPapula: lesione rilevata, solida, di piccole dimensioni (generalmente < 1 cm).\n\nNodulo: lesione rilevata e solida, più profonda e generalmente più grande di una papula (>\n1 cm). Non contiene liquido.\n\nVescicola: lesione rilevata contenente liquido chiaro (sieroso), di piccole dimensioni.\n\nBolla: come la vescicola ma di dimensioni maggiori.\n\nPustola: lesione rilevata contenente liquido torbido o purulento."},{"id":"official-41-183-0","section":"Raccolta 2","number":183,"page":41,"text":"Microarray - Lipasi/ RNA trascritto/ DNA di specie non conosciute/...\nMisurare l'espressione genica tramite l'analisi degli RNA trascritti (l'RNA viene\nretrotrascritto in cDNA e ibridato sul chip). Identificare varianti genetiche o confrontare\nsequenze note."},{"id":"official-41-184-1","section":"Raccolta 2","number":184,"page":41,"text":"Epatomegalia come la rilevi?\nEsame obiettivo\n\n    •  Palpazione dell'addome: il margine inferiore del fegato può essere palpabile al di\n       sotto dell'arcata costale destra.\n\n    •  Percussione: permette di stimare l'estensione del fegato.\n\nEsami strumentali\n\n    •  Ecografia addominale: è l'esame più utilizzato per confermare e misurare\n       l'ingrandimento del fegato.\n\n    •  Se necessario, anche TC o RM possono valutarne dimensioni e caratteristiche."},{"id":"official-41-185-2","section":"Raccolta 2","number":185,"page":41,"text":"Splenomegalia? Percussione diretta - ispezione visiva - palpazione bimanuale sul\nlato - auscultazione di rumori(?)"},{"id":"official-41-186-3","section":"Raccolta 2","number":186,"page":41,"text":"Cos'è il deep learning? - ... che utilizza le reti neurali\nIl deep learning è un sottoinsieme del machine learning che utilizza reti neurali artificiali\ncon molti strati (\"deep\" = profonde) per apprendere automaticamente caratteristiche e\nschemi dai dati."},{"id":"official-41-187-4","section":"Raccolta 2","number":187,"page":41,"text":"Scoperta che ha rivoluzionato le -omics? Invenzione della PCR da parte di Kary\nMullis"},{"id":"official-41-188-5","section":"Raccolta 2","number":188,"page":41,"text":"Percentuale di bilateralità di diverticoli faringei (?)? 5-10% / 10-15% / 60-75% /.."},{"id":"official-42-189-0","section":"Raccolta 2","number":189,"page":42,"text":"Vomito caffeano definizione: è un vomito di colore bruno-scuro/nerastro, con\naspetto simile ai fondi di caffè.\n\nSi verifica quando il sangue è rimasto per un certo tempo nello stomaco ed è stato\nparzialmente digerito dall'acido gastrico, che trasforma l'emoglobina in ematina.\n\nIndica quindi generalmente un'emorragia del tratto gastrointestinale superiore (esofago,\nstomaco, duodeno) che non è così rapida da provocare l'emissione di sangue rosso vivo\n(ematemesi)."},{"id":"official-42-190-1","section":"Raccolta 2","number":190,"page":42,"text":"Rigurgito definizione: è la risalita passiva del contenuto gastrico o esofageo\nnella bocca, senza nausea, conati o contrazioni del vomito.\n\nCaratteristiche principali:\n\n    •  È un fenomeno passivo.\n\n    •    Il materiale risale spontaneamente in bocca.\n\n    •  Non è preceduto da nausea.\n\n    •  Non richiede lo sforzo muscolare tipico del vomito.\n\nVa distinto da:\n\n    •  Vomito → espulsione attiva del contenuto gastrico, preceduta da nausea e conati.\n\n    •  Ruminazione → rigurgito ripetuto e volontario/involontario del cibo seguito da\n       rimasticazione.\n\nCause frequenti:\n\n    •   Malattia da reflusso gastroesofageo\n\n    •  Acalasia e altri disturbi della motilità esofagea.\n\n    •  Ernia iatale."},{"id":"official-42-191-2","section":"Raccolta 2","number":191,"page":42,"text":"Marcatore tumorale del tumore al colon-retto: CEA (Antigene Carcino-\nEmbrionario)"},{"id":"official-42-192-3","section":"Raccolta 2","number":192,"page":42,"text":"Febbre remittente in che patologia: è una febbre che presenta oscillazioni\ngiornaliere superiori a 1 °C, ma non ritorna mai ai valori normali durante la giornata.\n\nÈ tipica soprattutto di:\n\n    •  Endocardite infettiva\n\n    •   Brucellosi (può anche presentare altri pattern febbrili)"},{"id":"official-43-193-0","section":"Raccolta 2","number":193,"page":43,"text":"Febbre continua e soffi valvolari di che patologia sono   - endocardite"},{"id":"official-43-194-1","section":"Raccolta 2","number":194,"page":43,"text":"Diarrea sono quanti grammi di feci al giorno?  200g a die"},{"id":"official-43-195-2","section":"Raccolta 2","number":195,"page":43,"text":"Emorragia digestiva più frequente nell’anziano over 60? Ulcera peptica (data da\nFANS)"},{"id":"official-43-196-3","section":"Raccolta 2","number":196,"page":43,"text":"Dove arriva il fegato nell’epatomegalia di quarto grado: regione pelvica/fossa\niliaca destra\nI grado → appena sotto arcata costale\n\nII grado → 2–4 cm sotto\n\nIII grado → fino a livello ombelicale\n\nIV grado → sotto ombelico, fino a ipogastrio/pelvi"},{"id":"official-43-197-4","section":"Raccolta 2","number":197,"page":43,"text":"Tosse può favorire la presenza di ernie inguinali e incontinenza urinaria: sì per\nentrambe"},{"id":"official-43-198-5","section":"Raccolta 2","number":198,"page":43,"text":"Addome batraciano: indica un addome globoso, disteso e “appiattito ai lati”, che\nricorda la forma di una rana (da cui il nome).\n\nCaratteristiche\n\n    •  Distensione addominale centrale\n\n    •  Appiattimento delle pareti laterali\n\n    •  Cute tesa ma non necessariamente dolente"},{"id":"official-44-199-0","section":"Raccolta 2","number":199,"page":44,"text":"Rete neurali riassalgono al: anni 40-50"},{"id":"official-44-200-1","section":"Raccolta 2","number":200,"page":44,"text":"Cos’è il ballismo: è un disturbo del movimento ipercinetico caratterizzato da:\n\n    •  movimenti ampi, violenti e “lanciati”\n\n    •   soprattutto di un arto prossimale (braccio o gamba)\n\n    •  movimenti rapidi, irregolari e non ritmici\n\n    •  spesso simile a “buttare via” il segmento corporeo\n\nCause principali\n\n    •  Lesione del nucleo subtalamico di Luys (tipica)\n\n    •  Spesso Ictus cerebrale\n\n    •  Più raramente tumori, traumi o infezioni"},{"id":"official-44-201-2","section":"Raccolta 2","number":201,"page":44,"text":"Saturnismo: È un quadro clinico dovuto all’accumulo di piombo (Pb) nell’organismo\nPuò essere acuto o più spesso cronico.\nCause tipiche\n\n    •  esposizione professionale (industrie, batterie, saldature)\n\n    •   vernici o materiali contaminati (soprattutto in passato)\n\n    •  acqua o tubature contaminate\n\nEffetti principali\n\n    •  Sistema nervoso: irritabilità, neuropatie periferiche, deficit cognitivi\n\n    •  Sangue: anemia (interferenza con sintesi dell’eme)\n\n    •  Apparato digerente: coliche addominali (colica saturnina)\n\n    •  Reni: danno renale cronico\n\nSegni classici"},{"id":"official-45-202-0","section":"Raccolta 2","number":202,"page":45,"text":"Stereotipia: è un movimento o comportamento ripetitivo e ritmico, identico nel\ntempo, non finalizzato, può coinvolgere movimenti del corpo o vocalizzazioni."},{"id":"official-45-203-1","section":"Raccolta 2","number":203,"page":45,"text":"Ptosi palpebrale dovuta a:\nNeurologiche\n\n    •  Miastenia gravis → ptosi fluttuante, peggiora con sforzo\n\n    •   Paralisi del nervo oculomotore → ptosi con diplopia e “occhio deviato”\n\n    •  Sindrome di Horner → ptosi lieve + miosi + anidrosi   (interruzione vie nervose\n      simaptiche)"},{"id":"official-45-203-5","section":"Raccolta 2","number":203,"page":45,"text":"Anisosfigmia: è la differenza di ampiezza del polso tra i due lati del corpo\n(soprattutto tra arteria radiale destra e sinistra)."},{"id":"official-46-204-0","section":"Raccolta 2","number":204,"page":46,"text":"Cosa causa la sclerosi sistemica:"},{"id":"official-46-205-5","section":"Raccolta 2","number":205,"page":46,"text":"Timoma: è un tumore del timo, una neoplasia che origina dalle cellule epiteliali del\ntimo (mediastino anteriore). Spesso associato alla Miastenia Gravis, e malattie\nautoimmuni. Spesso asintomatico, sintomi in caso di compressione mediastinica\nimportante."},{"id":"official-46-206-6","section":"Raccolta 2","number":206,"page":46,"text":"TSH Reflex cos’è: è un metodo di laboratorio “a step” per lo studio della\nfunzione tiroidea.\n\nCome funziona"},{"id":"official-47-207-0","section":"Raccolta 2","number":207,"page":47,"text":"Febbre FUO: (Fever of Unknown Origin) è la febbre di origine sconosciuta.\n\nDefinizione classica (criteri di Petersdorf e Beeson)\n\n    •  Temperatura > 38,3 °C\n\n    •  Durata > 3 settimane\n\n    •  Diagnosi non chiarita dopo almeno 1 settimana di accertamenti ospedalieri o\n      ambulatoriali\n\nCause principali (3 grandi gruppi)"},{"id":"official-47-208-4","section":"Raccolta 2","number":208,"page":47,"text":"Segno di sanguinamento del tratto distale: rettorragia o ematochezia"},{"id":"official-47-209-5","section":"Raccolta 2","number":209,"page":47,"text":"Dolore esacerbato da ingestione di cibi molto grassi: è tipico di problemi della\ncolecisti o delle vie biliari, perché i grassi stimolano il rilascio di colecistochinina e quindi\nla contrazione della colecisti. (colica biliare, colecistite, litiasi biliare)"},{"id":"official-47-210-6","section":"Raccolta 2","number":210,"page":47,"text":"Dolore a fascia a livello epigastrico: pancreatite acuta"},{"id":"official-48-211-0","section":"Raccolta 2","number":211,"page":48,"text":"Liquido pericardico:\nFunzione\n\n    •  Serve a ridurre l’attrito durante i movimenti cardiaci\n\n    •  Permette lo scorrimento del cuore senza frizioni\n\nQuantità normale\n\n    •   circa 15–50 mL (sieroso, trasparente)\n\nQuando aumenta\n\nL’aumento patologico è detto:\n\n    •  Versamento pericardico\n\nSe il liquido è molto e comprime il cuore:\n\n    •  può evolvere in tamponamento cardiaco (emergenza)\n\nCaratteristiche del liquido patologico\n\nPuò essere:\n\n    •  sieroso (infiammazione lieve)\n\n    •  emorragico (neoplasie, trauma)\n\n    •  purulento (infezioni)\n\n    •   chiloso (raro)"},{"id":"official-48-212-1","section":"Raccolta 2","number":212,"page":48,"text":"Per cosa viene usato il DNA libero nel siero: Il DNA libero nel siero (cfDNA,\ncirculating free DNA) è DNA frammentato che circola nel sangue e deriva da cellule\napoptotiche o tumorali."},{"id":"official-49-213-1","section":"Raccolta 2","number":213,"page":49,"text":"Alterazione della durata del ciclo mestruale:\nAlterazioni del ritmo (frequenza)\n\n    •  Polimenorrea → ciclo troppo corto\n\n    •  Oligomenorrea → ciclo troppo lungo\n\n    •  Amenorrea → assenza di mestruazioni"},{"id":"official-49-214-4","section":"Raccolta 2","number":214,"page":49,"text":"Marcatore di sepsi: Pro-calcitonina"},{"id":"official-49-215-5","section":"Raccolta 2","number":215,"page":49,"text":"81%A1 6%A2 3%HBf che talassemia è?  Beta-talassemia minor"},{"id":"official-50-216-0","section":"Raccolta 2","number":216,"page":50,"text":"Valori in caso di coma chetoacidosico:\nGlicemia\n\n    •  > 250 mg/dL (spesso 300–600 o più)\n\npH ematico\n\n    •  < 7,30 (spesso 7,0–7,2 nei casi gravi)\n\nBicarbonati (HCO₃⁻)\n\n    •  < 18 mEq/L (spesso < 10–15)\n\nChetoni\n\n    •  ↑ chetonemia e chetonuria marcate\n\n    •  presenza di beta-idrossibutirrato elevato\n\nAnion gap\n\n    •  ↑ aumentato (acidosi metabolica ad alto gap)\n\nPotassio (K⁺)\n\n    •  spesso normale o alto inizialmente, ma:\n\n         o   in realtà il K totale è ridotto (per perdita urinaria)\n\nAltri segni\n\n    •   disidratazione\n\n    •  osmolarità aumentata\n\n    •   possibile leucocitosi da stress"},{"id":"official-50-217-1","section":"Raccolta 2","number":217,"page":50,"text":"Sindrome di Horner: miosi, anidrosi, restringimento rima palpebrale"},{"id":"official-50-218-2","section":"Raccolta 2","number":218,"page":50,"text":"Edema polmonare trasudatizio da cosa è dato? Scompenso cardiaco sinistro"},{"id":"official-50-219-3","section":"Raccolta 2","number":219,"page":50,"text":"Respiro di biot: atti respiratori irregolari per frequenza e profondità, alternanza di\napnee improvvise e gruppi di respiri, senza una periodicità stabile\n\nCause principali\n\n    •   lesioni del centro respiratorio bulbare\n\n    •  Meningite\n\n    •  aumento della pressione intracranica"},{"id":"official-51-220-0","section":"Raccolta 2","number":220,"page":51,"text":"Trattamento varici: iniezione sclerosante, resezione chirurgica"},{"id":"official-51-221-1","section":"Raccolta 2","number":221,"page":51,"text":"Sanguinamento gastrico cosa chiedere:\nTipo di sanguinamento\n\n    •  Vomito con sangue?\n\n    •  Ematemesi\n\n    •  Vomito “scuro tipo fondo di caffè”?\n\n    •  Presenza di Melena\n\nQuantità e gravità\n\n    •  Quanto sangue?\n\n    •  episodi ripetuti?\n\n    •  segni di shock: capogiri, lipotimia, tachicardia, sincope\n\nSintomi associati\n\n    •  dolore epigastrico?\n\n    •  nausea/vomito?\n\n    •  calo ponderale?\n\n    •   disfagia?\n\nFattori di rischio: uso di FANS o ASA, anticoagulanti (warfarin, DOAC), alcol, storia di\nulcera o gastrite"},{"id":"official-52-222-0","section":"Raccolta 2","number":222,"page":52,"text":"Valutazione della motilità laringea: La valutazione della motilità laringea si\nesegue osservando il movimento delle corde vocali.\n\nEsame di riferimento\n\n    •  Laringoscopia (indiretta con specchietto oppure, più comunemente,\n       fibrolaringoscopia nasale flessibile)\n\nCosa si valuta\n\n    •  abduzione delle corde vocali durante l'inspirazione\n\n    •  adduzione durante la fonazione\n\n    •  simmetria dei movimenti\n\n    •  eventuale paralisi o paresi di una o entrambe le corde vocali\n\nQuando è utile\n\n    •  disfonia/raucedine\n\n    •  sospetta paralisi del nervo laringeo ricorrente\n\n    •   lesioni laringee\n\n    •  valutazione pre- e post-operatoria della tiroide"},{"id":"official-52-223-1","section":"Raccolta 2","number":223,"page":52,"text":"Silicosi: è una pneumoconiosi causata dall'inalazione cronica di silice cristallina\n(biossido di silicio).\n\nEsposizione professionale in: miniere, cave, sabbiatura, edilizia , lavorazione di pietre e\nceramiche\n\nPatogenesi\n\nLe particelle di silice vengono fagocitate dai macrofagi alveolari, provocando:\n\n    •  infiammazione cronica\n\n    •   fibrosi polmonare progressiva\n\n    •  formazione di noduli fibrotici\n\nSintomi: dispnea progressiva, tosse cronica, ridotta funzione respiratoria\n\nComplicanze\n\n    •  aumentato rischio di Tubercolosi\n\n    •   insufficienza respiratoria\n\n    •  ipertensione polmonare\n\n    •  maggiore rischio di tumore polmonare"},{"id":"official-53-224-0","section":"Raccolta 2","number":224,"page":53,"text":"Calcolo del pack year per le sigarette: (sigarette a die / 20) x anni di fumo"},{"id":"official-53-225-1","section":"Raccolta 2","number":225,"page":53,"text":"Problemi -omics: pipeline dati (qualcosa del genere non sono sicuro)"},{"id":"official-53-226-2","section":"Raccolta 2","number":226,"page":53,"text":"Machine learning in medicina: apprendimento da dati e formulazione previsioni e\nschemi (penso)"},{"id":"official-53-227-3","section":"Raccolta 2","number":227,"page":53,"text":"Reazione tipica dell’iperalgesia cronica : tensione muscolare localizzata"},{"id":"official-53-228-4","section":"Raccolta 2","number":228,"page":53,"text":"Segno di Romberg, cosa valuta? valuta l'integrità della sensibilità propriocettiva\ne delle vie posteriori del midollo spinale.\nCome si esegue"},{"id":"official-53-229-8","section":"Raccolta 2","number":229,"page":53,"text":"Segno dello psoas: positivo indica possibile peritonite da appendicite retrocecale"},{"id":"official-53-230-9","section":"Raccolta 2","number":230,"page":53,"text":"diametro campana: 2.5  - 3.5 cm"},{"id":"official-53-231-10","section":"Raccolta 2","number":231,"page":53,"text":"fare diagnosi di diabete insipido?\nSospetto clinico: poliuria (>3 L/die nell’adulto), polidipsia, urine molto diluite\n\nEsami iniziali\n\n    •  Osmolalità urinaria bassa (<300 mOsm/kg, spesso <200)\n\n    •  Osmolalità plasmatica alta (>295 mOsm/kg)\n\n    •  Na⁺ spesso aumentato (se non compensato da acqua)\n\nTest chiave: test di deprivazione idrica: serve a capire se il rene riesce a concentrare le\nurine\nNormalmente: ↑ ADH → urine concentrate. Nel diabete insipido: urine restano diluite"},{"id":"official-53-232-11","section":"Raccolta 2","number":232,"page":53,"text":"borborigmi iperattivi? umori intestinali aumentati in frequenza e intensità, udibili\nanche senza fonendoscopio. Indicano un aumento della motilità intestinale"},{"id":"official-54-233-0","section":"Raccolta 2","number":233,"page":54,"text":"sintomi tipici carcinoma colon sx: canalizzazione alterata feci-gas, vomito\nfecaloide, stipsi, tenesmo, distensione addominale"},{"id":"official-54-234-1","section":"Raccolta 2","number":234,"page":54,"text":"soffio olosistolico aumentato in inspirazione insufficienza tricuspidale"},{"id":"official-54-235-2","section":"Raccolta 2","number":235,"page":54,"text":"rischio tumore mammella: sesso femminile, età avanzata, ereditarietà\n(BRCA1/BRACA2), menarca precoce, menopausa tardiva, nulliparità, obesità, alcol,\nsedentarietà"},{"id":"official-54-236-3","section":"Raccolta 2","number":236,"page":54,"text":"quando si ha voce belante (egofonia): ( enfisema edema pneumotorace asma\nbronchiale )\nSi osserva quando la trasmissione del suono è aumentata attraverso un parenchima\npolmonare condensato ma ancora aerato parzialmente.\nÈ tipica di condizioni in cui c’è consolidamento o compressione del polmone con\ntrasmissione selettiva dei suoni.\nCaratteristico di Edema polmonare (soprattutto se alveolare con trasudato/iniziale\nconsolidamento)"},{"id":"official-54-237-4","section":"Raccolta 2","number":237,"page":54,"text":"test di Schirmer: (positivo nelle sjorgren)\nè un esame che misura la produzione lacrimale. Siinserisce una striscia di carta\nassorbente nel fornice congiuntivale inferiore. Il paziente tiene gli occhi chiusi per circa 5\nminuti. Si misura quanto si è bagnata la striscia (in mm, se minore di 5mm è positivo)"},{"id":"official-54-238-5","section":"Raccolta 2","number":238,"page":54,"text":"Segno di hommans: indice di trombosi venosa profonda. Si estende il ginocchio del\npaziente, e si dorsiflette il piede, se compare dolore al polpaccio → segno positivo"},{"id":"official-54-239-6","section":"Raccolta 2","number":239,"page":54,"text":"Segno di Cullen: è una ecchimosi periumbelicale (blu-violacea) visibile sulla cute\nattorno all’ombelico. Indica la presenza di sanguinamento retroperitoneale o\nintraperitoneale con diffusione del sangue fino al tessuto sottocutaneo periombelicale."},{"id":"official-54-240-7","section":"Raccolta 2","number":240,"page":54,"text":"Mutazione di BRAF V600E è frequente nel carcinoma papillare della tiroide"},{"id":"official-54-241-8","section":"Raccolta 2","number":241,"page":54,"text":"Rumore a velcro nell'auscultazione: in corso di fibrosi polmonare"},{"id":"official-54-242-9","section":"Raccolta 2","number":242,"page":54,"text":"Fibrillazione atriale: assenza delle P e intervalli RR irregolari, con onde F"},{"id":"official-54-243-10","section":"Raccolta 2","number":243,"page":54,"text":"pollachiuria: aumento minzionale"},{"id":"official-54-244-11","section":"Raccolta 2","number":244,"page":54,"text":"addome a tavola: peritonite"},{"id":"official-54-245-12","section":"Raccolta 2","number":245,"page":54,"text":"quale é l'esame più adatto per confermare un carcinoma del colon dx?"},{"id":"official-55-246-0","section":"Raccolta 2","number":246,"page":55,"text":"polmone incarcerato: è una condizione in cui il polmone non riesce a riespandersi\nnormalmente dopo il drenaggio di un versamento pleurico. È un polmone “intrappolato”\nda una pleura ispessita e fibrotica, che impedisce la sua completa espansione."},{"id":"official-55-247-1","section":"Raccolta 2","number":247,"page":55,"text":"quale patologia può dare vomito occlusivo? aderenze post-chirurgiche (causa più\nfrequente), ernie incarcerate, tumori, volvolo, carcinoma del colon (soprattutto sinistro),\nvolvolo del sigma, fecalomi"},{"id":"official-55-248-2","section":"Raccolta 2","number":248,"page":55,"text":"vomito biliare (definizione): è un vomito in cui è presente bile, quindi ha colore\ngiallo-verde e sapore amaro. Quindi proviene dal duodeno."},{"id":"official-55-249-3","section":"Raccolta 2","number":249,"page":55,"text":"cause di timoma: Origina da alterazioni genetiche somatiche (non ereditarie nella\nmaggior parte dei casi), ma è associato a disfunzioni immunitarie, ma soprattutto a\nmiastenia gravis e aplasia eritroide"},{"id":"official-55-250-4","section":"Raccolta 2","number":250,"page":55,"text":"cause meno frequenti di emorragia del tratto digerente superiore: lesioni\nvascolari, esofagite, gastrite cronica, ulcere da stress."},{"id":"official-55-251-5","section":"Raccolta 2","number":251,"page":55,"text":"da cosa é causata l'angina stabile? (Sforzo, stress, freddo): è causata da una\nriduzione fissa e prevedibile del flusso coronarico, quasi sempre dovuta a\naterosclerosi coronarica."},{"id":"official-55-252-6","section":"Raccolta 2","number":252,"page":55,"text":"polso bisferiens: è un tipo di polso arterioso caratterizzato da due picchi\nsistolici palpabili in una singola sistole. È dato da due onde di pressione sistolica, un\nprimo picco rapido e uno secondario tardivo, si percepisce meglio sulla carotide. Causato\nda valvulopatia aortica combinata (insufficienza aortica + stenosi aortica), o da\ncardiomiopatia ipertrofica ostruttiva."},{"id":"official-55-253-7","section":"Raccolta 2","number":253,"page":55,"text":"pericardiocentesi: è una procedura medica che consiste nel prelievo (o drenaggio)\ndi liquido dal sacco pericardico mediante ago. Tratta o previene anche il tamponamento\ncardiaco in urgenza."},{"id":"official-55-254-8","section":"Raccolta 2","number":254,"page":55,"text":"Perché l'ia non viene usata nella clinica? Motivazioni etiche"},{"id":"official-55-255-9","section":"Raccolta 2","number":255,"page":55,"text":"Itto della punta (cm): 2-3cm"},{"id":"official-55-256-10","section":"Raccolta 2","number":256,"page":55,"text":"auscultazione con edema acuto da scompenso cardiaco congestizio : rantoli a\npiccole bolle alle basi polmonari"},{"id":"official-55-257-11","section":"Raccolta 2","number":257,"page":55,"text":"Aumento 500 volte ferritina (emocromatosi o infiammazione acuta?)"},{"id":"official-56-258-0","section":"Raccolta 2","number":258,"page":56,"text":"Quale trai seguenti valore alterato in acidosi metabolica:\npH ↓ (< 7,35)    HCO₃⁻ ↓ (< 22 mEq/L)     PaCO₂ ↓   anion gap ↑   (tutti giusti)"},{"id":"official-56-259-1","section":"Raccolta 2","number":259,"page":56,"text":"Cosa cercare per diagnosi feocromocitoma: VMA URINE, che cerca le metanefrine\nurinarie nelle 24h"},{"id":"official-56-260-2","section":"Raccolta 2","number":260,"page":56,"text":"PT = serve a misurare la via estrinseca (tempo di protorombina)"},{"id":"official-56-261-3","section":"Raccolta 2","number":261,"page":56,"text":"comportamento dei marker dell'infiammazione (alfa/beta globuline, alfa-antitripsina,\nPCR):\nPCR aumenta rapidamente nelle 6-12 ore, α1-globuline aumentano (principalmente alfa-1-\nantitripsina e α1-glicoproteina), α2-globuline aumentano (aptoglobina e ceruloplasmina),\nalbumina/transferrina/prealbumina diminuiscono."},{"id":"official-56-262-4","section":"Raccolta 2","number":262,"page":56,"text":"valutazione liquido sinoviale: pet/tac, scintigrafia ossea, artrocentesi, biopsia\nliquida"},{"id":"official-56-263-5","section":"Raccolta 2","number":263,"page":56,"text":"segno di ipocalcemia: chvostek (percussione pre-auricolare sul nervo facciale ->\ncontrazione dei muscoli facciali ipsilaterali)"},{"id":"official-56-264-6","section":"Raccolta 2","number":264,"page":56,"text":"big data: dare una maggior numero di dati all'ai"},{"id":"official-56-265-7","section":"Raccolta 2","number":265,"page":56,"text":"atassia cerebellare: allargamento base e instabilità tandem"},{"id":"official-56-266-8","section":"Raccolta 2","number":266,"page":56,"text":"melena: può durare ore dopo la fine dell'emorragia, può durare 3/4 giorni\nSolitamente compare poche ore dopo l’emorragia e può persistere per 2-4 giorni."},{"id xt":"fetur hepaticus: è un segno clinico caratteristico di insufficienza epatica avanzata. È\nun odore dolciastro, pungente, “muffa/frutta marcia” dell’alito, dovuto a sostanze\nvolatili non metabolizzate dal fegato\n\nIl fegato non riesce a metabolizzare composti solforati e aromatici, queste sostanze\nentrano nel circolo sistemico e vengono eliminate con il respiro.\nLe patologie associate: Insufficienza epatica, cirrosi epatica avanzata, shunt porto-\nsistemici"},{"id":"official-63-339-1","section":"Raccolta 2","number":339,"page":63,"text":"Valori compatibili con T1D/T2D:\nValori compatibili con Diabete tipo 1 (T1D)\n\nGlicemia: glicemia a digiuno: ≥126 mg/dL, spesso all’esordio: molto alta (anche >250–\n400 mg/dL)\nChetoni: positivi (chetonemia/chetonuria), rischio di chetoacidosi diabetica\nEmoglobina glicata: elevata (di solito >6.5%)\nInsulina / C-peptide: bassi o assenti\nAutoanticorpi positivi: anti-GAD, IA-2, ZnT8\n\nValori compatibili con Diabete tipo 2 (T2D)\n\nGlicemia: glicemia a digiuno: ≥126 mg/dL\nChetoni: negativi o lievi (raro DKA, più HHNS)\nEmoglobina glicata: aumentata\nInsulina / C-peptide: normale o aumentato (insulino-resistenza), nelle fasi tardive può\ndiminuire\nAutoanticorpi: negativi"},{"id":"official-63-340-2","section":"Raccolta 2","number":340,"page":63,"text":"Ipercapnia: è l’aumento della concentrazione di anidride carbonica (CO₂) nel\nsangue arterioso. PaCO₂ > 45 mmHg"},{"id":"official-63-341-3","section":"Raccolta 2","number":341,"page":63,"text":"n piastrine: 150-400K/ µL"},{"id":"official-63-342-4","section":"Raccolta 2","number":342,"page":63,"text":"metodo interventista: agire sul neonato se dà segni vitali"},{"id":"official-63-343-5","section":"Raccolta 2","number":343,"page":63,"text":"teoria del duplice effetto: per arrecare danno ci deve essere un vantaggio maggiore"},{"id":"official-63-344-6","section":"Raccolta 2","number":344,"page":63,"text":"criteri per fecondazione eterologa: entrambi maggiorenni viventi età fertil
