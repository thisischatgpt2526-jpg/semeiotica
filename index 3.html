const app=document.getElementById('app');let path=[],session=null,mode='typing';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s).toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const uniq=a=>[...new Set(a)];const filtered=(p=path)=>data.items.filter(x=>(!p[0]||x.apparato===p[0])&&(!p[1]||x.organo===p[1])&&(!p[2]||x.cartella===p[2]));const countErrors=a=>a.filter(x=>data.errors[x.id]).length;const shuffle=a=>[...a].sort(()=>Math.random()-.5);const btn=(t,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`;
function crumbs(){return `<nav class="crumb"><button onclick="go(0)">Tutti gli apparati</button>${path.map((p,i)=>`<span>›</span><button onclick="go(${i+1})">${esc(p)}</button>`).join('')}</nav>`}
function go(n){session=null;path=path.slice(0,n);render()};function openFolder(name){path.push(name);render()}
function render(){if(session){quiz();return}let html=crumbs();const arr=filtered();const depth=path.length;const label=['apparato','organo / distretto','cartella'][depth];html+=`<section class="card"><div class="row between"><div><h2>${depth===0?'Scegli un apparato':depth===1?'Scegli un organo o distretto':depth===2?'Scegli una cartella':esc(path[2])}</h2><span class="muted">${arr.length} termini · ${countErrors(arr)} da ripassare</span></div>${btn('Quiz misto di tutto','startAll()','primary')}</div></section>`;
if(depth<3){let keys=uniq(arr.map(x=>[x.apparato,x.organo,x.cartella][depth]));html+=`<section class="card"><div class="tiles">${keys.map(k=>{let p=[...path,k],items=filtered(p);return `<button class="tile" onclick="openFolder(${JSON.stringify(k).replace(/"/g,'&quot;')})"><span>📁 ${depth===0?'APPARATO':depth===1?'ORGANO / DISTRETTO':'CARTELLA'}</span><strong>${esc(k)}</strong><span>${items.length} termini · ${countErrors(items)} errori</span></button>`}).join('')}</div>${!keys.length?'<p>Nessuna cartella: aggiungi termini dalla sezione Gestione.</p>':''}</section>`}
if(arr.length){html+=`<section class="card"><h2>Allenati ${depth===0?'su tutti gli apparati':'su questa selezione'}</h2><div class="row">${btn('▶ Inizia quiz','start(false)','primary')}${btn('↻ Solo errori ('+countErrors(arr)+')','start(true)')}${btn('📖 Glossario','toggleGloss()')}</div><p class="muted">Rispondi scrivendo il termine o scegliendo tra quattro alternative. La risposta viene verificata subito.</p><div id="gloss" class="hide">${arr.map(x=>`<div class="term"><b>${esc(x.term)}</b><span>${esc(x.def)}</span><br><small class="muted">${esc(x.apparato)} › ${esc(x.organo)} › ${esc(x.cartella)}</small></div>`).join('')}</div></section>`}

function toggleGloss(){document.getElementById('gloss').classList.toggle('hide')}
function start(only){let arr=filtered().filter(x=>!only||data.errors[x.id]);if(!arr.length){alert('Non ci sono domande da ripassare in questa selezione.');return}session={items:shuffle(arr),index:0,correct:0,answered:false,selection:only?'errori':'normale'};quiz()}

function setMode(m){mode=m;quiz()}

function revealReverse(){if(session.answered)return;let x=session.items[session.index];document.getElementById('result').innerHTML=`<div class="feedback"><strong>Risposta attesa:</strong> ${esc(x.term)}</div><div class="row" style="margin-top:10px">${btn('✓ Ho ricordato i segni','gradeReverse(true)','primary')}${btn('↻ Da ripassare','gradeReverse(false)')}</div>`;document.querySelector('#answer button').disabled=true;document.getElementById('guess').disabled=true}
function gradeReverse(ok){document.getElementById('result').innerHTML='';finish(ok)}
function typingCheck(){if(session.answered)return;let x=session.items[session.index],v=document.getElementById('guess').value.trim();if(v&&norm(v)===norm(x.term))finish(true)}
function submitTyping(){if(session.answered)return;let v=document.getElementById('guess').value.trim();if(!v)return;finish(norm(v)===norm(session.items[session.index].term))}
function answer(id){if(!session.answered)finish(id===session.items[session.index].id)}function reveal(){if(!session.answered)finish(false)}
function finish(ok){let s=session,x=s.items[s.index];s.answered=true;if(ok){s.correct++;delete data.errors[x.id]}else data.errors[x.id]=true;data.attempts[x.id]=(data.attempts[x.id]||0)+1;save();document.getElementById('result').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✓ Corretto!':'✗ Da ripassare.'} <strong>${esc(x.term)}</strong></div>`;document.getElementById('next').innerHTML=btn(s.index===s.items.length-1?'Vedi risultato →':'Prossima domanda →','nextQuestion()','primary');if(x.reverse){document.getElementById('guess').disabled=true;document.querySelectorAll('#answer button').forEach(b=>b.disabled=true)}else if(mode==='typing'){document.getElementById('guess').disabled=true;document.querySelectorAll('#answer button').forEach(b=>b.disabled=true)}else document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===x.term)b.classList.add('right')});}
function nextQuestion(){session.index++;session.answered=false;quiz()}function endQuiz(){session=null;render()}function restartErrors(){session=null;start(true)}
function showAdd(){let el=document.getElementById('add');el.classList.remove('hide');el.innerHTML=`<h3 style="margin-top:18px">Nuovo termine</h3><label>Apparato</label><input class="input" id="a" value="${esc(path[0]||'')}" placeholder="Es. Apparato cardiovascolare"><label>Organo / distretto</label><input class="input" id="o" value="${esc(path[1]||'')}" placeholder="Es. Cuore"><label>Cartella</label><input class="input" id="c" value="${esc(path[2]||'')}" placeholder="Es. Auscultazione"><label>Definizione (domanda)</label><textarea id="d" placeholder="Definizione da riconoscere"></textarea><label>Termine corretto</label><input class="input" id="t" placeholder="Es. Soffio sistolico"><div class="row" style="margin-top:12px">${btn('Salva termine','addTerm()','primary')}</div>`}
function addTerm(){let g=id=>document.getElementById(id).value.trim();if(['a','o','c','d','t'].some(k=>!g(k))){alert('Compila tutti i campi.');return}data.items.push({id:'q'+Date.now()+Math.random().toString(36).slice(2),apparato:g('a'),organo:g('o'),cartella:g('c'),def:g('d'),term:g('t')});save();render();alert('Termine aggiunto!')}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='medquiz-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.items)||!x.items.every(z=>z.id&&z.apparato&&z.organo&&z.cartella&&z.def&&z.term))throw Error();if(confirm('Sostituire archivio e progressi con quelli del backup?')){data={items:x.items,errors:x.errors||{},attempts:x.attempts||{}};save();path=[];render()}}catch{alert('File di backup non valido.')}};r.readAsText(f)}
function resetErrors(){if(confirm('Azzerare tutti gli errori salvati?')){data.errors={};save();render()}}
render();
</script></body></html>
