number":302,"page":66,"text":"Definizioni di papule, pomfi e compagnia visto che non le sto trovando: papule ->\nlesioni rilevate, circolari, solide, persistenti pomfi -> lesioni rilevate, circolari, solide, fugaci"},{"id":"official-66-303-13","section":"Raccolta 2","number":303,"page":66,"text":"Indici colestasi epatica : gamma glutamil trasnferasi e la fosfatasi alcalina (ALP)"},{"id":"official-67-1-7","section":"Raccolta 3","number":1,"page":67,"text":"La presenza di cianosi, dispnea, prolungamento della fase espiratoria, sibili diffusi su\ntutto l'ambito è espressione di:\nO crisi asmatica acuta\n\nO embolia polmonare\n\nO polmonite\n\nO pneumotorace"},{"id":"official-67-2-8","section":"Raccolta 3","number":2,"page":67,"text":"I rantoli polmonari a piccole bolle sono espressione di:\n\nO crisi asmatica\n\nO essudato nelle vie respiratorie distali\n\nO pleurite essudativa\n\nO atelettasia polmonare"},{"id":"official-67-3-9","section":"Raccolta 3","number":3,"page":67,"text":"La presenza di livelli idro-aerei ad una radiografia diretta dell'addome indica:\n\nO un reperto normale\n\nO una enterite acuta\n\nO una occlusione intestinale meccanica\n\nO un addome espanso per meteorismo intestinale"},{"id":"official-68-4-0","section":"Raccolta 3","number":4,"page":68,"text":"La densità degli eritrociti nel sangue è di:\n\nO 4.5-5.5 x10^3/microL\n\nO 4.5-5.5x10^3/ml\n\nO 4.5-5-5 x10^6/microL\n\nO 4.5-5.5 x10^6/ml"},{"id":"official-68-5-1","section":"Raccolta 3","number":5,"page":68,"text":"Quale dei seguenti parametri è indicativo di pancreatite acuta, se aumentato\nnel siero:\nO Lipasi\n\nO Acetiltrasferasi\n\nO Arginino-alanina transferasi\n\nO VLDL"},{"id":"official-68-6-2","section":"Raccolta 3","number":6,"page":68,"text":"La proteina che veicola il ferro nel sangue è:\n\nO ferritina\n\nO emosiderina\n\nO transferrina\n\nO ceruloplasmina"},{"id":"official-68-7-3","section":"Raccolta 3","number":7,"page":68,"text":"Quale dei seguenti risultati è compatibile con una diagnosi di epatopatia ostruttiva:\n\nO Fosfatasi Alcalina e Amilasi elevate nel siero\n\nO LDH-1 e CPK-2 elevate nel siero\n\nO Iperbilirubinemia indiretta\n\nO y-GT, Fosfatasi Alcalina e bilirubina diretta aumentate nel siero"},{"id":"official-68-8-4","section":"Raccolta 3","number":8,"page":68,"text":"L'elettroforesi dell'emoglobina di un adulto evidenzia 30% di HbH; si tratta di\nun caso di:\nO ß-talassemia\n\nO a-talassemia\n\nO anemia falciforme\n\nO anemia sideropenica"},{"id":"official-69-9-0","section":"Raccolta 3","number":9,"page":69,"text":"Aumento di BUN e creatinina nel sangue, oliguria e presenza di cilindri ematici nelle urine\nsono compatibili con:\n\nO epatite acuta\n\nO glomerulonefrite acuta\n\nO acidosi metabolica\n\nO sindrome nefrosica"},{"id":"official-69-10-1","section":"Raccolta 3","number":10,"page":69,"text":"La renina:\n\nO è prodotta dagli osmocettori ipotalamici\n\nO è secreta da cellule iuxtaglomerulari in risposta a una diminuzione della pressione\nsanguigna\n\nO è substrato dell'angiotensina\n\nO aumenta nel siero nel feocromocitoma"},{"id":"official-69-11-2","section":"Raccolta 3","number":11,"page":69,"text":"I trigliceridi sono presenti nel siero:\n\nO a una concentrazione <50 mg/dI\n\nO legati all'albumina\n\nO sotto forma di VLDL\n\nO solo dopo i pasti"},{"id":"official-69-12-3","section":"Raccolta 3","number":12,"page":69,"text":"Una cefalea ingravescente con deficit di forza a un arto inferiore, edema della papilla\nretinica e vomito non preceduto da nausea è indicativa di:\n\nO Emicrania\n\nO ipertensione endocranica da massa cerebrale espansiva\n\nO Ipertensione arteriosa\n\nO Cefalea muscolo-tensiva"},{"id":"official-69-13-4","section":"Raccolta 3","number":13,"page":69,"text":"Per oligomenorrea si intende:\n\nO l'assenza di flusso mestruale\n\nO la riduzione del flusso mestruale"},{"id":"official-70-14-0","section":"Raccolta 3","number":14,"page":70,"text":"Il vomito gastrico è caratterizzato da:\n\nO emissione di bile e gusto amaro\n\nO emissione di sangue proveniente dallo stomaco\n\nO emissione di alimenti col vomito\n\nO emissione di succo gastrico con sapore acido"},{"id":"official-70-15-1","section":"Raccolta 3","number":15,"page":70,"text":"Un dolore retrosternale oppressivo, irradiato al braccio sinistro, della durata di circa 5\nminuti, comparso dopo sforzo fisico, è indicativo di:\n\nO Angina instabile\n\nO Angina stabile\n\nO infarto miocardico acuto\n\nO Dolore somatico di parete toracica"},{"id":"official-70-16-2","section":"Raccolta 3","number":16,"page":70,"text":"Cosa differenzia la sincope dal coma:\n\nO la modalità d' insorgenza\n\nO la causa\n\nO la durata\n\nO nessuna delle precedenti"},{"id":"official-70-17-3","section":"Raccolta 3","number":17,"page":70,"text":"Per cianosi si intende:\n\nO un colorito rossastro della cute\n\nO una manifestazione dell'anemia grave\n\nO una conseguenza dell'ipoventilazione\n\nO una alterazione di cute e mucose causata da aumento della concentrazione di Hb ridotta"},{"id":"official-70-18-4","section":"Raccolta 3","number":18,"page":70,"text":"Il segno della fovea è presente nel:\n\nO mixedema\n\nO linfedema da stasi linfatica"},{"id":"official-71-19-0","section":"Raccolta 3","number":19,"page":71,"text":"Il focolaio elettivo di auscultazione della valvola polmonare è situato nel:\n\nO Il spazio intercostale sinistro sulla marginosternale\n\nO Il spazio intercostale destro sulla marginosternale\n\nO III spazio intercostale sinistro sulla linea emiclaveare\n\nO IV spazio intercostale sinistro sulla marginosternale"},{"id":"official-71-20-1","section":"Raccolta 3","number":20,"page":71,"text":"Nella coartazione aortica, la pressione arteriosa è:\n\nO Aumentata alle braccia ed alle gambe\n\nO Diminuita alle braccia ed alle gambe\n\nO Aumentata alle gambe\n\nO Aumentata alle braccia e diminuita alle gambe, con ritardo dei polsi femorali"},{"id":"official-71-21-2","section":"Raccolta 3","number":21,"page":71,"text":"La presenza di cianosi, dispnea, prolungamento della fase espiratoria, sibili diffusi su\ntutto l'ambito è espressione di:\nO crisi asmatica acuta\n\nO embolia polmonare\n\nO polmonite\n\nO pneumotorace"},{"id":"official-71-22-3","section":"Raccolta 3","number":22,"page":71,"text":"I rantoli polmonari a piccole bolle sono espressione di:\n\nO crisi asmatica\n\nO essudato nelle vie respiratorie distali\n\nO pleurite essudativa\n\nO atelettasia polmonare"},{"id":"official-71-23-4","section":"Raccolta 3","number":23,"page":71,"text":"La presenza di livelli idro-aerei ad una radiografia diretta dell'addome indica:\n\nO un reperto normale\n\nO una enterite acuta"},{"id":"official-72-24-0","section":"Raccolta 3","number":24,"page":72,"text":"Il limite dell'assunzione di alcool giornaliera nell'uomo è di:\n\nO 3 grammi\n\nO 30 grammi\n\n0 3000 grammi\n\nO 6000 grammi"},{"id":"official-72-25-1","section":"Raccolta 3","number":25,"page":72,"text":"Per disfagia paradossa si intende:\n\nO La deglutizione dolorosa del bolo alimentare\n\nO La generica difficoltà negli atti di deglutizione di cibi liquidi\n\nO una alterazione della deglutizione per i liquidi ma non per\ni solidi\nO L'assunzione eccessiva di cibi molto nutrienti"},{"id":"official-72-26-2","section":"Raccolta 3","number":26,"page":72,"text":"Per polidipsia si intende:\n\nO un aumento dell'assunzione di liquidi\n\nO una diminuzione del senso di sazietà\n\nO una contrazione della diuresi\n\nO una diminuzione della sensazione di sete"},{"id":"official-72-27-3","section":"Raccolta 3","number":27,"page":72,"text":"Il sanguinamento causato da lesione del sigma-retto è caratterizzato da emissione di:\n\nO emissione di sangue \"piceo\" con feci diarroiche\n\nO emissione di sangue nerastro con feci formate\n\nO emissione di sangue che riveste il cilindro fecale\n\nO tutte le condizioni precedenti"},{"id":"official-72-28-4","section":"Raccolta 3","number":28,"page":72,"text":"La temperatura corporea nella febbre intermittente è caratterizzata da:\n\nO variazioni della curva termica con normalizzazione dei valori durante le 24 ore\n\nO variazioni >1°C persistentemente al di sopra dei valori normali"},{"id":"official-73-29-0","section":"Raccolta 3","number":29,"page":73,"text":"Per dispnea di classe IV - NYHA si intende una dispnea che insorge:\n\nO a completo riposo\n\nO per sforzi lievi\n\nO per sforzi molto intensi\n\nO durante le ore notturne"},{"id":"official-73-30-1","section":"Raccolta 3","number":30,"page":73,"text":"La componente principale del I tono cardiaco S1 è costituita da:\n\nO apertura della valvola mitralica\n\nO chiusura della valvola mitralica\n\nO contrazione isovolumetrica ventricolare\n\nO chiusura della valvola polmonare"},{"id":"official-73-31-2","section":"Raccolta 3","number":31,"page":73,"text":"Un soffio sistolico in crescendo-decrescendo irradiato alle carotidi è indicativo di:\n\nO stenosi mitralica\n\nO insufficienza mitralica\n\nO pervietà del dotto di Botallo\n\nO stenosi valvolare aortica"},{"id":"official-73-32-3","section":"Raccolta 3","number":32,"page":73,"text":"Per polso trigemino si intende:\n\nO l'alternanza di una extrasistole e due battiti sinusali\n\nO la successione di tre extrasistoli e due battiti sinusali\n\nO una aritmia scatenata da stimolazione del nervo trigemino\n\nO l'aritmia da blocco A-V di Il grado"},{"id":"official-73-33-4","section":"Raccolta 3","number":33,"page":73,"text":"Per anuria si intende:\n\nO una diuresi inferiore a 800 ml/24 h\n\nO una ritenzione di urine con formazione di globo vescicale"},{"id":"official-74-34-0","section":"Raccolta 3","number":34,"page":74,"text":"Per scialorrea si intende:\n\nO un aumento della lacrimazione\n\nO un aumento della secrezione bronchiale\n\nO un aumento della secrezione salivare\n\nO un aumento della secrezione gastrica"},{"id":"official-74-35-1","section":"Raccolta 3","number":35,"page":74,"text":"L'emicrania è un dolore cefalalgico caratterizzato da:\n\nO uguale prevalenza in entrambi i sessi\n\nO rigidità nucale con postura \"a cane di fucile\"\n\nO frequente associazione con nausea e vomito\n\nO tutte le condizioni precedenti"},{"id":"official-74-36-2","section":"Raccolta 3","number":36,"page":74,"text":"La rottura di varici esofagee nella cirrosi epatica provoca:\n\nO Demoftoe\n\nO ematemesi e melena\n\nO ematochezia\n\nO enterorragia"},{"id":"official-74-37-3","section":"Raccolta 3","number":37,"page":74,"text":"nel paziente con shock da grave disidratazione la pressione venosa\ncentrale è:\nO aumentata\n\nO diminuita\n\nO invariata\n\nO bifasica"},{"id":"official-74-38-4","section":"Raccolta 3","number":38,"page":74,"text":"il respiro di Cheyne-Stokes è caratterizzato da:\n\nO arresto respiratorio irreversibile\n\nO progressivo aumento e successiva diminuzione dell'ampiezza degli atti respiratori"},{"id":"official-75-39-0","section":"Raccolta 3","number":39,"page":75,"text":"La componente principale del Il tono cardiaco S2 è costituita da:\n\nO chiusura della valvola mitrale\n\nO apertura delle valvole atrioventricolari\n\nO apertura delle valvole semilunari\n\nO chiusura delle valvole semilunari"},{"id":"official-75-40-1","section":"Raccolta 3","number":40,"page":75,"text":"Il soffio di Austin-Flint è presente nella:\n\nO stenosi aortica\n\nO insufficienza aortica\n\nO stenosi mitralica\n\nO insufficienza mitralica"},{"id":"official-75-41-2","section":"Raccolta 3","number":41,"page":75,"text":"Un polso caratterizzato da aritmia totale e disuguaglianza delle ampiezze è\nindicativo di:\nO aritmia extrasitolica ventricolare\n\nO fibrillazione ventricolare\n\nO aritmia extrasitolica atriale con bigeminismo\n\nO fibrillazione atriale"},{"id":"official-75-42-3","section":"Raccolta 3","number":42,"page":75,"text":"La presenza di ipoespansibilità dell'emitorace, abolizione del FVT, ottusità alla\npercussione, scomparsa del murmure vescicolare al campo medio dell’emitorace dx è\nindicativo di:\n\nO Polmonite lobare destra\n\nO Versamento pleurico trasudatizio destro\n\nO Tumore del bronco con atelettasia lobare\n\nO Enfisema polmonare lobare"},{"id":"official-75-43-4","section":"Raccolta 3","number":43,"page":75,"text":"Per rantolo si intende:\n\nO un rumore legato alla presenza di trasudato o essudato nelle vie respiratorie"},{"id":"official-76-44-0","section":"Raccolta 3","number":44,"page":76,"text":"La percussione per la delimitazione del versamento ascitico nel paziente\nsupino è:\nO centripeta e raggiata\n\nO effettuata per quadranti\n\nO effettuata iniziando dall'ipocondrio destro\n\nO centrifuga e raggiata"},{"id":"official-76-45-1","section":"Raccolta 3","number":45,"page":76,"text":"Quale dei seguenti composti si può ricercare nelle urine per la diagnosi di\nfeocromocitoma:\nO acido vanilmandelico (VMA)\n\nO PSA\n\nO 17-OH corticoidi\n\nO renina"},{"id":"official-76-46-2","section":"Raccolta 3","number":46,"page":76,"text":"Il test di tolleranza al glucosio (OGTT):\n\nO è normale se la glicemia non aumenta dopo carico\n\nO è normale se la glicemia torna <140 mg/dl entro 2 ore\n\nO richiede una alimentazione priva di glucidi per 3 giorni prima\ndel test O è l'unico criterio di diagnosi del diabete"},{"id":"official-76-47-3","section":"Raccolta 3","number":47,"page":76,"text":"La ApoA1:\n\nO è la principale Apo delle HDL\n\nO attiva la LPL tessutale\n\nO è una proteina della fase acuta dell'infiammazione\n\nO migra nelle y-globuline"},{"id":"official-76-48-4","section":"Raccolta 3","number":48,"page":76,"text":"Quale delle seguenti condizioni è causa di ipertensione arteriosa:\n\nO iperaldosteronismo\n\nO adenoma ipofisario producente GH"},{"id":"official-77-49-0","section":"Raccolta 3","number":49,"page":77,"text":"Quale dei seguenti parametri è il biomarcatore più precoce e specifico di infarto del\nmiocardio:\nO LDH\n\nO TroponinaI\n\nO CPK-2\n\nO Mioglobina"},{"id":"official-77-50-1","section":"Raccolta 3","number":50,"page":77,"text":"I seguenti valori all'esame emocromocitometrico (GR 5.900.000; Hb 16.2; MCV 78; ":"Un aumento della BUN:\n\nO può verificarsi nell'insufficienza cardiaca congestizia\n\nO si verifica nella gotta\n\nO è un precoce e sensibile indicatore di danno glomerulare\n\nO significa che la BUN è 21 mg/dI"},{"id":"official-79-60-1","section":"Raccolta 3","number":60,"page":79,"text":"I seguenti parametri sono indicativi di anemia sideropenica, tranne:\n\nO diminuzione ferritina\n\nO diminuzione transferrina\n\nO diminuzione sideremia\n\nO diminuzione % saturazione transferrina"},{"id":"official-79-61-2","section":"Raccolta 3","number":61,"page":79,"text":"l’elettroforesi dell'emoglobina di un adulto evidenzia 86% di HbA1, 8% HbA2 e 4% HbF; si\ntratta di un caso di:\n\nO ß-talassemia major\n\nO a-talassemia\n\nO anemia falciforme\n\nO B-talassemia minor"},{"id":"official-79-62-3","section":"Raccolta 3","number":62,"page":79,"text":"Quale di queste concentrazioni di elettroliti del siero è alterata:\n\nO Na+ 135 mEg/L\n\nO K+ 5.5 mEg/L\n\nO HCO3- 8 mEg/L\n\nO Ca2+ 2.2 mEg/L"},{"id":"official-79-63-4","section":"Raccolta 3","number":63,"page":79,"text":"Nel sangue arterioso, pO2 e. % di saturazione Hb sono, rispettivamente:"},{"id":"official-80-64-0","section":"Raccolta 3","number":64,"page":80,"text":"Il mixedema è abitualmente:\n\nO non improntabile con segno della fovea assente\n\nO improntabile con segno della fovea presente\n\nO tipico dell’ipertiroidismo\nO dovuto alla diminuzione della pressione oncotica plasmatica"},{"id":"official-80-65-1","section":"Raccolta 3","number":65,"page":80,"text":"la nicturia è:\n\nO la disuria notturna\n\nO la mancata emissione di urine durante la notte\n\nO la minzione frequente durante la notte\n\nO la diuresi nottorna più abbondante di quella diurna"},{"id":"official-80-66-2","section":"Raccolta 3","number":66,"page":80,"text":"Il dolore viscerale\n\nO e ben localizzato\n\nO è sempre scatenato dall'attività fisica\n\nO presenta una localizzazione non ben delimitabile, diffusa\n\nO nessuna delle condizioni precedenti"},{"id":"official-80-67-3","section":"Raccolta 3","number":67,"page":80,"text":"i sibili sono rumori respiratori generati da\n\nO broncodilatazione\n\nO trasudato alveolare\n\nO broncostenosi\n\nO enfisema polmonare"},{"id":"official-80-68-4","section":"Raccolta 3","number":68,"page":80,"text":"Per dispnea parossistica notturna si intende:\n\nO una dispnea da insufficienza cardiaca che insorge durante Il sonno"},{"id":"official-81-69-0","section":"Raccolta 3","number":69,"page":81,"text":"Il riscontro di diminuzione del FVT, Ipofonesi, diminuzione del murmure vescicolare o\nsoffio bronchiale dolce indica:\n\nO enfisema polmonare\n\nO versamento pleurico\n\nO polmonite\n\nO pneumotorace"},{"id":"official-81-70-1","section":"Raccolta 3","number":70,"page":81,"text":"Lo sfregamento pleurico é un rumore respiratorio:\n\nO prevalente in espirazione\n\nO generato dalla presenza di un versamento pleurico essudatizio\n\nO prevalente in inspirazione e talora nella prima fase espiratoria\n\nO un rumore umido generato da flogosi della pleura"},{"id":"official-81-71-2","section":"Raccolta 3","number":71,"page":81,"text":"S1 o tono sistolico è\n\nO sincrono con la sistole ventricolare e il polso arterioso\n\nO generato dalla chiusura della valvola aortica\n\nO più intenso sul focolaio di auscultazione aortico e polmonare\n\nO più breve di S2"},{"id":"official-81-72-3","section":"Raccolta 3","number":72,"page":81,"text":"il soffio cardiaco definito come \"rullio diastolico\" è tipico della:\n\nO stenosi aortica\n\nO stenosi polmonare\n\nO stenosi mitralica\n\nO disfunzione dei muscoli papillari cardiaci"},{"id":"official-81-73-4","section":"Raccolta 3","number":73,"page":81,"text":"Nei circoli collaterali addominali tipo cava-cava nella cirrosi epatica, il flusso\nematico è diretto: O dall'alto verso il basso"},{"id":"official-82-74-0","section":"Raccolta 3","number":74,"page":82,"text":"Nelle urine del paziente con ittero da ostruzione del coledoco si trova:\n\nO bilirubina indiretta\n\nO bilirubina diretta\n\nO urobilinogeno\n\nO tutti I precedenti"},{"id":"official-82-75-1","section":"Raccolta 3","number":75,"page":82,"text":"Quale dei seguenti parametri è indicativo di pancreatite acuta, se aumentato\nnel siero:\n\nO Amilasi\n\nO Acetiltrasferasi\n\nO Arginino-alanina transferasi\n\nO VLDL"},{"id":"official-82-76-2","section":"Raccolta 3","number":76,"page":82,"text":"Il marcatore biochimico più sensibile e specifico per infarto miocardio acuto è:\n\nO latticodeidrogenasi-LDH totale\n\nO latticodeidrogenasi- LDH isoenzima miocardico\n\nO creatinfosfochinasi-CPK totale\n\nO troponina I"},{"id":"official-82-77-3","section":"Raccolta 3","number":77,"page":82,"text":"Nel diabete insipido la diuresi è caratterizzata da:\n\nO Oliguria iperosmolale\n\nO Poliuria iperosmolale\n\nO Poliuria ipo-osmolale\n\nO Nessuna delle condizioni precedenti"},{"id":"official-82-78-4","section":"Raccolta 3","number":78,"page":82,"text":"I trigliceridi sono presenti nel siero:\n\nO ad una concentrazione <50 mg/dI"},{"id":"official-83-79-0","section":"Raccolta 3","number":79,"page":83,"text":"L'emoglobina glicosilata:\n\nO è normalmente >12% dell'Hb totale\n\nO è dosata nello screening diagnostico di nefropatia diabetica\n\nO aumenta nel sangue nella sindrome nefrosica\n\nO è dosata per il monitoraggio a lungo termine della terapia nel diabete"},{"id":"official-83-80-1","section":"Raccolta 3","number":80,"page":83,"text":"Quali del seguenti meccanismi possono compensare un'acidosi metabolica:\n\nO aumento escrezione tubulare K*\n\nO iperventilazione\n\nO diminuzione riassorbimento tubulare di HCO3-\n\nO nessuno del precedenti"},{"id":"official-83-81-2","section":"Raccolta 3","number":81,"page":83,"text":"Il tempo di protrombina (PT):\n\nO può aumentare nelle epatopatie croniche\n\nO si valuta nel controllo della terapia anticoagulante\n\nO misura la via estrinseca\n\nO tutte le precedenti"},{"id":"official-83-82-3","section":"Raccolta 3","number":82,"page":83,"text":"Il BNP (Brain Natriuretic Peptide):\n\nO è un indicatore di funzionalità tubulare renale\n\nO è un marcatore di scompenso cardiaco congestizio\n\nO è un enzima della cascata coagulativa\n\nO nessuna delle precedenti"},{"id":"official-83-83-4","section":"Raccolta 3","number":83,"page":83,"text":"La gonadotropina corionica ß-hCG:\n\nO è un marcatore dei tumori del trofoblasto e della linea germinativa di ovaio e testicolo\n\nO può aumentare anche in tumori di mammella, melanoma, polmone"},{"id":"official-84-84-0","section":"Raccolta 3","number":84,"page":84,"text":"La macrosomia fetale con peso alla nascita superiore a 4 kg è indicativa di:\n\nO obesità materna\n\nO resistenza insulinica con iperinsulinismo nella madre\n\nO dislipidemia familiare\n\nO tutte le condizioni precedenti"},{"id":"official-84-85-1","section":"Raccolta 3","number":85,"page":84,"text":"Le lesioni del primo motoneurone sono caratterizzate da:\n\nO paresi con ipertono muscolare\n\nO paresi con ipotonia e ipotrofia muscolare\n\nO tetraparesi\n\nO normoreflessia tendinea"},{"id":"official-84-86-2","section":"Raccolta 3","number":86,"page":84,"text":"Per oligodipsia si intende:\n\nO una diminuzione della conta degli spermatozoi\n\nO una diminuzione del senso di sazietà\n\nO una contrazione della diuresi\n\nO una diminuzione della sensazione di sete"},{"id":"official-84-87-3","section":"Raccolta 3","number":87,"page":84,"text":"Per melena si intende:\n\nO emissione di sangue dal rinofaringe\n\nO emissione di sangue digerito con le feci\n\nO emissione di sangue dall'intestino tenue distale\n\nO emissione di sangue rutilante con feci formate"},{"id":"official-84-88-4","section":"Raccolta 3","number":88,"page":84,"text":"Il segno di Trousseau con spasmo tetanico della mano è una tipica manifestazione di:\n\nO Ipercalcemia\n\nO ipocalcemia severa"},{"id":"official-85-89-0","section":"Raccolta 3","number":89,"page":85,"text":"Per dispnea di classe III - NYHA si intende una dispnea che insorge:\n\nO a completo riposo\n\nO per sforzi lievi\n\nO per sforzi molto intensi\n\nO durante le ore notturne"},{"id":"official-85-90-1","section":"Raccolta 3","number":90,"page":85,"text":"Il quarto tono S4 compare in:\n\nO protosistole\n\nO telesistole\n\nO protodiastole\n\nO telediastole"},{"id":"official-85-91-2","section":"Raccolta 3","number":91,"page":85,"text":"Uno sdoppiamento del Il tono S2 può essere provocato da:\n\nO stenosi mitralica\n\nO stenosi aortica\n\nO embolia polmonare\n\nO blocco di branca sinistra"},{"id":"official-85-92-3","section":"Raccolta 3","number":92,"page":85,"text":"Per polso bigemino si intende:\n\nO l'alternanza di una extrasistole e due battiti sinusali\n\nO la successione di tre extrasistoli e due battiti sinusali\n\nO una aritmia scatenata da stimolazione del nervo trigemino\n\nO l'alternanza di una extrasistole e un battito sinusale"},{"id":"official-85-93-4","section":"Raccolta 3","number":93,"page":85,"text":"La presenza di livelli idro-aerei ad una radiografia diretta dell'addome indica:\n\nO un reperto normale\n\nO una enterite acuta"},{"id":"official-86-94-0","section":"Raccolta 3","number":94,"page":86,"text":"Il compenso dell’ acidosi respiratoria consiste in:\nO aumento escrezione renale H+ e riassorbimento di\nHCO3-\n\nO diminuzione ventilazione\n\nO stimolazione dell'anidrasi carbonica eritrocitaria\n\nO nessuna delle precedenti"},{"id":"official-86-95-1","section":"Raccolta 3","number":95,"page":86,"text":"Tutti i seguenti risultati sono compatibili con una diagnosi di glomerulonefrite\nacuta, eccetto:\n\nO aumento BUN e creatinina\n\nO presenza di cilindri ialini, granulosi ed ematici nel sedimento urinario\n\nO ipoalbuminemia\n\nO oliguria"},{"id":"official-86-96-2","section":"Raccolta 3","number":96,"page":86,"text":"L'elettroforesi dell'emoglobina di un adulto evidenzia 86% di HbA1, 8% HbA2 e 4% HbF; si\ntratta di un caso di:\n\nO B-talassemia major\n\nO a-talassemia\n\nO anemia falciforme\n\nO B-talassemia minor"},{"id":"official-86-97-3","section":"Raccolta 3","number":97,"page":86,"text":"Una ipoglicemia persistente può verificarsi in quale delle seguenti\ncondizioni: O diabete insipido\n\nO sindrome di Cushing\n\nO glicogenosi tipo |\n\nO ipertiroidismo"},{"id":"official-86-98-4","section":"Raccolta 3","number":98,"page":86,"text":"Un aumento della creatinina nel siero:\n\nO si verifica nelle nefropatie con diminuzione di GFR"},{"id":"official-87-99-0","section":"Raccolta 3","number":99,"page":87,"text":"Nel profilo elettroforetico, nelle a1-globuline migrano:\n\nO albumina\n\nO HDL\n\nO IgG\n\nO tutte le proteine con PM<20 kDa"},{"id":"official-87-100-1","section":"Raccolta 3","number":100,"page":87,"text":"Il parametro che fornisce informazioni sulla distribuzione della dimensione\neritrocitaria è:\n\nO MCV\n\nO RDW\n\nO MCHC\n\nO MCH"},{"id":"official-87-101-2","section":"Raccolta 3","number":101,"page":87,"text":"L'emoglobina alla nascita è:\n\nO 100% HbF\n\nO 70% HbF e 30% HbA1\n\nO 50% Gower 1 e 50% Gower 2\n\nO 30% HbA2 e 70% HbF"},{"id":"official-87-102-3","section":"Raccolta 3","number":102,"page":87,"text":"una sepsi da infezione suppurativa è in genere caratterizzata da\n\nO Febbre intermittente\n\nO Leucocitosi\n\nO Granulocitosi neutrofila\n\nO Tutte le precedenti"},{"id":"official-87-103-4","section":"Raccolta 3","number":103,"page":87,"text":"Cosa differenzia la sincope dal coma:\n\nO la modalità d' insorgenza"},{"id":"official-88-104-0","section":"Raccolta 3","number":104,"page":88,"text":"Il respiro di Biot, caratterizzato da periodi di apnea intervallati a normali atti respiratori, è\nespressione di:\n\nO embolia polmonare\n\nO grave sofferenza dei centri respiratori\n\nO acidosi metabolica\n\nO tutte le condizioni precedenti"},{"id":"official-88-105-1","section":"Raccolta 3","number":105,"page":88,"text":"Quali dei seguenti caratteri sono peculiari di una \"colica\"?\n\nO La comparsa \"ad accessi\"\n\nO L'acutezza della sua intensità\n\nO La periodica intermittenza\n\nO Tutti i caratteri precedenti"},{"id":"official-88-106-2","section":"Raccolta 3","number":106,"page":88,"text":"L’eritema a farfalla del volto è tipica manifestazione di\nO malattia metabolica\n\nO m. di Cushing\n\nO lupus eritematoso sistemico\n\nO sepsi"},{"id":"official-88-107-3","section":"Raccolta 3","number":107,"page":88,"text":"un vomito alimentare comparso dopo oltre 12 ore dall’assunzione di cibo è\nindicativo di\n\nO tumore della giunzione esofago-gastrica\n\nO gastrite acuta\n\nO ostruzione meccanica a livello del piloto e del duodeno\n\nO patologia bilio-pancreatica"},{"id":"official-89-108-0","section":"Raccolta 3","number":108,"page":89,"text":"Nel diabete insipido la diuresi è caratterizzata da:\n\nO Oligura iperosmolare\n\nO poliuria perosmolare\n\nO poliuria ipo-osmolare\n\n0 Nessuna delle condizioni precedient"},{"id":"official-89-109-1","section":"Raccolta 3","number":109,"page":89,"text":"Per cianosi si intende:\n\nO un colorito rossastro della cute\n\nO una manifestasione dell’anemia grave\n\nO una conseguenza dell’ipoventilazione\nO una alterazione di cute e mucose causata da aumento della concentrazione di Hb ridotta"},{"id":"official-89-110-2","section":"Raccolta 3","number":110,"page":89,"text":"Per anasarca si intende:\n\nO un edema generalizzato con versamento nelle cavità sierose\n\nO un edema improntabile e non risolvibile\n\nO edema nelle parti declivi\n\nO un edema non improntabile"},{"id":"official-89-111-3","section":"Raccolta 3","number":111,"page":89,"text":"La componente principale del I tono cardiaco S1 è costituita da:\n\nO apertura della valvola mitralica\n\nO chiusura della valvola mitralica\n\nO contrazione isovolumetrica ventricolare\n\nO chiusura della valvola polmonare"},{"id":"official-89-112-4","section":"Raccolta 3","number":112,"page":89,"text":"Lo schiocco di apertura della mitrale in protodiastole è generato da:\n\nO blocco di branca sinistro\n\nO insufficienza mitralica\n\nO apertura di valvola mitrale sclerocalcifica\n\nO scleroectasia aortica"},{"id":"official-90-113-0","section":"Raccolta 3","number":113,"page":90,"text":"Una cefalea con rigidità nucale, febbre, segno di Kernig positivo e decubito \"a cane di\nfucile\", sono indicativi di:\n\nO emorragia cerebrale\n\nO ascesso cerebrale\n\nO meningite acuta\n\nO tumore cerebrale"},{"id":"official-90-114-1","section":"Raccolta 3","number":114,"page":90,"text":"Lo scompenso cardiaco ventricolare destro è caratterizzato da:\n\nO turgore delle vene glugulari\n\nO versamento pleurico destro\n\nO fegato da stasi con reflusso epatogiugulare\n\nO tutte le manifestazioni cliniche precedenti"},{"id":"official-90-115-2","section":"Raccolta 3","number":115,"page":90,"text":"S1 o tono sistolico è sdoppiato:\n\nO nello scompenso cardiaco\n\nO nell'ipertensione polmonare\n\nO nel blocco di branca destro\n\nO nel blocco atrio-ventricolare"},{"id":"official-90-116-3","section":"Raccolta 3","number":116,"page":90,"text":"L'angolo di Louis corrisponde a:\n\nO spina iliaca superiore e legamento inguinale\n\nO inserzione della II costa Sullo sterno\n\nO area pancreatico-duodenale\n\nO iperfonesi toracica da proiezione del fondo gastrico e arcata costale"},{"id":"official-90-117-4","section":"Raccolta 3","number":117,"page":90,"text":"La regione addominale compresa tra la linea bisiliaca, la prosecuzione addominale della\nlinea emiclaveare e il legamento inguinale si chiama:\n\nO ipocondrio\n\nO ipogastrio\n\nO perineo"},{"id":"official-91-118-0","section":"Raccolta 3","number":118,"page":91,"text":"quale dei seguenti parametri è compatibile con una diagnosi di ipertiroidismo primario:\n\nO abbassamento TSH e aumento FT4 pres. autoanticorpi anti-R-TSH\n\nO aumento TSH e abbassamento FT4\n\nO minore captazione tiroidea di tc\n\nO aumento TSH e aumento FT4"},{"id":"official-91-119-1","section":"Raccolta 3","number":119,"page":91,"text":"L'analisi dei gas nel sangue:\n\nO si esegue solo su sangue venoso\n\nO richiede sangue arterioso prelevato sotto vuoto da <15 min\n\nO è la percentuale di saturazione dell'Hb\n\nO evidenzia ipercapnia se la pCO2 è 35 mmHg"},{"id":"official-91-120-2","section":"Raccolta 3","number":120,"page":91,"text":"La riduzione della diuresi sotto i 150 ml/24 ore viene definita:\n\nO poliuria\n\nO oliguria\n\nO nicturia\n\nO anuria"},{"id":"official-91-121-3","section":"Raccolta 3","number":121,"page":91,"text":"Il riscontro di una acinesia della parete ventricolare all'esame ecocardiografico è\nespressione di O blocco di branca sinistra\n\nO cardiopatia dilatativa\n\nO infarto miocardio acuto\n\nO stenosi mitralica"},{"id":"official-91-122-4","section":"Raccolta 3","number":122,"page":91,"text":"L'abuso cronico di alcool può provocare:\n\nO steatosi epatica\n\nO atrofia cerebrale\n\nO pancreatite acuta e cronica\n\nO tutte le condizioni precedenti"},{"id":"official-92-123-0","section":"Raccolta 3","number":123,"page":92,"text":"Un dolore di tipo colico comparso in regione lombare può corrispondere a\n\nO lleo meccanico\n\nO Appendicite acuta\n\nO Colica renale\n\nO Colica addominale"},{"id":"official-92-124-1","section":"Raccolta 3","number":124,"page":92,"text":"Il vomito alimentare è caratterizzato da:\n\nO emissione di alimenti col vomito\n\nO vomito indotto dall'assunzione di cibo\n\nO vomito associato a disfagia per i cibi solidi\n\nO vomito indotto da malassorbimento del cibo"},{"id":"official-92-125-2","section":"Raccolta 3","number":125,"page":92,"text":"Per borborigmo si intende:\n\nO un rumore respiratorio aspro da essudato bronchiale\n\nO un rumore generato dalla peristalsi intestinale\n\nO un rumore tipico dell'ileo paralitico\n\nO uno sfregamento generato da una flogosi splenica"},{"id":"official-92-126-3","section":"Raccolta 3","number":126,"page":92,"text":"In quale dei seguenti casi di ittero aumenta principalmente la bilirubina indiretta\n\nO ostruzione biliare\n\nO deficit di conlugazione epatica\n\nO deficit di captazione epatica\n\nO ittero neonatale"},{"id":"official-92-127-4","section":"Raccolta 3","number":127,"page":92,"text":"Il tempo di protrombina (PT):\n\nO può aumentare nelle epatopatie croniche\n\nO si valuta nel controllo della terapia anticoa.lla\n\nO misura la via estrinseca\n\nO tutte le precedenti"},{"id":"official-93-128-0","section":"Raccolta 3","number":128,"page":93,"text":"Il BNP (Brain Natriuretic Peptide):\n\nO è un indicatore di funzionalità tubulare rengle\n\nO è un marcatore di scompenso cardiaco congestizio\n\nO è un enzima della cascata coagulativa\n\nO nessuna delle precedenti"},{"id":"official-93-129-1","section":"Raccolta 3","number":129,"page":93,"text":"Il riscontro di aumento del FVT, Ipofonesi, soffio bronchiale indici\n\nO polmonite alveolare\n\nO bronchite acuta\n\nO pleurite trasudativa\n\nO enfisema polmonare"},{"id":"official-93-130-2","section":"Raccolta 3","number":130,"page":93,"text":"I ronchi e I sibili sono caratteristici di:\n\nO crisi asmatica acuta\n\nO polmonite interstiziale\n\nO fase inspiratoria della respirazione\n\nO pleurite essudativa"},{"id":"official-93-131-3","section":"Raccolta 3","number":131,"page":93,"text":"La zona di \"Chauffard-Rivet\" si riferisce a:\n\nO L'area di proiezione cutanea del Triangolo di Calot\n\nO L'area triangolare di dolorabilità coledocico - pancreatiça\n\nO L'area di dolorabilità piloro - duodenale\n\nO L'area di prolezione cutanea del bacinetto renale destro"},{"id":"official-93-132-4","section":"Raccolta 3","number":132,"page":93,"text":"La B-hCG:\n\nO è un marcatore dei tumori del trofoblasto e della linea germinátiva di ovaio e testicolo\n\nO può aumentare anche in tumori di mammella, melanoma, polmone\n\nO aumenta in gravidanza\n\nO tutte le precedenti"},{"id":"official-94-133-0","section":"Raccolta 3","number":133,"page":94,"text":"I prodotti di degradazione del fibrinogeno (XDP e D-Dimero):\n\nO sono normalmente presenti nel siero\n\nO Inducono un aumento del PT\n\nO aumentano nella Coagulazione intravascolare Disseminata\n\nO aumentano nel deficit di vitamina K"},{"id":"official-94-134-1","section":"Raccolta 3","number":134,"page":94,"text":"I reticolociti:\n\nO sono normalmente ›4%\nO aumentano nelle emorragie acute e croniche\n\nO aumentano nell'anemia sideropenica\n\nO aumentano nelle infezioni"},{"id":"official-94-135-2","section":"Raccolta 3","number":135,"page":94,"text":"Quale variazione dei seguenti parametri è presente in corso di acidosi metabolica:\n\nO diminuisce pCO2, aumenta anion gap\n\nO aumenta pCO2, diminuisce anion gap\n\nO aumenta pCO2, <-> anion gap\n\nO diminuisce pCO2, diminuisce anion gap"},{"id":"official-94-136-3","section":"Raccolta 3","number":136,"page":94,"text":"Quale dei seguenti risultati è indicativo di ipotiroidismo primario:\n\nO presenza anticorpi anti-recettore TSH\n\nO aumento TSH e diminuzione di FT4\n\nO diminuzione di TSH e FT4\n\nO aumento di TSH e FT4"},{"id":"official-94-137-4","section":"Raccolta 3","number":137,"page":94,"text":"Quale dei seguenti parametri non è compatibile con una diagnosi di\niperaldosteronismo?\n\nO Alcalosi metabolica\n\nO aumento della concentrazione sodica nel siero\n\nO diminuzione della concentrazione di potassio nel siero\n\nO ipotensione"},{"id":"official-95-138-0","section":"Raccolta 3","number":138,"page":95,"text":"Quale dei seguenti marcatori di infarto del miocardio ritorna prima al livelli normali:\n\nO CPK-2\n\nO Troponina\n\nO Mioglobina\n\nO LDH-1\n\n\n\n\nRisposte:\n1a 2b 3c 4c 5a 6c 7d 8b 9b 10b 11c 12b 13c 14d 15b 16c 17d 18d 19a 20d 21a 22b 23c 24b\n25c 26a 27c 28a 29a 30b 31d 32a 33c 34c 35c 36b 37b 38b 39d 40b 41d 42b 43a 44a 45a 46b\n47a 48a 49b 50d 51c 52c 53b 54c 55c 56b 57c 58b 59a 60b 61d 62c 63a 64a 65c 66c 67c 68a\n69b 70c 71a 72c 73a 74b 75a 76d 77c 78c 79d 80b 81d 82b 83d 84b 85a 86d 87b 88b 89b 90d\n91c 92d 93c 94a 95c 96d 97c 98a 99b 100b 101b 102d 103c 104b 105d 106c 107c 108c 109d\n110a 111b 112c 113c 114d 115c 116b 117d 118a 119b 120d 121c 122d 123c 124a 125b 126b\n127d 128b 129a 130a 131b 132d 133c 134b 135a 136b 137d 138c\n\nIn teoria sono tutte corrette, ma qualche domanda (9,22, 42,49, 53, 69,129) è molto ambigua\ne io ho messo quello più corretta."},{"id":"official-96-1-0","section":"Test con soluzioni","number":1,"page":96,"text":"Il riscontro di abolizione del FVT, ipofonesi, assenza di murmure vescicolare indica:\n    (a) polmonite\n    (b) pneumotorace\n    (c) atelettasia da ostruzione bronchiale\n    (d) enfisema polmonare","answer":"C"},{"id":"official-96-2-1","section":"Test con soluzioni","number":2,"page":96,"text":"L’edema polmonare acuto cardiogeno è caratterizzato da:\n    (a) soffio bronchiale\n    (b) diminuzione del murmure vescicolare\n    (c) rantoli crepitanti alle basi polmonari\n    (d) aumento del fremito vocale tattile","answer":"C"},{"id":"official-96-3-2","section":"Test con soluzioni","number":3,"page":96,"text":"Gli “spider nevi”sono caratteristici di:\n    (a) ipertensione arteriosa\n    (b) ipertiroidismo\n    (c) cirrosi epatica\n    (d) linfedema cronico","answer":"C"},{"id":"official-96-4-3","section":"Test con soluzioni","number":4,"page":96,"text":"VLDL e LDL:\n    (a) migrano con le α-globuline\n    (b) migrano con le β-globuline\n    (c) contengono entrambe principalmente trigliceridi\n    (d) aumentano nella fase acuta dell’infiammazione","answer":"B"},{"id":"official-96-5-4","section":"Test con soluzioni","number":5,"page":96,"text":"Una ipoglicemia persistente può verificarsi in quale delle seguenti condizioni:\n    (a) diabete insipido\n    (b) sindrome di Cushing\n    (c) glicogenosi tipo I\n    (d) ipertiroidismo","answer":"C"},{"id":"official-96-6-5","section":"Test con soluzioni","number":6,"page":96,"text":"Un aumento dei livelli di calcio nel sangue con calcemia totale di 14.0 mg/dl è indicativo di:\n    (a) insufficienza renale cronica\n    (b) iperparatiroidismo primitivo da adenoma PTH secernente\n    (c) iperparatiroidismo secondario da insufficienza renale\n    (d) ipoparatiroidismo cronico","answer":"B"},{"id":"official-96-7-6","section":"Test con soluzioni","number":7,"page":96,"text":"Un aumento della BUN:\n    (a) può verificarsi nell’insufficienza cardiaca congestizia\n    (b) si verifica nella gotta\n    (c) è un precoce e sensibile indicatore di danno glomerulare\n    (d) significa che la BUN è ≥1 mg/dl","answer":"A"},{"id":"official-96-8-7","section":"Test con soluzioni","number":8,"page":96,"text":"I seguenti parametri dono indicativi di anemia sideropenica, tranne:\n    (a) ↓ ferritina\n    (b) ↓ transferrina\n    (c) ↓ sideremia\n    (d) ↓ % saturazione transferrina","answer":"B"},{"id":"official-96-9-8","section":"Test con soluzioni","number":9,"page":96,"text":"L’elettroforesi dell’emoglobina di un adulto evidenzia 86% HbA1, 8% HbA2 e 4% HbF;\nsi tratta di un caso di:","answer":"D"},{"id":"official-97-10-0","section":"Test con soluzioni","number":10,"page":97,"text":"Quale di queste concentrazioni di elettroliti del siero è alterata:\n    (a) Na+ 135 mEq/L\n    (b) K+ 5.5 mEq/L\n    (c) HCO3- 8 mEq/L\n    (d) Ca2+ 2.2 mEq/L","answer":"C"},{"id":"official-97-11-1","section":"Test con soluzioni","number":11,"page":97,"text":"Nel sangue arterioso, pO2 e % di saturazione Hb sono, rispettivamente:\n    (a) ≥90 mmHg e ≥95\n    (b) ≥60 mmHg e ≥75\n    (c) ≥40 mmHg e ≥55\n    (d) nessuna delle precedenti","answer":"A"},{"id":"official-97-12-2","section":"Test con soluzioni","number":12,"page":97,"text":"L’abuso cronico di alcol può provocare:\n    (a) steatosi epatica\n    (b) atrofia cerebrale\n    (c) pancreatitie acuto e cronica\n    (d) tutte le condizioni precedenti","answer":"D"},{"id":"official-97-13-3","section":"Test con soluzioni","number":13,"page":97,"text":"Un dolore di tipo colico comparso in regione lombare, irradiato verso l’inguine e\nassociato a nausea e vomito è indicativo di:\n    (a) Ileo meccanico\n    (b) Appendicite acuta\n    (c) colica renale\n    (d) colica addominale","answer":"C"},{"id":"official-97-14-4","section":"Test con soluzioni","number":14,"page":97,"text":"Il vomito alimentare è caratterizzato da:\n    (a) emissione di alimenti col vomito\n    (b) vomito indotto dall’assunzione di cibo\n    (c) vomito associato a disfagia per i cibi solidi\n    (d) vomito indotto da malassorbimento del cibo","answer":"A"},{"id":"official-97-15-5","section":"Test con soluzioni","number":15,"page":97,"text":"La riduzione della diuresi sotto i 150 ml/24 ore viene definita:\n    (a) poliuria\n    (b) oliguria\n    (c) nicturia\n    (d) anuria","answer":"D"},{"id":"official-97-16-6","section":"Test con soluzioni","number":16,"page":97,"text":"La dispnea è un’alterazione respiratoria caratterizzata da:\n    (a) aumento della frequenza respiratoria\n    (b) diminuzione dell’ampiezza degli atti respiratoria\n    (c) condizione soggettiva di difficoltà respiratoria con percezione dell’attività respiratoria\n    (d) aumento della costrizione respiratoria","answer":"C"},{"id":"official-97-17-7","section":"Test con soluzioni","number":17,"page":97,"text":"Le lesioni del primo motoneurone sono caratterizzate da:\n    (a) paresi con ipertono muscolare\n    (b) paresi con ipotonia e ipotrofia muscolare\n    (c) tetraparesi","answer":"A"},{"id":"official-98-18-0","section":"Test con soluzioni","number":18,"page":98,"text":"Il mixedema è abitualmente:\n    (a) non improntabile con segno della fovea assente\n    (b) improntabile con segno della fovea presente\n    (c) tipico dell’ipertiroidismo\n    (d) dovuto a diminuzione della pressione oncotica plasmatica","answer":"A"},{"id":"official-98-19-1","section":"Test con soluzioni","number":19,"page":98,"text":"Il focolaio elettivo di auscultazione della valvola polmonare è situato nel:\n    (a) II spazio intercostale sinistro sulla marginosternale\n    (b) II spazio intercostale destro sulla marginosternale\n    (c) III spazio intercostale sinistro sulla linea emiclaveare\n    (d) IV spazio intercostale sinistro sulla marginosternale","answer":"A"},{"id":"official-98-20-2","section":"Test con soluzioni","number":20,"page":98,"text":"L’insufficienza ventricolare sinistra “sistolica” è caratterizzata da:\n    (a) alterato rilasciamento ventricolare sinistro\n    (b) diminuzione della frazione di eiezione ventricolare <40%\n    (c) versamento pericardico\n    (d) ipercinesia sistolica del ventricolo sinistro","answer":"B"},{"id":"official-98-21-3","section":"Test con soluzioni","number":21,"page":98,"text":"Il compenso dell’acidosi respiratoria consiste in:\n    (a) aumento della escrezione renale di H+ e riassorbimento di HCO3-\n    (b) diminuita ventilazione\n    (c) stimolazione dell’anidrasi carbonica eritrocitaria\n    (d) nessuna delle precedenti","answer":"A"},{"id":"official-98-22-4","section":"Test con soluzioni","number":22,"page":98,"text":"Il tempo di protrombina (PT):\n    (a) può aumentare nelle epatopatie croniche\n    (b) si valuta nel controllo della terapia anticoagulante\n    (c) misura la via estrinseca\n    (d) tutte le precedenti","answer":"D"},{"id":"official-98-23-5","section":"Test con soluzioni","number":23,"page":98,"text":"Il BNP (Brain Natriuretic Peptide):\n    (a) è un indicatore di funzionalità tubulare renale\n    (b) è un marcatore di scompenso cardiaco congestizio\n    (c) è un enzima della cascata coagulativa\n    (d) nessuna delle precedenti","answer":"B"},{"id":"official-98-24-6","section":"Test con soluzioni","number":24,"page":98,"text":"Il PSA:\n    (a) è un marcatore specifico e sensibile di carcinoma prostatico\n    (b) aumenta normalmente con l’età avanzata\n    (c) è un inibitore di proteasi presente nel siero\n    (d) è un marcatore di carcinoma epatocellulare","answer":"B"},{"id":"official-98-25-7","section":"Test con soluzioni","number":25,"page":98,"text":"In quale di questi casi aumenta principalmente la birilubina diretta?\n    (a) Ostruzione biliare\n    (b) deficit di coniugazione epatica\n    (c) deficit di captazione epatica\n    (d) ittero neonatale","answer":"A"},{"id":"official-98-26-8","section":"Test con soluzioni","number":26,"page":98,"text":"Quale dei seguenti paramentri da informazione sulla funzionalità tubulare renale\n    (a) clearance della creatinina","answer":"B"},{"id":"official-99-27-0","section":"Test con soluzioni","number":27,"page":99,"text":"Per rantolo si intende:\n    (a) un rumore legato alla presenza di trasudato o essudato nelle vie respiratorie\n    (b) un rumore respiratorio generato da broncostenosi\n    (c) un rumore generato da flogosi della pleura\n    (d) un rumore respiratorio da spasmo laringeo","answer":"A"},{"id":"official-99-28-1","section":"Test con soluzioni","number":28,"page":99,"text":"La presenza di torace iperespanso, FVT diminuito, diminuzione del murmure\nvescicolare è indice di:\n    (a) crisi asmatica acuta\n    (b) polmonite interstiziale\n    (c) enfisema polmonare\n    (d) fibrosi polmonare","answer":"C"},{"id":"official-99-29-2","section":"Test con soluzioni","number":29,"page":99,"text":"Per borborigmo si intende:\n    (a) un rumore respiratorio aspro da essudato bronchiale\n    (b) un rumore generato dalla peristalsi intestinale\n    (c) un rumore tipico dell’ileo paralitico\n    (d) uno sfregamento generato da una flogosi splenica","answer":"B"},{"id":"official-99-30-3","section":"Test con soluzioni","number":30,"page":99,"text":"I trigliceridi sono presenti nel siero:\n    (a) ad una concentrazione <50 mg/dl\n    (b) legati all’albumina\n    (c) sotto forma di VLDL\n    (d) solo dopo i pasti","answer":"C"},{"id":"official-99-31-4","section":"Test con soluzioni","number":31,"page":99,"text":"Il riscontro di una acinesia della parete ventricolare all’esame ecocardiografico\nè espressione di:\n    (a) blocco di branca sinistra\n    (b) cardiopatia dilatativa\n    (c) infarto miocardico acuto\n    (d) stenosi mitralica","answer":"C"},{"id":"official-99-32-5","section":"Test con soluzioni","number":32,"page":99,"text":"L’angolo di Louis corrisponde a:\n    (a) spina iliaca superiore e legamento inguinale\n    (b) inserzione della II costa sullo sterno\n    (c) area pancreatico-duodenale\n    (d) iperfonesi toracica da proiezione del fondo gastrico e arcata costale","answer":"B"},{"id":"official-99-33-6","section":"Test con soluzioni","number":33,"page":99,"text":"La regione addominale compresa tra la linea bisiliaca, la prosecuzione addominale\ndella linea emiclaveare e il legamento inguinale si chiama:\n    (a) ipocondrio\n    (b) ipogastro\n    (c) perineo\n    (d) fossa iliaca","answer":"D"},{"id":"official-99-34-7","section":"Test con soluzioni","number":34,"page":99,"text":"quale dei seguenti paramentri è compatibile con una diagnosi di ipertiroidismo primario?\n    (a) ↓ TSH ↑ FT4 pres. Autoanticorpi anti-R-TSH\n    (b) ↑ TSH ↓ FT4","answer":"A"},{"id":"official-100-35-0","section":"Test con soluzioni","number":35,"page":100,"text":"L’analisi dei gas nel sangue:\n    (a) si esegue solo sul sangue venoso\n    (b) richiede sangue arterioso prelevato sotto vuoto da <15min\n    (c) è la percentuale di saturazione dell’Hb\n    (d) evidenzia ipercapnia se la pCO2 è 35 mmHg","answer":"B"},{"id":"official-100-36-1","section":"Test con soluzioni","number":36,"page":100,"text":"Una iper-uricemia si verifica\n    (a) per valori di acido urico >7 mg/dl\n    (b) nell’ipotiroidismo\n    (c) quando aumenta l’azotemia\n    (d) nell’insufficienza epatica","answer":"A"},{"id":"official-100-37-2","section":"Test con soluzioni","number":37,"page":100,"text":"Quale dei seguenti parametri è diagnostico di diabete mellito\n    (a) glicemia 2h dopo OGTT≥ 200 mg/dl\n    (b) glicemia a digiuno 110 mg/dl\n    (c) colesterolo e trigliceridi ≥200 mg/dl\n    (d) poliuria","answer":"A"},{"id":"official-100-38-3","section":"Test con soluzioni","number":38,"page":100,"text":"Un valore di Volume Corpuscolare Medio – MCV di 95 µm3 è:\n    (a) normale\n    (b) suggestivo di anemia microcitica\n    (c) suggestivo di anemia da deficit di B12\n    (d) indicativo di deficit di G6PD","answer":"A"},{"id":"official-100-39-4","section":"Test con soluzioni","number":39,"page":100,"text":"Quale dei seguenti risultati non è congruente con una condizione di emocromatosi:\n    (a) sideremia di 250 µg/dl\n    (b) ↑ % saturazione transferrina\n    (c) ↑ transferrina\n    (d) ↑ferritina","answer":"C"},{"id":"official-100-40-5","section":"Test con soluzioni","number":40,"page":100,"text":"La renina:\n    (a) è prodotta dagli osmocettori ipotalamici\n    (b) è secreta da cellule iuxtaglomerulari in risposta a una diminuzione della pressione sanguigna\n    (c) è substrato dell’angiotensina\n    (d) aumenta nel siero del feocromocitoma","answer":"B"},{"id":"official-100-41-6","section":"Test con soluzioni","number":41,"page":100,"text":"Per disfagia si intende:\n    (a) la deglutizione dolorosa del bolo alimentare\n    (b) la generica difficoltà negli atti di deglutizione di cibi liquidi\n    (c) una alterazione della funzione della deglutizione\n    (d) L’assunzione eccessiva di cibi molto nutrienti","answer":"C"},{"id":"official-100-42-7","section":"Test con soluzioni","number":42,"page":100,"text":"Una sepsi da infezione suppurativa è, in genere, caratterizzata da:\n    (a) febbre intermittente\n    (b) leucocitosi\n    (c) granulocitosi neutrofila\n    (d) tutte le precedenti","answer":"D"},{"id":"official-100-43-8","section":"Test con soluzioni","number":43,"page":100,"text":"Cosa differenzia la sincope dal coma?","answer":"C"},{"id":"official-101-44-0","section":"Test con soluzioni","number":44,"page":101,"text":"Il respiro di Biot, caratterizzato da periodi di apnea intervallati a normali atti\nrespiratori è espressione di:\n    (a) embolia polmonare\n    (b) grave sofferenza dei centri respiratori\n    (c) acidosi metabolica\n    (d) tutte le condizioni precedenti","answer":"B"},{"id":"official-101-45-1","section":"Test con soluzioni","number":45,"page":101,"text":"Quali dei seguenti caratteri sono peculiari di una “colica”?\n    (a) La comparsa “ad accessi”\n    (b) l’acutezza della sua intensità\n    (c) la periodica intermittenza\n    (d) tutti i caratteri precedenti","answer":"D"},{"id":"official-101-46-2","section":"Test con soluzioni","number":46,"page":101,"text":"Una cefalea con rigidità nucale, febbre, segno di Kerning positivo e decubito “a cane\ndi fucile”, sono indicative di:\n    (a) emorragia cerebrale\n    (b) ascesso cerebrale\n    (c) meningite acuta\n    (d) tumore cerebrale","answer":"C"},{"id":"official-101-47-3","section":"Test con soluzioni","number":47,"page":101,"text":"Lo scompenso cardiaco ventricolare destro è caratterizzato da:\n    (a) turgore delle vene giugulari\n    (b) versamento pleurico destro\n    (c) fegato da stasi con reflusso epatogiugulare\n    (d) tutte le manifestazioni cliniche precedenti","answer":null},{"id":"official-101-48-4","section":"Test con soluzioni","number":48,"page":101,"text":"S1 o tono sistolico è sdoppiato:\n    (a) nello scompenso cardiaco\n    (b) nell’ipertensione polmonare\n    (c) nel blocco di branca destro\n    (d) nel blocco atrio-ventricolare","answer":"C"},{"id":"official-101-49-5","section":"Test con soluzioni","number":49,"page":101,"text":"Un dolore toracico ben delimitato, trafittivo, accentuato alla digitopressione, è espressione\ndi:\n    (a) dolore viscerale\n    (b) dolore somatico\n    (c) dolore riferito\n    (d) dolore neuropatico","answer":"B"},{"id":"official-101-50-6","section":"Test con soluzioni","number":50,"page":101,"text":"L’ortopnea è:\n    (a) un miglioramenti della funzione respiratoria con torace eretto\n    (b) una dispnea che scompare quando il paziente è in decubito supino\n    (c) una respirazione del tutto normale\n    (d) una dispnea che compare dopo sforzo","answer":"A"},{"id":"official-101-51-7","section":"Test con soluzioni","number":51,"page":101,"text":"L’eritema “a farfalla” del volto è tipica manifestazione di:\n    (a) malattia metabolica","answer":"C"},{"id":"official-102-52-0","section":"Test con soluzioni","number":52,"page":102,"text":"Un vomito alimentare comparso dopo oltre dodici ore dall’assunzione di cibo è indice di:\n    (a) tumore della giunzione esofago-gastrica\n    (b) gastrite acuta\n    (c) ostruzione meccanica a livello del piloro e del duodeno\n    (d) patologia bilio-pancreatica","answer":"C"},{"id":"official-102-53-1","section":"Test con soluzioni","number":53,"page":102,"text":"Nel diabete insipido la diuresi è caratterizzata da:\n    (a) Oliguria iperosmolale\n    (b) poliuria iperosmolale\n    (c) poliuria ipo-osmolale\n    (d) nessuna delle condizioni precedenti","answer":"C"},{"id":"official-102-54-2","section":"Test con soluzioni","number":54,"page":102,"text":"Per cianosi si intende:\n    (a) un colorito rossastro della cute\n    (b) una manifestazione dell’anemia grave\n    (c) una conseguenza dell’ipoventilazione\n    (d) una alterazione di cute e mucose causata dall’aumento della concentrazione di Hb ridotta","answer":"D"},{"id":"official-102-55-3","section":"Test con soluzioni","number":55,"page":102,"text":"Per anasarca si intende:\n    (a) un edema generalizzato con versamento nelle cavità sierose\n    (b) un edema importante e non risolvibile\n    (c) un edema nelle parti declivi\n    (d) un edema non improntabile","answer":"A"},{"id":"official-102-56-4","section":"Test con soluzioni","number":56,"page":102,"text":"La componente principale del I tono cardiaco S1 è costituita da:\n    (a) apertura della valvola mitralica\n    (b) chiusura della valvola mitralica\n    (c) contrazione isovolumetrica ventricolare\n    (d) chiusura della valvola polmonare","answer":"B"},{"id":"official-102-57-5","section":"Test con soluzioni","number":57,"page":102,"text":"Lo schiocco di apertura della mitrale in protodiastole è generato da:\n    (a) blocco di branca sinistro\n    (b) insufficienza mitralica\n    (c) apertura di valvola mitrale sclerocalcifica\n    (d) scleroectasia aortica","answer":"C"},{"id":"official-102-58-6","section":"Test con soluzioni","number":58,"page":102,"text":"L’emoglobina alla nascita è:\n    (a) 100% HbF\n    (b) 70% HbF e 30% HbA1\n    (c) 50% Gower 1 e 50% Gower 2\n    (d) 30% HbA2 e 70% HbF","answer":"B"},{"id":"official-102-59-7","section":"Test con soluzioni","number":59,"page":102,"text":"Un gradiente della concentrazione di proteine tra versamento pleurico/siero <0.5\nè indicativo di:\n    (a) Trasudato\n    (b) essudato\n    (c) Tumore pleurico\n    (d) versamento emorragico","answer":"A"},{"id":"official-103-60-0","section":"Test con soluzioni","number":60,"page":103,"text":"La presenza di diminuzione del FVT, lieve ipofonesi e rantoli inspiratori e piccole bolle\nai campi medi e inferiori del torace modificati dalla tosse, è indicativa di:\n    (a) pneumotorace bilaterale\n    (b) enfisema polmonare\n    (c) edema polmonare acuto\n    (d) bronchite acuta bilaterale","answer":"D"},{"id":"official-103-61-1","section":"Test con soluzioni","number":61,"page":103,"text":"La presenza di livelli idro-aerei ad una radiografia diretta dell’addome indica:\n    (a) un reperto normale\n    (b) una enterite acuta\n    (c) una occlusione intestinale meccanica\n    (d) un addome espanso per meteorismo intestinale","answer":"C"},{"id":"official-103-62-2","section":"Test con soluzioni","number":62,"page":103,"text":"Tutti i seguenti risultati sono compatibili con una diagnosi di glomerulonefrite acuta,\neccetto:\n    (a) ↑ BUN e creatinina\n    (b) presenza di cilindri ialini, granulosi ed ematici del sedimento urinario\n    (c) ipoalbuminemia\n    (d) oliguria","answer":"C"},{"id":"official-103-63-3","section":"Test con soluzioni","number":63,"page":103,"text":"Il marcatore biochimico più sensibile e specifico per l’infarto miocardico acuto è:\n    (a) latticodeidrogenasi-LDH totale\n    (b) latticodeidrogenasi-LDH isoenzima miocardico\n    (c) creatinfosfochinasi-CPK totale\n    (d) troponina I o T","answer":"D"},{"id":"official-103-64-4","section":"Test con soluzioni","number":64,"page":103,"text":"L’emoglobina glicosilata:\n    (a) è normalmente ≥12% dell’Hb totale\n    (b) è dosata nello screening diagnostico di nefropatia diabetica\n    (c) aumenta nel sangue nella sindrome nefrosica\n    (d) è dosata per il monitoraggio a lungo termine della terapia nel diabete","answer":"D"},{"id":"official-103-65-5","section":"Test con soluzioni","number":65,"page":103,"text":"Quale dei seguenti meccanismi possono compensare un’acidosi metabolica?\n    (a) ↑ escrezione tubulare K+\n    (b) iperventilazione\n    (c) ↓ riassorbimento tubulare di HCO3-\n    (d) nessuno dei precedenti","answer":"B"},{"id":"official-103-66-6","section":"Test con soluzioni","number":66,"page":103,"text":"Un aumento della creatinina nel siero:\n    (a) si verifica nelle nefropatie con ↓GFR\n    (b) si verifica nella gotta\n    (c) è un precoce e sensibile indicatore di danno glomerulare\n    (d) significa che la creatinina è >0.1 mg/dl","answer":"A"},{"id":"official-103-67-7","section":"Test con soluzioni","number":67,"page":103,"text":"Nel profilo elettroforetico, nelle α1-globuline migrano:\n    (a) albumina\n    (b) HDL\n    (c) IgG\n    (d) tutte le proteine con PM<20 kDa","answer":"B"},{"id":"official-103-68-8","section":"Test con soluzioni","number":68,"page":103,"text":"Il parametro che fornisce informazioni sulla distribuzione della dimensione eritrocitaria è:","answer":"B"},{"id":"official-104-69-0","section":"Test con soluzioni","number":69,"page":104,"text":"Il vomito gastrico è caratterizzato da:\n    (a) emissione di bile e gusto amaro\n    (b) emissione di sangue proveniente dallo stomaco\n    (c) emissione di alimenti col vomito\n    (d) emissione di succo gastrico con sapore acido","answer":"D"},{"id":"official-104-70-1","section":"Test con soluzioni","number":70,"page":104,"text":"L’emottisi o emoftoe è caratterizzata da:\n    (a) abitualmente associata a melena\n    (b) emissione di sangue proveniente dal rinofaringe e/o dalle coane nasali\n    (c) emissione di sangue digerito per permanenza dello stomaco\n    (d) emissione di sangue venoso o arterioso proveniente dalle vie respiratorie","answer":"D"},{"id":"official-104-71-2","section":"Test con soluzioni","number":71,"page":104,"text":"Le lesioni del secondo motoneurone sono caratterizzate da:\n    (a) paresi con ipotono muscolare\n    (b) paresi con ipotonia e ipotrofia muscolare\n    (c) proattività del riflesso di Babinski\n    (d) aumento dei riflessi tendinei","answer":"B"},{"id":"official-104-72-3","section":"Test con soluzioni","number":72,"page":104,"text":"L’aumento della circonferenza della vita è espressione di:\n    (a) Aumento del grasso viscerale\n    (b) tipico dell’obesità femminile\n    (c) sempre associato a diabete di tipo 2\n    (d) tutti i casi precedenti","answer":"A"},{"id":"official-104-73-4","section":"Test con soluzioni","number":73,"page":104,"text":"Il focolaio elettivo di auscultazione della valvola mitrale è situato nel:\n    (a) IV spazio intercostale sinistro sulla marginosternale\n    (b) tra III e V spazio intercostale sinistro\n    (c) in corrispondenza dell’itto dell’apice cardiaco\n    (d) IV spazio intercostale sinistro sulla linea emiclaveare","answer":"C"},{"id":"official-104-74-5","section":"Test con soluzioni","number":74,"page":104,"text":"Il turgore delle vene giugulari indica:\n    (a) scompenso del ventricolo sinistro\n    (b) insufficienza cardiaca destra\n    (c) occlusione della vena cava inferiore\n    (d) una condizione anasarcatica","answer":"B"},{"id":"official-104-75-6","section":"Test con soluzioni","number":75,"page":104,"text":"Per oligomenorrea si intende:\n    (a) l’assenza di flusso mestruale\n    (b) la riduzione del flusso mestruale\n    (c) un intervallo tra i cicli superiore a 35 giorni\n    (d) un intervallo tra i cicli inferiore a 20 giorni","answer":"C"},{"id":"official-104-76-7","section":"Test con soluzioni","number":76,"page":104,"text":"Un dolore retrosternale oppressivo, irradiato al braccio sinistro, della durata di circa\n5 minuti, comparso dopo sforzo fisico, è indicativo di:\n    (a) angina instabile\n    (b) angina stabile\n    (c) infarto miocardico acuto","answer":"B"},{"id":"official-105-77-0","section":"Test con soluzioni","number":77,"page":105,"text":"Il segno della fovea è presente nel:\n    (a) mixedema\n    (b) linfedema da stasi linfatica\n    (c) edema da aumento della pressione idrostatica nel vaso\n    (d) tutti i casi precedenti","answer":"C"},{"id":"official-105-78-1","section":"Test con soluzioni","number":78,"page":105,"text":"Il mixedema è abitualmente\n    (a) non improntabile con segno della fovea assente\n    (b) improntabile con segno della fovea presente\n    (c) tipico dell’ipertiroidismo\n    (d) dovuto a diminuzione della pressione oncotica plasmatica","answer":"A"},{"id":"official-105-79-2","section":"Test con soluzioni","number":79,"page":105,"text":"La nicturia è:\n    (a) la disuria notturna\n    (b) la mancata emissione di urine durante la notte\n    (c) la minzione frequente durante la notte\n    (d) la diuresi notturna più abbondante di quella diurna","answer":"D"},{"id":"official-105-80-3","section":"Test con soluzioni","number":80,"page":105,"text":"Il dolore viscerale:\n    (a) è ben localizzato\n    (b) è sempre scatenato dall’attività fisica\n    (c) presenta una localizzazione non ben delimitabile, diffusa\n    (d) nessuna delle condizioni precedenti","answer":"C"},{"id":"official-105-81-4","section":"Test con soluzioni","number":81,"page":105,"text":"I sibili sono rumori respiratori generati da:\n    (a) broncodilatazione\n    (b) trasudato alveolare\n    (c) broncostenosi\n    (d) enfisema polmonare","answer":"C"},{"id":"official-105-82-5","section":"Test con soluzioni","number":82,"page":105,"text":"Per dispnea parossistica notturna si intende:\n    (a) Una dispnea da insufficienza cardiaca che insorge durante il sonno\n    (b) Una dispnea da insufficienza respiratoria che scompare durante il sonno\n    (c) Una dispnea notturna da crisi asmatica\n    (d) Una dispnea che si manifesta al risveglio","answer":"A"},{"id":"official-105-83-6","section":"Test con soluzioni","number":83,"page":105,"text":"Lo sfregamento pleurico è un rumore respiratorio:\n    (a) prevalente in espirazione\n    (b) generato dalla presenza di un versamento pleurico essudatizio\n    (c) prevalente in inspirazione e talora nella prima fase espiratoria\n    (d) un rumore umido generato da flogosi della pleura","answer":"C"},{"id":"official-105-84-7","section":"Test con soluzioni","number":84,"page":105,"text":"S1 o tono sistolico è:\n    (a) sincrono con la sistole ventricolare e il polso arterioso\n    (b) generato dalla chiusura della valvola aortica\n    (c) più intenso sui focolai di auscultazione aortico e polmonare\n    (d) più breve di S2","answer":"A"},{"id":"official-105-85-8","section":"Test con soluzioni","number":85,"page":105,"text":"Il soffio cardiaco definito come “rullo diastolico” è tipico della:\n    (a) stenosi aortica","answer":"C"},{"id":"official-106-86-0","section":"Test con soluzioni","number":86,"page":106,"text":"Quale dei seguenti paramentri è indicativo di pancreatite acuta, se aumentato nel siero:\n    (a) lipasi\n    (b) acetiltransferasi\n    (c) arginino-alanina transferasi\n    (d) VLDL","answer":"A"},{"id":"official-106-87-1","section":"Test con soluzioni","number":87,"page":106,"text":"La (gonadotropina corionica) β-hCG:\n    (a) è un marcatore dei tumori del trofoblasto e della linea germinativa di ovaio e testicolo\n    (b) può aumentare anche in tumori di mammella, melanoma, polmone\n    (c) aumenta in gravidanza\n    (d) tutte le precedenti","answer":"D"},{"id":"official-106-88-2","section":"Test con soluzioni","number":88,"page":106,"text":"Nelle urine del paziente con ittero da ostruzione del coledoco si trova:\n    (a) bilirubina indiretta\n    (b) bilirubina diretta\n    (c) urobilinogeno\n    (d) tutti i precedenti","answer":"B"},{"id":"official-106-89-3","section":"Test con soluzioni","number":89,"page":106,"text":"I rantoli polmonari a piccole bolle sono espressione di:\n    (a) crisi asmatica\n    (b) essudato nelle vie respiratorie distali\n    (c) pleurite essudativa\n    (d) atelettasia polmonare","answer":"B"},{"id":"official-106-90-4","section":"Test con soluzioni","number":90,"page":106,"text":"La densità degli eritrociti nel sangue è di:\n    (a) 4.5-5.5x103/µl\n    (b) 4.5-5.5x103/ml\n    (c) 4.5-5.5x106/µl\n    (d) 4.5-5.5x106/ml","answer":"C"},{"id":"official-106-91-5","section":"Test con soluzioni","number":91,"page":106,"text":"La proteina che vincola il ferro nel sangue è:\n    (a) ferritina\n    (b) emosiderina\n    (c) transferrina\n    (d) ceruloplasmina","answer":"C"},{"id":"official-106-92-6","section":"Test con soluzioni","number":92,"page":106,"text":"Quale dei seguenti risultati è compatibile con una diagnosi di epatopatia ostruttiva?\n    (a) Fosfatasi Alcalina e Amilasi elevate nel siero\n    (b) LDH-1 e CPK-2 elevate nel siero\n    (c) Iperbirilubinimemia indiretta\n    (d) γ-GT, Fosfatasi Alcalina e birilubina diretta aumentata nel siero","answer":"D"},{"id":"official-106-93-7","section":"Test con soluzioni","number":93,"page":106,"text":"L’elettroforesi dell’emoglobina di un adulto evidenzia 30% di HbH; si tratta di un caso di:\n    (a) β-talassemia\n    (b) α-talassemia\n    (c) anemia falciforme\n    (d) anemia sideropenica","answer":"B"},{"id":"official-107-94-0","section":"Test con soluzioni","number":94,"page":107,"text":"Aumento di BUN e creatinina nel sangue, oliguria e presenza di cilindri ematici nelle\nurine sono compatibili con:\n    (a) epatite cronica\n    (b) glomerulonefrite acuta\n    (c) acidosi metabolica\n    (d) sindrome nefrosica","answer":"B"},{"id":"official-107-95-1","section":"Test con soluzioni","number":95,"page":107,"text":"La presenza di cianosi, dispnea, prolungamento della fase espiratoria, sibili diffusi su\ntutto l’ambito è espressione di:\n    (a) crisi asmatica acuta\n    (b) embolia polmonare\n    (c) polmonite\n    (d) pneumotorace","answer":"A"},{"id":"official-107-96-2","section":"Test con soluzioni","number":96,"page":107,"text":"Una cefalea ingravescente con deficit di forza a un arto inferiore, edema della papilla\ne vomito non preceduto da nausea è indicativa di:\n    (a) Emicrania\n    (b) Ipertensione endocranica da massa cerebrale espansiva\n    (c) Ipertensione arteriosa\n    (d) cefalea muscolo-tensiva","answer":"B"},{"id":"official-107-97-3","section":"Test con soluzioni","number":97,"page":107,"text":"Nella coartazione aortica, la pressione arteriosa è:\n    (a) Aumentata alle braccia ed alle gambe\n    (b) diminuita alle braccia e alle gambe\n    (c) aumentata alle gambe\n    (d) aumentata alle braccia e diminuita alle gambe, con ritardo dei polsi femorali","answer":"D"},{"id":"official-107-98-4","section":"Test con soluzioni","number":98,"page":107,"text":"La presenza di ipoespansibilità dell’emitorace, abolizione del FVT, ottusità alla\npercussione, scomparsa del murmure vescicolare al campo medio dell’emitorace destro,\nè indicativa di:\n    (a) Polmonite lobare destra\n    (b) versamento pleurico trasudatizio destro\n    (c) tumore del bronco con atelettasia lobare\n    (d) enfisema polmonare lobare","answer":"C"},{"id":"official-107-99-5","section":"Test con soluzioni","number":99,"page":107,"text":"La percussione per la delimitazione del versamento ascitico nel paziente supino è:\n    (a) centripeta e raggiata\n    (b) effettuata per quadranti\n    (c) effettuata iniziando dall’ipocondrio destro\n    (d) centrifuga e raggiata","answer":"D"},{"id":"official-107-100-6","section":"Test con soluzioni","number":100,"page":107,"text":"Quale dei seguenti seguenti composti si può ricercare nelle urine per la diagnosi\ndi feocromocitoma:\n    (a) acido vanillmandelico (VMA)\n    (b) PSA\n    (c) 17-OH corticoidi\n    (d) renina","answer":"A"},{"id":"official-107-101-7","section":"Test con soluzioni","number":101,"page":107,"text":"Il test di tolleranza al glucosio (OGTT):\n    (a) è normale se la glicemia non aumenta dopo carico\n    (b) è normale se la glicemia torna <140 mg/dl entro 2 ore\n    (c) richiede una alimentazione priva di glucidi per 3 giorni prima del test","answer":"B"},{"id":"official-108-102-0","section":"Test con soluzioni","number":102,"page":108,"text":"La ApoA1:\n    (a) è la principale Apo delle HDL\n    (b) attiva la LPL tessutale\n    (c) è una proteina della fase acuta dell’infiammazione\n    (d) migra nelle γ-globuline","answer":"A"},{"id":"official-108-103-1","section":"Test con soluzioni","number":103,"page":108,"text":"Quale delle seguenti condizioni è causa di ipertensione arteriosa?\n    (a) Iperaldosteronismo\n    (b) adenoma ipofisario producente GH\n    (c) diabete insipido\n    (d) morbo di Addison","answer":"A"},{"id":"official-108-104-2","section":"Test con soluzioni","number":104,"page":108,"text":"Quale di questi parametri è il biomarcatore più precoce e specifico dell’infarto\ndel miocardio?\n    (a) LDH\n    (b) troponina I\n    (c) CPK-2\n    (d) Mioglobina","answer":"B"},{"id":"official-108-105-3","section":"Test con soluzioni","number":105,"page":108,"text":"I seguenti valori all’esame emocromocitometrico ( GR 5.900.000; Hb 16.2; MCV\n78; MCH 30; GB 7.200; Piastrine 394.000) sono:\n    (a) normalità\n    (b) emodiluizione\n    (c) poliglobulia\n    (d) policitemia","answer":"A"},{"id":"official-108-106-4","section":"Test con soluzioni","number":106,"page":108,"text":"Per metrorragia si intende:\n    (a) ciclo mestruale abbondante\n    (b) un’emorragia uterina al di fuori del ciclo mestruale\n    (c) un ciclo mestruale doloroso\n    (d) un dolore uterino crampiforme","answer":"B"},{"id":"official-108-107-5","section":"Test con soluzioni","number":107,"page":108,"text":"La secrezione di ADH è regolata da\n    (a) renina\n    (b) aldosterone\n    (c) osmolarità sangue\n    (d) angiotensina","answer":"C"},{"id":"official-108-108-6","section":"Test con soluzioni","number":108,"page":108,"text":"Un valore di MCV di 110 µm3 è:\n    (a) normale\n    (b) suggestivo di anemia microcitica\n    (c) suggestivo di anemia da deficit di B12\n    (d) indicativo di deficit di G6PD","answer":"C"},{"id":"official-108-109-7","section":"Test con soluzioni","number":109,"page":108,"text":"La macrosomia fetale con peso alla nascita superiore a 4 kg è indicativa di:\n    (a) obesità materna\n    (b) resistenza insulina con iperinsulinismo nella madre\n    (c) tetraparesi\n    (d) normoreflessività tendinea","answer":"B"},{"id":"official-109-110-0","section":"Test con soluzioni","number":110,"page":109,"text":"Per oligodipsia di intende:\n    (a) una diminuzione della conta degli spermatozoi\n    (b) una diminuzione del senso di sazietà\n    (c) una contrazione della diuresi\n    (d) una diminuzione della sensazione di sete","answer":"D"},{"id":"official-109-111-1","section":"Test con soluzioni","number":111,"page":109,"text":"Per melena si intende:\n    (a) emissione di sangue dal rinofaringe\n    (b) emissione di sangue digerito con le feci\n    (c) emissione di sangue dall’intestino tenue distale\n    (d) emissione di sangue rutilante con le feci formate","answer":"B"},{"id":"official-109-112-2","section":"Test con soluzioni","number":112,"page":109,"text":"Il segno di Trousseau con spasmo tetanico della mano è una tipica manifestazione di:\n    (a) ipercalcemia\n    (b) ipocalcemia severa\n    (c) ipopotassemia\n    (d) iperpotassemia","answer":"B"},{"id":"official-109-113-3","section":"Test con soluzioni","number":113,"page":109,"text":"Per dispnea di classe III – NYHA si intende una dispnea che insorge:\n    (a) a completo riposo\n    (b) per sforzi lievi\n    (c) per sforzi molto intensità\n    (d) durante le ore notturne","answer":"B"},{"id":"official-109-114-4","section":"Test con soluzioni","number":114,"page":109,"text":"Il quarto tono S4 compare in:\n    (a) protosistole\n    (b) telesistole\n    (c) protodiastole\n    (d) telediastole","answer":"D"},{"id":"official-109-115-5","section":"Test con soluzioni","number":115,"page":109,"text":"Uno sdoppiamento del II tono S2 può essere provocato da:\n    (a) stenosi mitralica\n    (b) stenosi aortica\n    (c) embolia polmonare\n    (d) blocco di branca sinistra","answer":"D"},{"id":"official-109-116-6","section":"Test con soluzioni","number":116,"page":109,"text":"Per polso bigemino si intende:\n    (a) l’alternanza di una extrasistole e due battiti sinusali\n    (b) la successione di tre extrasistoli e due battiti sinusali\n    (c) una aritmia scatenata da stimolazione del nervo trigemino\n    (d) alternanza di una extrasistole e un battito sinusale","answer":"D"},{"id":"official-109-117-7","section":"Test con soluzioni","number":117,"page":109,"text":"Il riscontro di aumento del FVT, ipofonesi, soffio bronchiale indica:\n    (a) polmonite alveolare\n    (b) bronchite acuta\n    (c) pleurite trasudativa\n    (d) enfisema polmonare","answer":"A"},{"id":"official-109-118-8","section":"Test con soluzioni","number":118,"page":109,"text":"I ronchi e i sibili sono caratteristici di:\n    (a) crisi asmatica acuta\n    (b) polmonite interstiziale\n    (c) fase inspiratoria della respirazione","answer":"A"},{"id":"official-110-119-0","section":"Test con soluzioni","number":119,"page":110,"text":"La zona di “Chauffard-Rivet” si riferisce a:\n    (a) l’area di proiezione cutanea del triangolo di Calot\n    (b) l’area triangolare di dolorabilità coledocico-pancreatica\n    (c) l’area di dolorabilità piloro-duodenale\n    (d) l’area di proiezione cutanea del bacinetto renale destro","answer":"B"},{"id":"official-110-120-1","section":"Test con soluzioni","number":120,"page":110,"text":"I prodotti di degradazione del fibrinogeno (XDP e D-Dimero):\n    (a) sono normalmente presenti nel siero\n    (b) inducono un aumento del PT\n    (c) aumentano nella Coagulazione Intravascolare Disseminata\n    (d) aumentano nel deficit di vitamina K","answer":"C"},{"id":"official-110-121-2","section":"Test con soluzioni","number":121,"page":110,"text":"I reticolociti:\n    (a) sono normalmente <4%\n    (b) aumentano nelle emorragia acute e croniche\n    (c) aumentano nell’anemia sideropenica\n    (d) aumentano nelle infezioni","answer":"B"},{"id":"official-110-122-3","section":"Test con soluzioni","number":122,"page":110,"text":"Per polmonite acquisita in ospedale si intende:\n    (a) Polmonite acquisita dopo 48 ore di degenza in ospedale, non presente al momento del\n       ricovero\n    (b) polmonite che ha provocato il ricovero in ospedale\n    (c) polmonite da legionella pneumoniae contratta in ospedale\n    (d) polmonite che necessita di assistenza ventilatoria e ossigenoterapia ospedaliera","answer":"A"},{"id":"official-110-123-4","section":"Test con soluzioni","number":123,"page":110,"text":"Quale variazione dei seguenti parametri è presente in corso di acidosi metabolica:\n    (a) ↓pCO2 ↑anion gap\n    (b) ↑pCO2 ↓anion gap\n    (c) ↑pCO2 ↔anion gap\n    (d) ↓pCO2 ↓anion gap","answer":"A"},{"id":"official-110-124-5","section":"Test con soluzioni","number":124,"page":110,"text":"Quale dei seguenti risultati è indicativo di ipotiroidismo primario:\n    (a) presenza di anticorpi anti-recettore TSH\n    (b) ↑TSH ↓FT4\n    (c) ↓TSH ↓FT4\n    (d) ↑TSH ↑FT4","answer":"B"},{"id":"official-110-125-6","section":"Test con soluzioni","number":125,"page":110,"text":"Quale dei seguenti parametri non è compatibile con una diagnosi di iperaldosteronismo?\n    (a) Alcalosi metabolica\n    (b) ↑[Na+] siero\n    (c) ↓[K+] siero\n    (d) ipotensione","answer":"D"},{"id":"official-110-126-7","section":"Test con soluzioni","number":126,"page":110,"text":"Quale dei seguenti marcatori di infarto del miocardio ritorna prima ai livelli normali:\n    (a) CPK-2\n    (b) Troponina\n    (c) Mioglobina\n    (d) LDH-1","answer":"C"},{"id":"official-110-127-8","section":"Test con soluzioni","number":127,"page":110,"text":"La densità delle piastrine nel sangue è:","answer":"A"},{"id":"official-111-128-0","section":"Test con soluzioni","number":128,"page":111,"text":"Il limite dell’assunzione di alcool giornaliera nell’uomo è di:\n    (a) 3 grammi\n    (b) 30 grammi\n    (c) 3000 grammi\n    (d) 6000 grammi","answer":"B"},{"id":"official-111-129-1","section":"Test con soluzioni","number":129,"page":111,"text":"Per disfagia paradossa si intende:\n    (a) La deglutizione dolorosa del bolo alimentare\n    (b) la generica difficoltà negli atti di deglutizione dei cibi liquidi\n    (c) una alterazione della deglutizione per i liquidi ma non per i solidi\n    (d) l’assunzione eccessiva di cibi molto nutrienti","answer":"C"},{"id":"official-111-130-2","section":"Test con soluzioni","number":130,"page":111,"text":"Per polidipsia di intende:\n    (a) un aumento dell’assunzione di liquidi\n    (b) una diminuzione del senso di sazietà\n    (c) una contrazione della diuresi\n    (d) una diminuzione della sensazione di sete","answer":"A"},{"id":"official-111-131-3","section":"Test con soluzioni","number":131,"page":111,"text":"Il sanguinamento causato da lesione del sigma-retto è caratterizzato da emissione di:\n    (a) emissione di sangue “piceo” con feci diarroiche\n    (b) emissione di sangue nerastro con feci formate\n    (c) emissione di sangue che riveste il cilindro fecale\n    (d) tutte le condizioni precedenti","answer":"C"},{"id":"official-111-132-4","section":"Test con soluzioni","number":132,"page":111,"text":"La temperatura corporea nella febbre intermittente è caratterizzata da:\n    (a) variazioni della curva termica con normalizzazione dei valori durante le 24 ore\n    (b) variazioni>1°C persistentemente al di sopra dei valori normali\n    (c) variazioni<1°C persistentemente al di sopra dei valori normali\n    (d) escursione termica superiore a 2°C nelle 24 ore","answer":"A"},{"id":"official-111-133-5","section":"Test con soluzioni","number":133,"page":111,"text":"Per dispnea di cla cialMove(1)">Successiva →</button></div></div>`:'<p class="muted">Nessuna domanda trovata.</p>'}<p class="official-meta">Le domande mantengono anche gli eventuali refusi del documento originale. Le risposte sono riportate solo dove compare una chiave nel PDF.</p>`;
